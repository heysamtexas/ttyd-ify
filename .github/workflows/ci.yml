name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        # shellcheck already ships in the runner image, and installing it anyway wedged two
        # runs of #97 for ten minutes each. `apt-get update` blocks on the apt frontend lock
        # while the image's own unattended-upgrades holds it, and `-qq` suppresses the
        # "Waiting for cache lock" line it would otherwise print — so the step sat silent,
        # produced not one line of output, and looked identical to a hang in shellcheck
        # itself. Which VM loses that race is luck, which is why the other jobs passed in
        # the same run.
        #
        # So: use what is there, and if a future image drops it, wait on the lock for a
        # bounded time and say so rather than blocking forever.
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -o DPkg::Lock::Timeout=120
            sudo apt-get install -y -o DPkg::Lock::Timeout=120 shellcheck
          fi
          shellcheck --version
          # Keep this list in sync with the `lint` target in Makefile — they are
          # duplicated, and neither will tell you a file was skipped.
          shellcheck bin/wt-serve bin/wt-bind.sh \
                     install.sh uninstall.sh fetch.sh docs/bashrc-snippet.sh \
                     test/stub-start-command.sh test/install-uninstall.sh test/smoke.sh \
                     test/fetch.sh

      - name: fetch.sh refuses what it should (#84, #86)
        # The checksum gate is the only integrity check between a network download and a root-owned
        # binary serving an unauthenticated shell, and it had never executed anywhere. Runs here
        # rather than in a container job because it is hermetic: test/fake-release.py serves the
        # fixtures on localhost, so a broken release can be simulated without publishing one.
        run: test/fetch.sh

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod pins the language level at 1.22 (the Ubuntu 24.04 toolchain), so a
          # newer toolchain here is fine and still builds what a dev box builds.
          go-version: '1.22'
      - name: dependencies
        # dtach is a TEST dependency here, and not an optional one (#47). Eight tests open with
        # exec.LookPath("dtach") and t.Skip, so without it they vanish from this job while it
        # still goes green — including the only assertions that WT=1 reaches a session's shell,
        # that replay works through a real `dtach -A`, and that the signal ladder and the
        # three-state socket probe behave against a real socket. None of those are reachable
        # with test/stub-start-command.sh.
        run: |
          sudo apt-get update -qq -o DPkg::Lock::Timeout=120
          sudo apt-get install -y -qq -o DPkg::Lock::Timeout=120 dtach
          # dtach has no --version; being on PATH is exactly what LookPath checks for.
          command -v dtach
      - name: spec is in sync with api/openapi.yaml
        run: make spec-check
      - name: spec pointers resolve and served prose carries no citations
        run: make spec-guards
      # Keep in sync with the `lint` target in Makefile — this job duplicates its steps
      # rather than calling it, so a new guard there does not reach CI on its own.
      - name: the unit keeps its sessions alive across a restart
        run: make unit-guards
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd test)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        # -race: the hub's replay/live seam is a concurrency invariant, and this is the only
        # gate that can catch it regressing. See the same flag in the Makefile's lint target.
        run: go test -race ./...
      - name: build
        run: go build ./...

  conformance:
    # Proves wtd is wire-compatible with the ttyd it replaced. The native iOS client speaks
    # ttyd's protocol directly, so drift here breaks a shipped app with no compile error
    # anywhere.
    #
    # ttyd is retired from the product (#23) but kept here as a TEST-ONLY dependency, on
    # purpose. Deleting this job would not just stop re-verifying the claim — it would delete
    # the only assertion of four wire facts that exist nowhere else in the suite: the
    # preferences payload being `{ }` rather than `{}`, TERM=xterm-256color reaching a /ws
    # child, the handshake's dimensions arriving before the child's first write, and the
    # server's opcode order. Nothing else can tell us what ttyd 1.7.4 actually did.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: install ttyd (test-only dependency; not installed on a real box)
        run: |
          sudo apt-get update -qq -o DPkg::Lock::Timeout=120
          sudo apt-get install -y -o DPkg::Lock::Timeout=120 ttyd
          ttyd --version
      - name: run both servers against the stub start command
        run: |
          chmod +x test/stub-start-command.sh
          go build -o /tmp/wtd ./cmd/wtd
          ttyd -i 127.0.0.1 -p 7686 -W -a "$PWD/test/stub-start-command.sh" &
          /tmp/wtd -listen 127.0.0.1:7687 -start-command "$PWD/test/stub-start-command.sh" &
          for _ in $(seq 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:7686/token \
               && curl -fsS -o /dev/null http://127.0.0.1:7687/token; then break; fi
            sleep 0.25
          done
      - name: compare
        env:
          CONFORMANCE_TTYD: http://127.0.0.1:7686
          CONFORMANCE_WTD: http://127.0.0.1:7687
        run: go test ./cmd/wtd -run Conformance -v

  smoke:
    # The other half of the `install` job below (#79). That one stubs systemctl and wtd, so it
    # proves the right files land and the refusals fire — and nothing more. Until this job existed
    # CI had never started wt.service: nothing asserted that the unit comes up, that anything
    # answers on the port, that the version served is the binary that was built, or that a restart
    # keeps its sessions — #24 closed with a grep of the unit file for KillMode=process, which is a
    # string in a file rather than #21's actual invariant.
    #
    # A container with real systemd, not the runner VM, and the reason is fidelity rather than
    # safety: the runner is not a fresh machine — Go, node, docker and a passwordless-sudo user are
    # already on it — while `ubuntu:24.04` plus systemd is close to the box an agent installs onto
    # having never seen it. It also reruns identically on a developer box, which a runner-VM job
    # never can. See the header of test/smoke.sh for that command.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: build wtd the way a box without Go receives it
        # CGO_ENABLED=0 for the same reason release.yml uses it: `make build`'s default output links
        # against the runner's glibc, and a dynamically linked binary is exactly the artifact class
        # that dies on a box with an older one. Static is also what `make fetch` delivers, so this is
        # the acquisition path a real install takes. install.sh finds ./wtd and uses it — there is no
        # Go in the container, which is what makes that the path under test.
        #
        # The version string is whatever `git describe` yields here, which at checkout's default
        # fetch-depth is a bare SHA rather than a tag. That is fine: the assertion compares the
        # served version to this binary, so what it proves is that -X main.version survives the
        # install, not that the string looks like a release.
        run: CGO_ENABLED=0 GOTOOLCHAIN=local go build -trimpath -ldflags "-X main.version=$(git describe --tags --always --dirty)" -o wtd ./cmd/wtd

      - name: boot a machine with real systemd
        # Explicit `docker run`, NOT the `container:` job key: that key overrides the image
        # entrypoint, so PID 1 would not be systemd and every systemctl call would fail to find a
        # bus.
        #
        # --privileged and nothing else. It is what lets this container's systemd manage cgroups, it
        # is root-equivalent on the host, and it is why the container is deleted immediately below.
        # A `--cgroupns=host` plus a rw bind of /sys/fs/cgroup was here and is gone: those are
        # cgroup-v1-era incantations, the runners are cgroup v2, and reaching into the host's cgroup
        # tree is a wider blast radius than this test needs. No port is published either — the
        # unauthenticated shell wt.service starts is reachable only from the container's netns.
        #
        # The checkout is mounted read-only. Nothing in the install writes into it, so a mount that
        # cannot be written is a guarantee rather than a limitation.
        run: |
          docker build -f test/Dockerfile.systemd -t ttyd-ify-systemd .
          docker run -d --name wt-smoke --privileged --tmpfs /run \
            -v "$PWD:/src:ro" ttyd-ify-systemd

      - name: install for real, serve a terminal, restart it, uninstall
        # No `systemctl is-system-running --wait` step: that call needs the bus in order to wait on
        # one, so before systemd is up it fails with the error it looks like it would prevent. The
        # script polls for a settled state itself.
        run: docker exec wt-smoke /src/test/smoke.sh

      - name: the service's journal, when something failed
        if: failure()
        run: docker exec wt-smoke journalctl -u wt.service --no-pager || true

      - name: tear the machine down
        if: always()
        run: docker rm -f wt-smoke || true

  install:
    # install.sh and uninstall.sh write to absolute paths (/usr/local/bin,
    # /etc/systemd/system, /etc/ttyd-ify), so they cannot be tested on a machine anyone
    # cares about. A container is the only place this is safe — and uninstall.sh went a
    # long time with no execution behind it for exactly that reason.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: dependencies
        run: |
          apt-get update -qq -o DPkg::Lock::Timeout=120
          apt-get install -y -qq -o DPkg::Lock::Timeout=120 dtach
      - name: install, re-install, uninstall, purge
        run: test/install-uninstall.sh
