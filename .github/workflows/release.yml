name: release

# Publishes wtd binaries on a version tag. This exists because beta users do not have a Go
# toolchain: without release assets, wtd is installable only by people who can build it,
# and install.sh correctly refuses to guess.
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write     # needed to create the release and upload assets
  id-token: write     # sign the provenance attestation (OIDC, no key to hold)
  attestations: write # publish it against this repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod pins the language level at 1.22; a newer toolchain here would still
          # build the same thing, but matching keeps release builds identical to CI builds.
          go-version: '1.22'

      - name: build linux/amd64 and linux/arm64
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            # CGO_ENABLED=0 keeps these static: creack/pty is pure syscalls, so there is no
            # reason to inherit a glibc version floor on someone else's box.
            # -trimpath strips local paths so the binary does not leak the builder's layout.
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/wtd-linux-$arch" ./cmd/wtd
          done
          (cd dist && sha256sum wtd-linux-* > SHA256SUMS)
          ls -la dist

      - name: sanity-check the artifacts
        run: |
          set -euo pipefail
          # The native one must actually run and report the tag it was stamped with.
          got="$(./dist/wtd-linux-amd64 -version)"
          echo "amd64 reports: $got"
          [ "$got" = "${GITHUB_REF_NAME}" ] || { echo "version stamp mismatch"; exit 1; }

          # arm64 cannot execute here, so assert on the ELF header instead — a silently
          # mis-targeted binary is the classic cross-compile failure.
          file dist/wtd-linux-arm64 | tee /dev/stderr | grep -q 'ARM aarch64'
          file dist/wtd-linux-amd64 | tee /dev/stderr | grep -q 'x86-64'

          # Both must be static; a dynamic binary would fail on a different distro.
          for f in dist/wtd-linux-*; do
            if file "$f" | grep -q 'dynamically linked'; then
              echo "$f is dynamically linked, expected static"; exit 1
            fi
          done

      - name: attest that these binaries came from this workflow (#85)
        # SHA256SUMS travels with the binaries, from the same URL, so it proves a download was not
        # truncated and nothing more: whatever could replace one could replace the other. This signs
        # a provenance statement — this repo, this workflow, this commit — that a consumer checks
        # with `gh attestation verify wtd-linux-amd64 --repo heysamtexas/ttyd-ify`.
        #
        # It matters here more than in most projects because CLAUDE.md's installer is an agent on a
        # machine it has never seen, which cannot ask anyone whether a download looks right. A check
        # it can run is the only assurance available to it.
        #
        # Scope: the binary. install.sh and bin/* are trusted because they were cloned over TLS, and
        # this does not change that.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/wtd-linux-*'

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wtd-linux-amd64
            dist/wtd-linux-arm64
            dist/SHA256SUMS
          body: |
            `wtd` binaries for Linux. To deploy *these* bytes — on any box, with or without
            a Go toolchain:

            ```sh
            git clone https://github.com/heysamtexas/ttyd-ify && cd ttyd-ify
            make fetch          # downloads the matching binary, verifies checksum + provenance
            sudo ./install.sh   # NOT `make install` — see below
            ```

            `make install` runs `make build` first whenever `go` is on the box, which
            overwrites the binary `make fetch` just verified with a local rebuild. Both are
            stamped from the same tag, so `wtd -version` and `/api/v1/meta` report the same
            string either way and nothing downstream can tell them apart. Use `make install`
            when you *want* a build from source; use `sudo ./install.sh` to install what you
            just downloaded.

            These binaries carry a signed build provenance attestation. To check one came
            from this repo's release workflow rather than merely matching a checksum served
            beside it:

            ```sh
            gh attestation verify wtd-linux-amd64 --repo heysamtexas/ttyd-ify
            ```

            `make install` enables `wt.service`, which serves `wtd` on `WT_PORT` (7681).
            ttyd is retired as of #23: upgrading replaces it in place, and the install
            refuses up front if your config sets `WT_AUTH` or `WT_TTYD_ARGS`, which `wtd`
            cannot honor. Installing does not restart a running service — that command
            drops connected clients, so it is left to you:

            ```sh
            sudo systemctl restart wt.service
            ```

            ⚠ This serves a writable, unauthenticated shell. It is only as private as the
            interface `WT_BIND` puts it on.
