# wtd HTTP API — OpenAPI 3.1. Served to clients verbatim as GET /openapi.json, rendered
# by `make spec` into cmd/wtd/openapi.json; `make lint` fails on drift.
#
# EDITORIAL RULE for this file — descriptions state what a client can observe and must
# do. Mechanism, derivation, provenance and verification belong in the companion
# documents below, or — when a fact's home is the line it annotates — in a YAML comment
# like this one, which `make spec` drops and no client is charged for.
#
# Per sentence: is it ACTIONABLE (could a client change code because of it?), is it
# REACHABLE (usable without a checkout of this repo?), is it SUBSTITUTABLE (would the
# observable consequence plus a pointer carry the same decision?). First "no" evicts it.
# Two carve-outs: naming an internal in order to FORBID depending on it is actionable,
# and so is a limit a client budgets against — keep the number, drop the derivation.
#
# A pointer here is provenance for a maintainer, never part of the contract: none of
# these documents are served, so if cutting a mechanism leaves a client needing to
# follow one, an observable was cut by mistake. Restore the observable, keep the pointer.
#
# Companion documents are SERVED by this same binary, so every reference below is a URL a
# reader can fetch — not a filename in a repository they may not have:
#   /docs/ws-protocol.md        — the /ws WebSocket protocol (OpenAPI cannot express it)
#   /docs/session-lifecycle.md  — session states, staleness, reaping, cleanup ordering
#   /docs/compatibility.md      — ttyd 1.7.4 vs wtd behavior matrix

openapi: 3.1.0

externalDocs:
  description: >
    The WebSocket protocol, the session model, and the ttyd compatibility matrix — served by
    this binary at /docs/, so this reference resolves for any reader that can reach the API.
  url: /docs/ws-protocol.md

info:
  title: wtd HTTP API
  version: 0.1.0
  summary: >
    Browser terminal daemon: ttyd-wire-compatible WebSocket terminal plus a JSON API
    over dtach sessions.
  description: |
    ## Security model — read before adding anything

    This service fronts a **writable, unauthenticated shell** running as the service
    user. There is **no authentication at any layer of this API, by design** — access
    control is the network interface the daemon binds to (a tailnet IP, `127.0.0.1`,
    or a specific interface; wtd refuses `0.0.0.0`/`::` even when explicitly
    configured). Every endpoint below is reachable by anyone who can reach the port.
    The question for any change to this file: *does it widen who can reach the shell?*

    ## CSRF and cross-origin policy (normative for every route)

    Because there is no auth, the classic CSRF mitigations-by-credential do not exist;
    any web page a user visits can attempt requests against a tailnet IP. Therefore:

    - **Mutating routes** (`POST`, `DELETE`) reject any request carrying an `Origin`
      header whose authority (host[:port]) differs from the request's `Host`
      authority → `403` with code `origin_forbidden`. `Origin` is the **only** header
      consulted: `Referer`, `Sec-Fetch-Site` and `Sec-Fetch-Mode` are never read, so
      setting them changes nothing. The comparison is case-insensitive and ignores the
      scheme, so only the authority has to match. Three outcomes, exhaustively:

      | `Origin` on the request | result |
      |---|---|
      | absent, or present but empty | **accepted** — native clients (the iOS app's URLSession) send none |
      | authority equals `Host` | **accepted** — wtd's own picker pages are same-origin |
      | anything else, including the literal `null` | **403** `origin_forbidden` |

      The `null` row is the one worth planning for, because a client does not always
      choose its own `Origin`: sandboxed iframes, `file://` documents and some WebView
      configurations have `Origin: null` forced on them by the engine. Such a context
      cannot call the mutating routes at all, and no request header will change that —
      use a native HTTP client, which sends no `Origin`, or serve your page from wtd
      itself so it is same-origin. Reverse proxies must preserve the original `Host`
      header or this check will reject legitimate browsers.
    - **`POST` routes** additionally require `Content-Type: application/json`
      → `415` with code `unsupported_media_type` otherwise. HTML forms cannot send
      `application/json`, which kills form-based CSRF outright.
    - wtd **never** sends `Access-Control-Allow-Origin: *` — or any CORS headers at
      all on `/api/*`. CORS headers exist to *grant* cross-origin access; this API
      must never grant it. So a browser-based client cannot call this API from another
      origin and no header will change that: serve your page from wtd itself (`GET /`),
      or use a native client, which sends no `Origin` and is unaffected.
    - Request bodies are capped at 16 KiB → `413` with code `payload_too_large`.
    - The same Origin policy applies to the `/ws` upgrade itself — see
      `/docs/ws-protocol.md` section 12; a cross-site WebSocket is a cross-site shell. One
      difference on that path: the rejection comes from the WebSocket layer before any handler
      runs, so it is a plain-text `403`, **not** the JSON `Error` object every route below
      returns. Do not try to parse a body for `origin_forbidden` there — the status is the
      whole signal.

    Residual exposure, stated honestly: the Origin-vs-Host comparison stops ordinary
    cross-site requests (Origin names the attacker's site, Host names this server —
    mismatch, rejected). It does **not** stop DNS rebinding, where the victim's
    browser requests `http://attacker-hostname:7681/...` after the attacker's DNS
    flips to this IP — then Origin and Host both name the attacker's hostname, they
    match each other, and the check passes, `/ws` included. The only complete fix is
    validating `Host` against an allowlist; a `WT_ALLOWED_HOSTS` config key is
    reserved for that and deliberately **not** in v1, because unconfigured it would
    break tailnet MagicDNS names and raw-IP access, and a misconfigured allowlist
    locks the owner out of their own box. What contains rebinding meanwhile is the
    precondition it needs: the victim's *browser* must itself be on the private
    network this daemon binds to. That is the repo's standing security stance — the
    service is exactly as private as the interface it binds to — restated, not
    weakened.

    **There is no client-side action here, and that is deliberate.** Rebinding
    targets a browser the attacker lures to a page they control; it does not target
    your client, and nothing a legitimate client sends changes the outcome. In
    particular, connecting by raw IP rather than a tailnet MagicDNS name neither helps
    nor hurts — the check compares `Origin` against whatever `Host` you sent, so both
    are accepted and neither is the safer choice. Use whichever is convenient. The
    mitigation, if this deployment ever needs one, is server-side (`WT_ALLOWED_HOSTS`)
    and would be announced as a feature flag.

    ## Path behavior outside this spec

    - `GET /` serves HTML: with no `?arg=` query parameter, the **browser session
      picker** (lists dtach sessions, links to `/?arg=<name>`); with `?arg=` present
      (even empty), the **terminal page**, whose script opens
      `ws://<host>/ws + location.search` exactly as ttyd's bundled client does. Pages
      use relative URLs so they work behind a path-stripping reverse proxy.
    - `GET /ws` is the terminal WebSocket — the entire contract is
      `ws-protocol.md`. It appears below only as a stub so the path is not "free".
    - Unknown paths → `404` with the standard error object. Known paths with wrong
      methods → `405`, code `method_not_allowed`.
    - All `/api/*` and `/token` responses carry `Cache-Control: no-store`.

    ## Error object

    Every non-2xx response from `/token`, `/healthz`, and `/api/*` is the `Error`
    schema: `{"error": {"code": "...", "message": "...", "detail": "..."}}`. `code`
    is a stable machine-readable string from the registry below (clients switch on
    `code`, never on `message`); `message` is one human-readable sentence; `detail`
    is optional elaboration. The registry is open-ended — clients MUST treat unknown
    codes as opaque failures of the given HTTP status.

    | code | HTTP | meaning |
    |---|---|---|
    | `bad_request` | 400 | Body is not a JSON object, or violates the schema in a way not covered below. |
    | `invalid_name` | 400 | Session name fails the create-side rules, including a deployment-specific length ceiling that `detail` states. |
    | `invalid_path` | 400 | `path` is not absolute, contains control bytes, does not exist, or is not a directory. |
    | `unknown_project` | 400 | `project` names no entry in the projects file. |
    | `project_path_missing` | 400 | Project exists but its path does not; the API refuses to guess a fallback. |
    | `path_and_project` | 400 | Both `path` and `project` were supplied; they are mutually exclusive. |
    | `already_exists` | 409 | A session with this name already exists, including one whose death could not be established — it is reported rather than silently replaced. |
    | `not_found` | 404 | No such session / no such route. |
    | `origin_forbidden` | 403 | Cross-origin request on a mutating route (or the /ws upgrade). |
    | `unsupported_media_type` | 415 | POST without `Content-Type: application/json`. |
    | `payload_too_large` | 413 | Body over 16 KiB. |
    | `method_not_allowed` | 405 | Known path, wrong method. |
    | `internal` | 500 | Unexpected server fault; `detail` says what, socket state untouched unless stated. |

    ## What "ttyd-compatible" means here

    Every compatibility claim in this document — the `/ws` wire protocol, `GET /token`,
    `?arg=` handling, the `-W` and `-a` behaviours — is against **ttyd 1.7.4**, and no
    other release: <https://github.com/tsl0922/ttyd/releases/tag/1.7.4>. The version is
    load-bearing rather than incidental, because ttyd's wire protocol is not stable
    across releases; a client author whose fallback is reading ttyd's source needs to
    know *which* source, and a client tested against a different ttyd may be testing
    against a different protocol. Where wtd deliberately diverges from 1.7.4,
    `/docs/compatibility.md` lists it row by row.

    ## Features registry (`GET /api/v1/meta`)

    The `features` array is the **anti-skew mechanism** between this repo and the iOS
    client: the two repos share no CI, no type checking, and installed phone builds
    do not update when the server does. A client MUST feature-detect any capability
    beyond the ttyd-compatible core (`/`, `/ws`, `/token`) by checking this list, and
    MUST ignore feature strings it does not recognize.

    | feature | meaning |
    |---|---|
    | `token` | `GET /token` served (ttyd compat). |
    | `url-arg` | `?arg=` is appended to the start command argv (always on in wtd). |
    | `writable` | Terminal input is accepted (always on in wtd; ttyd `-W`). |
    | `sessions-api` | `GET/POST /api/v1/sessions`, `DELETE /api/v1/sessions/{name}`. |
    | `projects-api` | `GET /api/v1/projects`. |
    | `picker-ui` | `GET /` serves the HTML picker when no `?arg=` is present. |
    | `scrollback-replay` | A named (`?arg=`) connection is sent the session's recent output on attach, before live output. |
    | `docs-endpoint` | `GET /docs/{file}` serves the documents this spec references, so every reference in it resolves. |
    | `session-read` | `GET /api/v1/sessions/{name}` reads one session, so the `Location` header a create returns is fetchable. |
    | `session-status` | A session carries `agentStatus`: what the agent running in it last reported about itself. |
    | `host-health` | `GET /api/v1/host`: what the machine itself is doing, and what each session costs. |

    **A flag's meaning never narrows, so gate on the flag that names what you want.**
    `sessions-api` covers list, create and delete as one unit; this server has no mode
    in which some of the three work and others do not, so do not probe them
    independently. If one ever does become independently optional it gets its own flag
    *alongside* `sessions-api`, which keeps meaning all three — the way `session-read`
    was added for `GET /api/v1/sessions/{name}` rather than folded into the existing
    flag. Two consequences for a client: a capability you cannot find a flag for is one
    this document does not offer yet, not one you should feature-test by calling it; and
    an unrecognized flag is always additive, so ignoring it is always safe.

    **`sessions-api` will not be withdrawn, and clients are entitled to rely on that.** The
    primary client treats a server that answers but does not advertise it as an *error* — it
    shows "Not a wtd Server", offers Retry, and names SSH as the recovery path — rather than
    falling back to a bare terminal. That degraded mode was removed deliberately, so dropping
    the flag from a future server would not degrade those clients, it would lock them out. The
    same is not true of `session-read`, which is genuinely optional: a client that misses it
    falls back to list-and-filter.

    Reserved for the future (a server advertising one implements its spec revision):
    `auth-basic`, `base-path`, `tls`, `flow-control`.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: "http://{host}:{port}"
    description: >
      wtd's single listener, and the only server that serves this document. host is
      the resolved bind address — a tailnet IP, 127.0.0.1, or an interface address,
      never a wildcard.

      **Use port 7681 (`WT_PORT`).** One box runs one listener on one port, and it
      serves every route in this document. A server that answers `/`, `/token` and
      `/ws` but returns 404 for `/openapi.json`, the `/api/v1/*` routes and the picker
      is an older deployment that has not been upgraded; `GET /api/v1/meta` succeeding
      is the cheapest proof you are talking to wtd, and its `features[]` is how to
      test for anything newer than this revision.
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "7681"

paths:
  /:
    get:
      operationId: getRoot
      summary: Browser picker (no ?arg=) or terminal page (?arg= present)
      description: |
        HTML, not API. Without `arg`: the browser session picker. With `arg` (even
        empty): the terminal page, which forwards its full query string to `/ws`,
        matching ttyd's own client — so a deep link opens the named session directly.
      parameters:
        - name: arg
          in: query
          required: false
          description: >
            Session name to deep-link. A malformed or unusable name opens a plain shell
            instead — a graceful fallback, never an error. The page forwards this to `/ws`
            unchanged, so the rules there apply verbatim.
          schema:
            type: string
      responses:
        "200":
          description: HTML page.
          content:
            text/html:
              schema:
                type: string

  /help:
    get:
      operationId: getHelp
      summary: Terminal help page (HTML, human-facing)
      description: >
        HTML, not API. A short FAQ for people using the browser terminal — keyboard
        gotchas, disconnect behaviour, session sharing. The terminal page shows the
        same document in its "?" overlay.
      responses:
        "200":
          description: HTML page.
          content:
            text/html:
              schema:
                type: string

  /ws:
    get:
      operationId: terminalWebSocket
      summary: Terminal WebSocket (ttyd wire protocol)
      externalDocs:
        description: The full normative wire contract, including everything this description summarises.
        url: /docs/ws-protocol.md
      description: |
        Not an HTTP resource in any REST sense — this path upgrades to the ttyd
        `tty`-subprotocol WebSocket. OpenAPI cannot express a WebSocket protocol, so what
        follows is the working contract in prose. It is enough to build a client; the full
        normative version, including every failure mode, is `/docs/ws-protocol.md`.

        ## Connecting

        Open `ws://<host>:<port>/ws`, offering subprotocol `tty`. The server echoes it, which
        browsers require. Offering **none** also works and the connection proceeds with no
        subprotocol selected; offering others **without** `tty` is a `400` before the upgrade,
        so check the status rather than waiting for a close code. `GET /token` first if you want ttyd parity — its value goes in the handshake —
        but the token here is always the empty string.

        ## The handshake

        The **first** message after the upgrade is the handshake, and it is the one message with
        **no opcode prefix**. Send `TerminalHandshake` as **either a text or a binary** frame;
        both are accepted, which matters because ttyd's own web client sends binary and other
        clients send text.

        Send real `columns`/`rows`, as **numbers**. Missing or out-of-range values (outside
        **1..65535**) default to **80x25 silently**, and the size is applied before the start
        command runs — so a narrow client that omits them gets a session hard-wrapped for 80
        columns with no error anywhere. A dimension that is not a number at all (`"80"`, `80.5`,
        `true`) is not defaulted: it makes the payload undecodable and closes **1002**.

        Unknown keys are ignored. Not-JSON closes **1002**; no handshake within **10 s** closes
        **1008**; over **8 KiB** closes **1009**.

        ## Framing, after the handshake

        Every subsequent message is `[1 ASCII opcode byte][payload]`, applied to the reassembled
        message rather than to transport fragments.

        | Client → server | Byte | Payload |
        |---|---|---|
        | `INPUT` | `'0'` | Raw bytes, written to the terminal verbatim. No escaping, no encoding. |
        | `RESIZE_TERMINAL` | `'1'` | `TerminalResize` as JSON. |
        | `PAUSE` / `RESUME` | `'2'` / `'3'` | Accepted for ttyd parity and **no-ops here**; see the `flow-control` feature. |

        | Server → client | Byte | Payload |
        |---|---|---|
        | `OUTPUT` | `'0'` | Raw terminal bytes. |
        | `SET_WINDOW_TITLE` | `'1'` | UTF-8 string; display verbatim, nothing parses it. |
        | `SET_PREFERENCES` | `'2'` | JSON, always `{}` here. |

        Client messages may be text or binary. **Server messages are always binary.**

        ## Three rules that silently corrupt rendering

        1. **The first two server frames are the title and the preferences**, in that order,
           before any output. Feed them to a terminal emulator and it prints them on screen.
        2. **`OUTPUT` is not UTF-8-safe per frame.** A multi-byte character can split across two
           frames. Decode the concatenated stream, never one frame at a time, or non-ASCII output
           corrupts intermittently at frame boundaries.
        3. **Ignore unknown opcodes; do not close on them.** New opcodes may appear, and a client
           that treats byte 0 as an error never gets past its first frame. The server ignores
           unknown client opcodes for the same reason.

        ## Two kinds of connection, chosen by `?arg=` alone

        Nothing else on the wire differs.

        | | argless `/ws` | named `/ws?arg=<name>` |
        |---|---|---|
        | Process | fresh per connection, private shell | one shared session, kept alive between connections |
        | On attach | a new shell prompt | recent output replayed, then live |
        | A second client | gets its own shell | joins the same terminal, **input interleaves** |
        | You disconnect | the process is terminated | **the session keeps running** |

        `?arg=<name>` **creates the session if it does not exist** and recovers one whose previous
        process is gone — so a saved deep link works before its session has ever existed, and
        after a reboot. You do not need to `POST` first.

        An **empty** `?arg=` counts as argless: no replay, no sharing, and the process dies with
        the connection. Build the URL without the parameter rather than with an empty one.

        **An argless connection is not how you browse sessions.** It is a plain shell in the
        service user's home directory, with no session behind it — nothing to reattach to later.
        Use `GET /api/v1/sessions` to list, and `?arg=<name>` to open one.

        A name that cannot be used still opens a working terminal — never an error, never a close.
        See the `arg` parameter for exactly what that terminal is.

        **Ctrl-`\` is shared fate on a named session.** It detaches the session, which closes
        **every** client attached to it, not only the one that sent it. Indistinguishable from a
        private detach when you are the only client.

        ## Resize, and the redraw you should not send

        Every `RESIZE_TERMINAL` frame is applied immediately, one per frame, never coalesced —
        so debouncing an interactive resize is your job. Dimensions outside 1..65535 are ignored
        rather than fatal. With several clients on one session the size is last-writer-wins:
        joining a session resizes it for everyone already there.

        **You do not need to send a resize to get output**, and you should not send a
        size-jiggle to force a redraw. This server performs that once per session itself. A
        client-side jiggle still works but repaints the screen for **every** client on a shared
        session. This is the one rule that inverts against a plain ttyd server, which does no
        redraw of its own and where a client-side jiggle is the only thing preventing a blank
        screen on attach — so gate it on the `scrollback-replay` feature rather than assuming.

        ## Replay, when `scrollback-replay` is advertised

        Recent output is replayed after the title and preferences frames, before live output.
        It arrives as **ordinary `OUTPUT` frames with no marker of any kind** — deliberately, so
        that a client which knows nothing about replay still works. Consequences:

        - **You cannot detect where replay ends.** Do not try.
        - **It overlaps whatever you already have** if you reconnect into a terminal emulator you
          kept alive. Clearing before reconnecting is your decision; the server injects nothing.
        - **It is wrapped at the width of the session that produced it**, not yours. A narrow
          client joining a wide session sees history wrapped for the wide one. Full-screen
          programs repaint; a shell's scrollback does not.
        - **Do not depend on it to render a usable screen.** An operator can disable it while the
          feature stays advertised.

        Replay covers what happened *before* you attached; your own scrollback covers what
        arrived *while* you were connected. Different mechanisms, both needed.

        ## Liveness

        **You do not have to ping** — browsers cannot, so the server never treats silence from a
        client as death. It pings every 30 s and closes after **three consecutive pings go
        unanswered**, so a live connection has 90 s of tolerance and a single lost pong costs
        nothing. Transport-level auto-pong satisfies this for free: browsers and URLSession both
        answer without any code of yours, which is why an idle terminal survives indefinitely.

        What is consulted is the **pong**, not traffic in general — sending input does not by
        itself keep a connection alive if your transport is not answering pings. No real client
        is in that position, and a hand-rolled one that suppresses pongs is the case to know
        about. There is no idle timeout below 60 s. The server answers pings with pongs and
        ignores unsolicited pongs.

        ## Limits

        Any message after the handshake over **1 MiB** closes **1009**. That is the ceiling on a
        single paste. It is unrelated to the 16 KiB cap on HTTP request bodies documented above.

        What else it takes down depends on the connection shape. On an **argless** connection the
        process is yours alone and dies with you. On a **named** one only your client is dropped —
        the session keeps running for every other client, so reconnecting lands you back in it with
        replay. One client's oversized paste cannot end a session someone else is using.

        ## Close codes, and what to do about each

        | Code | Means | Do |
        |---|---|---|
        | `1000` | The session's command exited. On a named session this is the shared command, so every client gets it. | Final. Reconnect only if the user asks. |
        | `1001` | Server shutting down, or a warm session released to make room. Sent on **named** connections; an argless one is dropped without a close frame on shutdown. | Reconnect with backoff. Sessions survive a restart. |
        | `1013` | You fell more than 4 MiB behind on output and were dropped so the session could keep going. | Reconnect immediately; replay restores context. |
        | `1002` | The first message was not a valid handshake. | Client bug. Do not retry. |
        | `1008` | No handshake within 10 s. | Client bug. Do not retry. |
        | `1009` | A message exceeded 8 KiB (handshake) or 1 MiB (after). | Client bug. The same payload fails identically. |
        | `1011` | The terminal could not be started. The title and preferences frames arrive first, then an `OUTPUT` frame with a one-line error, so the reason is visible in the terminal rather than only in a code. | Retry with backoff — but display the message. The commonest cause is a misconfigured start command, which fails the same way every time. |

        `TERM=xterm-256color` is set, so xterm-family emulation is the target.
      parameters:
        - name: arg
          in: query
          required: false
          description: >
            Session name. Present and non-empty selects a named connection, creating the session
            if it does not exist; absent or empty selects a private one. Repeats are passed
            through in order, though only the first is used today. URL-decoded before use.

            A name this server cannot build a session from does not fail the connection: it opens
            a plain shell instead, preceded by one `OUTPUT` line beginning `wtd:` that says why.
            **No value of `arg` closes the connection.** Two kinds of unusable name behave
            differently afterwards, and the difference is observable if a second client
            deep-links the same name:

            *Unusable as a session, still a name.* One containing `/` or `..`, and one whose
            socket path would exceed the operating system's limit. No session is created, but the
            connection remains a *named* one for sharing and replay — so two clients on the same
            unusable name land on **one shared fallback shell**, and both see the explanation.

            *Not carriable at all, so discarded.* A value containing a NUL byte (`%00`) or over
            **4096 bytes**. These cannot be carried as a process argument, so the server drops
            them before choosing a session. Separately, only the first **16 usable** values are
            kept and any beyond that are ignored — counted after the unusable ones are removed,
            so sending one NUL does not cost a usable value its place. A connection whose only
            `arg` was dropped is therefore **argless**: private shell, no sharing, no replay, no
            explanation, and the process ends with the connection. Two clients doing it get one
            shell each.

            Both are graceful; only the second loses the name, and only the first tells the user
            anything. Send a valid name if you want the sharing semantics.

            The length ceiling is the one `POST /api/v1/sessions` enforces, so
            `maxSessionNameLength` from `GET /api/v1/meta` is a safe bound for both — validate
            against it before deep-linking, or your user gets a bare shell where they expected
            their session. Count **bytes of the UTF-8 encoding**, not characters: both the server
            and the operating system limit measure bytes, so a name that is short in characters
            and long in bytes is refused on the byte count. The reverse does not hold — this path
            accepts names `POST` would refuse, deliberately, so that a session created by any
            means can be reached by deep link.

            Ignored repeats are dropped rather than refused, so a client cannot tell from the
            wire that it sent too many. Nothing legitimate sends more than one.

            **Use the name exactly as `GET /api/v1/sessions` returned it.** That list is
            byte-exact, and this path accepts names `POST` would refuse — an interior space is
            legitimate and common (`my project`), and **leading or trailing whitespace is
            possible too**, because nothing between the URL and the socket name trims it.
            Trimming or normalising a name before putting it in `?arg=` therefore attaches to, or
            creates, a *different* session than the one the user picked. Round-trip it verbatim.
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols; subprotocol `tty` echoed when offered.
        "400":
          description: Not a valid upgrade, or subprotocols offered without `tty`.
        "403":
          description: Cross-origin upgrade rejected (`/docs/ws-protocol.md` section 12).

  /token:
    get:
      operationId: getToken
      summary: ttyd-compatible auth token endpoint (always empty)
      description: |
        Exists solely because clients of ttyd expect it: they GET it on every connect,
        ignore failures, and send the result as the handshake `AuthToken`. wtd has no
        auth, so the token is always the empty string — the same as ttyd run without
        `-c`. Serving it keeps connect logs clean and third-party ttyd-compatible
        clients working.
      responses:
        "200":
          description: The (empty) token.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
                    const: ""
              examples:
                empty:
                  value: { "token": "" }
        "500":
          $ref: "#/components/responses/Internal"

  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: >
        Liveness for systemd, scripts, and humans with curl. Returns `{"status": "ok"}` when
        the HTTP listener is serving, and deliberately checks nothing deeper — not sessions, not
        the start command. A health check that can fail for reasons a restart will not fix
        trains people to ignore it.
      responses:
        "200":
          description: Listener is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /api/v1/meta:
    get:
      operationId: getMeta
      summary: Server identity and capability list
      description: |
        The anti-skew endpoint (see the features registry in the top-level description). Call
        it once each time you connect to a server and cache it no longer than that: it is cheap,
        and the whole point is noticing a server that changed underneath an installed client.
        Caching across app launches defeats the purpose.
      responses:
        "200":
          description: Server metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
              examples:
                devbox:
                  value:
                    version: "0.2.0"
                    features: ["token", "url-arg", "writable", "sessions-api", "projects-api",
                      "picker-ui", "scrollback-replay", "docs-endpoint", "session-read",
                      "session-status"]
                    hostname: "devbox"
                    user: "sam"
                    terminalPath: "/ws"
                    apiPath: "/api/v1"
                    maxSessionNameLength: 64
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/sessions:
    get:
      operationId: listSessions
      summary: List dtach sessions
      description: |
        Every session this server can see, sorted ascending by the byte value of `name`. Sessions
        can be created by deep link as well as by `POST`, and every surface that lists them must
        agree about what exists — which drives both rules below.

        1. **Looser names than this API would create are still listed.** A session made by
           deep-linking `/ws?arg=my%20proj` is named `my proj`; it appears here even though
           `POST` would reject that name. Do not assume listed names satisfy the create-side
           pattern. Names beginning with `.` are listed too, even though `POST` refuses them.
        2. **Dead sessions are not listed, and this request removes them.** A socket
           left behind by a session that is gone would otherwise show as a session
           that cannot be attached, so this endpoint verifies each one and unlinks the
           ones it can prove are dead. That probing is also why this read is not instant:
           budget a client timeout of a few seconds rather than a few hundred milliseconds, and
           expect the cost to grow with the number of sessions. Yes, that means a `GET` has a
           side effect; it is
           the only read every client already makes, which is why it is the one that
           converges what exists with what is listed. Why, and the guard against racing a
           session being recreated under the same name: `/docs/session-lifecycle.md` §5.
      responses:
        "200":
          description: All live sessions (possibly empty array).
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
              examples:
                two:
                  value:
                    - name: "ops"
                      attached: false
                      attachedCount: 0
                      cwd: "/home/sam/src/infra"
                      pid: 51234
                      createdAt: "2026-07-22T21:03:00Z"
                    - name: "riggs"
                      attached: true
                      attachedCount: 2
                      cwd: "/home/sam/src/riggs"
                      pid: 60211
                      createdAt: "2026-07-24T14:09:00Z"
        "500":
          $ref: "#/components/responses/Internal"

    post:
      operationId: createSession
      summary: Create a detached session
      description: |
        Creates a dtach session **without attaching**, for naming a working directory or
        project up front. It is **not** a precondition for deep-linking: `/ws?arg=<name>`
        creates the session if it does not exist, so a client can open one directly and never
        call this.

        A session created here is **indistinguishable** from one created by deep link — same
        invocation, same environment, built from the same code. That parity is mandatory, so
        anything you can do with a deep-linked session you can do with this one, and nothing
        about it will surprise a user who switches between the two.
        The invocation and the reasons each part of it matters: `/docs/session-lifecycle.md` §6.

        Working directory: `project` (a shortcut name from `GET /api/v1/projects`) or
        `path` (absolute, must exist), else the service user's `$HOME`. The two are
        mutually exclusive. Where a deep-linked connection silently falls back to `$HOME`
        for a directory that is missing, this API returns an error instead — a program
        should be told, not guessed for.

        Name rules are **stricter than the deep-link path's**, deliberately: no leading `.`
        and no `..` anywhere, the latter because such a session could never be reached by
        deep link. See the `name` property for the length ceiling, which is
        deployment-dependent.

        If the name belongs to a session that is already gone, its leftover socket is
        removed and creation proceeds — so retrying a create for a session that has
        died does the obvious thing rather than returning a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
            examples:
              byPath:
                value: { "name": "riggs", "path": "/home/sam/src/riggs" }
              byProject:
                value: { "name": "ops", "project": "ops" }
              bare:
                value: { "name": "scratch" }
      responses:
        "201":
          description: Session created, detached.
          headers:
            Location:
              description: Canonical resource path for the new session.
              schema:
                type: string
                examples: ["/api/v1/sessions/riggs"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              examples:
                created:
                  value:
                    name: "riggs"
                    attached: false
                    attachedCount: 0
                    cwd: "/home/sam/src/riggs"
                    pid: 61402
                    createdAt: "2026-07-24T21:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "409":
          description: A session with this name already exists. Two concurrent
            creates of the same name resolve to one winner and one 409. A session
            whose death cannot be established counts as existing, and is reported
            rather than silently replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                exists:
                  value:
                    error:
                      code: already_exists
                      message: "session 'riggs' already exists"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/sessions/{name}:
    get:
      operationId: getSession
      summary: Read one session
      description: >
        The same object the list returns, for one name — this is what the `Location` header on a
        `201` points at. `{name}` is URL-decoded and matched byte-exact against the names that
        exist, so a name the list shows is always fetchable even when it would fail the
        create-side rules. Detect with the `session-read` feature; a server without it forces a
        list-and-filter instead.
      parameters:
        - name: name
          in: path
          required: true
          description: Exact session name as returned by a list response, URL-encoded as needed.
          schema:
            type: string
      responses:
        "200":
          description: The session.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: No session with this name exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteSession
      summary: Terminate a session and clean up its socket
      description: |
        Terminates the session and removes its socket; `204` once the socket is gone.

        **No path is ever constructed from `{name}`** — it is URL-decoded and matched
        byte-exact against the names that actually exist. That is why this parameter
        has no validation pattern: a deep link creates names `POST` would reject, and those
        sessions must be deletable too. A name matching nothing is `404`, including anything
        containing `/`.

        Deleting an **attached** session is allowed. The live shell is terminated under
        whoever is watching it, and their connection closes normally rather than erroring;
        this API does not guess whether that is what you meant.
        Deleting a session that is **already gone** also succeeds → `204`, including one
        that has become unreachable by every other route, so `DELETE` is the way to
        clean up after a session nothing else can address.

        The session's background jobs are terminated along with it. Termination is
        bounded at roughly **7 s** worst case — budget a client timeout above that —
        which is why this endpoint answers synchronously instead of handing back a job
        to poll. Ordering, escalation, and the phantom-session failure modes the
        ordering exists to prevent: `/docs/session-lifecycle.md` §7.
      parameters:
        - name: name
          in: path
          required: true
          description: >
            Exact session name as returned by a list response, URL-encoded as
            needed.
          schema:
            type: string
      responses:
        "204":
          description: Session terminated and its socket removed.
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "404":
          description: No socket with this name exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing:
                  value:
                    error:
                      code: not_found
                      message: "no session named 'riggs'"
        "500":
          description: Termination did not complete inside the bounded ~7 s. The
            session is left as it was and is still listed, so a retry is safe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List project shortcuts
      description: |
        The shortcuts this deployment has configured, already parsed — a client never
        reads the file itself. Each entry reports `exists`, whether its path is
        currently a directory, so a client can warn before creating a session
        somewhere unexpected. A deployment with no shortcuts configured, or an
        unreadable file, is an empty list rather than an error.
      responses:
        "200":
          description: All shortcuts (possibly empty array).
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
              examples:
                two:
                  value:
                    - { "name": "dev", "path": "/home/sam/src/my-app", "exists": true }
                    - { "name": "ops", "path": "/home/sam/src/infra", "exists": false }
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/host:
    get:
      operationId: getHost
      summary: What the machine is doing, and what each session costs
      description: |
        Enough to see resource starvation coming, in one document. Detect with the
        `host-health` feature.

        **Read `pressure` before `memory`.** Available memory cannot distinguish
        reclaimable page cache from thrashing, so a box minutes away from becoming
        unreachable can report a comfortable-looking figure. `memorySome10` is the share
        of the last ten seconds in which some task was stalled waiting on memory — it
        rises while free memory still looks survivable, and it is the field to alarm on.

        **`load` is uninterpretable without `cpuCount`, which is why both are here.** A
        one-minute load of 8 is idle on 64 CPUs and terminal on 2.

        `sessions` reports each session's memory by summing resident set size across its
        process tree, with `totalRssBytes` as the aggregate. Names match `name` on
        `GET /api/v1/sessions` exactly, so the two join without a second lookup. Shared
        pages are counted once per process that maps them, so treat the figures as an
        upper bound on real footprint and as comparable to what `ps` reports rather than
        as an exact measurement.

        **Every field except `at` and `cpuCount` may be `null`, and null means this
        server could not find out** — not zero. A kernel built without pressure stall
        information reports `pressure: null`, while a healthy one reports `0.00`; a client
        that renders those the same way claims calm for a machine it knows nothing about.
        `sessions: null` likewise means the session directory could not be read, which is
        different from the empty array that means there are none.

        Intended to be polled while a client is actually displaying it. Reading it has no
        side effects: unlike `GET /api/v1/sessions` it never reaps stale sockets.
      responses:
        "200":
          description: The current reading.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
              examples:
                healthy:
                  summary: A box with headroom
                  value:
                    at: "2026-09-02T14:02:11Z"
                    uptimeSeconds: 1049322.4
                    cpuCount: 4
                    load: { one: 0.76, five: 0.61, fifteen: 0.43 }
                    memory:
                      totalBytes: 16766414848
                      availableBytes: 9553256448
                      usedBytes: 7213158400
                      swapTotalBytes: 0
                      swapFreeBytes: 0
                    pressure: { memorySome10: 0, memoryFull10: 0, cpuSome10: 1.74, ioSome10: 0 }
                    disk: { path: "/", totalBytes: 65498251264, availableBytes: 23622320128 }
                    sessions:
                      - { name: "ops", pid: 4131, rssBytes: 311427072, processCount: 7 }
                      - { name: "ttyd-ify", pid: 5522, rssBytes: 210763776, processCount: 5 }
                    totalRssBytes: 522190848
                starving:
                  summary: Memory pressure with free memory still nonzero
                  value:
                    at: "2026-09-02T14:09:03Z"
                    uptimeSeconds: 1642000.1
                    cpuCount: 2
                    load: { one: 61.4, five: 61.21, fifteen: 55.42 }
                    memory:
                      totalBytes: 8329166848
                      availableBytes: 620756992
                      usedBytes: 7708409856
                      swapTotalBytes: 0
                      swapFreeBytes: 0
                    pressure: { memorySome10: 71.4, memoryFull10: 44.2, cpuSome10: 98.1, ioSome10: 12.6 }
                    disk: { path: "/", totalBytes: 65498251264, availableBytes: 8102834176 }
                    sessions:
                      - { name: "collide-deep-brain", pid: 2201, rssBytes: 330301440, processCount: 6 }
                      - { name: "standups", pid: 2874, rssBytes: 302252032, processCount: 6 }
                    totalRssBytes: 4378853376
                noPressure:
                  summary: A kernel without pressure stall information
                  value:
                    at: "2026-09-02T14:02:11Z"
                    uptimeSeconds: 3600
                    cpuCount: 2
                    load: { one: 0.1, five: 0.1, fifteen: 0.1 }
                    memory:
                      totalBytes: 2097152000
                      availableBytes: 1572864000
                      usedBytes: 524288000
                      swapTotalBytes: 0
                      swapFreeBytes: 0
                    pressure: null
                    disk: { path: "/", totalBytes: 21474836480, availableBytes: 10737418240 }
                    sessions: []
                    totalRssBytes: 0

  /docs/{file}:
    get:
      operationId: getDoc
      summary: A specification document this server publishes
      description: >
        The documents this spec references, served so those references resolve. OpenAPI cannot
        express a WebSocket protocol, so `/docs/ws-protocol.md` is where the terminal's wire
        contract is stated in full; `/docs/session-lifecycle.md` carries the session model and
        `/docs/compatibility.md` the ttyd behaviour matrix. Markdown, intended to be read.
        Detect with the `docs-endpoint` feature.
      parameters:
        - name: file
          in: path
          required: true
          description: One of the published document names.
          schema:
            type: string
            enum: [ws-protocol.md, session-lifecycle.md, compatibility.md]
      responses:
        "200":
          description: The document.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache
          content:
            text/markdown:
              schema:
                type: string
        "404":
          description: No document by that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /openapi.json:
    get:
      operationId: getOpenApi
      summary: This specification, as JSON
      description: >
        The machine-readable contract, served by the binary that implements it so a
        client (or a person with curl) can inspect exactly what this build speaks.
        Rendered from api/openapi.yaml at build time; the served document and the
        repo file must not drift.
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code from the registry in the
                top-level description. Clients switch on this, never on message.
              # `examples`, not `enum`: the registry is open-ended by contract and clients MUST
              # treat unknown codes as opaque failures of the given status. An enum would let a
              # strict validator reject a server that adds one — the exact failure that rule
              # exists to prevent. This publishes what exists today so tooling can see it.
              examples: [bad_request, invalid_name, invalid_path, unknown_project,
                project_path_missing, path_and_project, already_exists, not_found,
                origin_forbidden, unsupported_media_type, payload_too_large,
                method_not_allowed, internal]
            message:
              type: string
              description: One human-readable sentence.
            detail:
              type: string
              description: Optional elaboration (validation specifics, errno text).

    Session:
      type: object
      description: >
        One session. How each field is derived, and how each can fail:
        `/docs/session-lifecycle.md` §2.


        **Nulls are per-response, not sticky.** Every field is re-derived from the server's
        filesystem and process table on each request — nothing is cached — so a session
        reporting `cwd: null` or `pid: null` now may carry values on the next request, and
        the reverse. A null is never a permanent property of the session. It is equally not
        a promise that retrying helps: the usual cause is a process this server cannot
        inspect, and that persists for the session's lifetime. So do not poll specially and
        do not show a spinner waiting for a value to arrive — render the absence, and let
        your next ordinary refresh fill it in if it can.
      required: [name, attached, attachedCount, cwd, pid, createdAt, agentStatus]
      properties:
        name:
          type: string
          description: >
            Deliberately unconstrained here: a deep link creates names `POST` would reject,
            such as ones containing spaces, and this API lists every session that exists. Do
            not validate a listed name against the create-side pattern.

            Always valid UTF-8, and never contains `/` — a name is a filename component on the
            server, so one cannot occur. That matters because this string is the byte-exact key
            for `GET` and `DELETE` on `/api/v1/sessions/{name}`: round-trip it unchanged,
            URL-encoding as the transport requires, and it will always match.
        attached:
          type: boolean
          description: >
            True while someone is looking at this session — through this server or over SSH,
            so `true` does not imply a client of *this* server. That sentence is the contract. How it is worked out is not,
            and has already changed once, so clients MUST NOT derive it themselves and
            in particular MUST NOT read the socket's file mode. The derivation, and why
            it changed: `/docs/session-lifecycle.md` §2.
        attachedCount:
          type: ["integer", "null"]
          minimum: 0
          description: >
            How many viewers `attached` is counting — the same population, so this is `0`
            whenever `attached` is false, and at least `1` whenever it is true and this is
            not null.

            Null means someone is attached and the server could not count them, which
            happens when the only evidence is dtach's own signalling and the viewer's
            process is not one this server can inspect. Treat it as "one or more", never as
            zero. Null is possible only while `attached` is true.

            The counted case is best-effort rather than a census. Viewers connected through
            this server are exact. Viewers attached by other means are identified from the
            server's process table, which can miss one it is not allowed to inspect, and can
            briefly count a session's own supervising process while that session is shutting
            down. So use this to tell "just me" from "someone else as well"; do not build on an
            exact value, and do not treat a change in it as an event.

            There is no way to ask which of these viewers is *you* — this server issues no
            client or connection identity, so nothing in this API could name one, and that
            is not planned. The usable substitute is arithmetic: a client that is itself
            attached to the session knows one of the count is its own, so `1` means it is
            alone and `2` or more means someone else is watching too.
        cwd:
          type: ["string", "null"]
          description: >
            Current working directory of the session's shell, read live — it moves
            when the user `cd`s, so this is not the directory the session was created
            in. Null when it cannot be resolved; the session is still valid and still
            listed.
        pid:
          type: ["integer", "null"]
          description: >
            PID of the session's shell — the same process whose `cwd` is reported
            above. Null when it cannot be resolved; the session is still valid and
            still listed.
        createdAt:
          type: string
          format: date-time
          description: >
            RFC 3339 UTC. Effectively when the session was created, but best-effort
            rather than forensic — treat it as ordering information, not evidence.
        agentStatus:
          type: ["string", "null"]
          enum: ["running", "waiting", "attention", "clear", null]
          description: >
            The last agent status this server observed on the session's own output, as
            defined by the in-band convention in `/docs/ws-protocol.md` §6a. Present only
            when `features` includes `session-status`.


            **Null means unknown, and unknown is not idle.** Null says this server has never
            observed this session's output — no client has opened it through this server — so
            it is a statement about the server, not about the session. A session used only
            over SSH stays null forever, and every session is null after a restart until
            someone opens it. `clear` is the opposite kind of fact: the session itself
            reporting that it has nothing to report. Render the two differently, or a row
            nobody has looked at will claim nothing is happening.


            **A status does not expire, so it can outlive what reported it.** §6a's limitation
            applies unchanged here: a state stands until something reports a different one, so
            an emitter killed rather than exited leaves `running` pinned. Do not add a timeout
            to work around this — §6a forbids clients inventing one, and the reasoning is
            there.


            Ignore an unrecognized value rather than treating it as `clear`, so a server that
            learns a new state does not blank your indicator.

    TerminalHandshake:
      type: object
      description: >
        The first message on a `/ws` connection, and the only one with no opcode prefix. Sent as
        either a text or a binary frame. See the `/ws` description for the framing that applies
        to everything after it.
      required: [columns, rows]
      properties:
        AuthToken:
          type: string
          description: >
            The value from `GET /token`, which is always the empty string here. Accepted and
            ignored; may be omitted entirely. Spelled with this capitalisation for ttyd parity.
        columns:
          type: integer
          minimum: 1
          maximum: 9999
          description: >
            Terminal width. Applied before the session's command starts, so this is the width it
            first renders at. Omitted or out of range silently means 80 — which on a narrow
            client produces a wrapped, unusable screen with no error, so send the real value.
        rows:
          type: integer
          minimum: 1
          maximum: 9999
          description: Terminal height. Omitted or out of range silently means 24.

    TerminalResize:
      type: object
      description: >
        Payload of a `RESIZE_TERMINAL` frame (opcode `'1'`). Applied immediately, one per frame,
        never coalesced. Out-of-range values cause the frame to be ignored, not the connection to
        close.
      required: [columns, rows]
      properties:
        columns:
          type: integer
          minimum: 1
          maximum: 9999
        rows:
          type: integer
          minimum: 1
          maximum: 9999

    SessionCreateRequest:
      type: object
      description: >
        `path` and `project` are mutually exclusive; omitting both means the
        service user's $HOME. Unknown extra properties are ignored (a newer client
        against an older server degrades predictably; capability discovery is
        /api/v1/meta's job, not schema strictness here).
      required: [name]
      properties:
        name:
          type: string
          # No lookaheads: they are legal in ECMA-262 but RE2 rejects them, so a Go or Rust
          # client generated from this document could not compile the pattern. The alternation
          # says the same thing — runs of non-dot characters joined by single dots — and length
          # lives in minLength/maxLength where a validator can act on it.
          # TestPublishedNamePatternMatchesTheValidator pins it against the server's own rule.
          #
          # The deployment-dependent ceiling is not expressible here at all (it is a function of
          # WT_DIR's depth); Meta.maxSessionNameLength carries it instead.
          pattern: '^[A-Za-z0-9_-]+(\.[A-Za-z0-9_-]+)*\.?$'
          minLength: 1
          maxLength: 64
          description: >
            Stricter than the deep-link path on purpose: a name MUST NOT start with `.` — its
            socket would be a hidden file in the session directory — and MUST NOT contain `..`
            anywhere, because such a session would exist but could never be reached by deep link.
            A deep link accepts both, so a session listed here may have either; only creation
            through this endpoint is restricted. The pattern's 64-character ceiling is an **upper bound only** — a deployment may accept fewer and
            refuses the excess with `invalid_name` (400), whose `detail` names the real
            figure. Clients SHOULD surface that `detail` rather than assume 64.
        path:
          type: string
          description: >
            Absolute directory to start the shell in. Must exist, must be a
            directory, and must not contain bytes below 0x20 or 0x7F — those are
            refused with `invalid_path` (400) rather than escaped.
        project:
          type: string
          description: A shortcut name from GET /api/v1/projects.
      not:
        required: [path, project]

    Project:
      type: object
      required: [name, path, exists]
      properties:
        name:
          type: string
        path:
          type: string
        exists:
          type: boolean
          description: >
            Whether `path` is currently a directory. False means a `POST` naming this
            project is refused with `project_path_missing` (400).

    Host:
      type: object
      description: >
        A reading of the machine, taken when the request arrived. Every property is required
        so the shape never varies, and every one except `at` and `cpuCount` is nullable
        because a reading can fail independently of the others. Null is "could not find out",
        never zero.
      required: [at, uptimeSeconds, cpuCount, load, memory, pressure, disk, sessions, totalRssBytes]
      properties:
        at:
          type: string
          format: date-time
          description: When this reading was taken. Poll responses can be deduplicated on it.
        uptimeSeconds:
          type: [number, "null"]
          description: Seconds since boot.
        cpuCount:
          type: integer
          description: >
            Logical CPUs, and the divisor `load` is meaningless without. This is the count the
            kernel schedules over, so it is not reduced by any CPU quota applied to a container.
        load:
          oneOf:
            - $ref: "#/components/schemas/HostLoad"
            - type: "null"
        memory:
          oneOf:
            - $ref: "#/components/schemas/HostMemory"
            - type: "null"
        pressure:
          oneOf:
            - $ref: "#/components/schemas/HostPressure"
            - type: "null"
          description: >
            Null where the kernel exposes no pressure stall information. A client MUST render
            that differently from a reading of zero, which means measured and idle.
        disk:
          oneOf:
            - $ref: "#/components/schemas/HostDisk"
            - type: "null"
        sessions:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/HostSession"
          description: >
            One entry per session, in the same order as `GET /api/v1/sessions`. An empty array
            means there are no sessions; null means the session directory could not be read.
        totalRssBytes:
          type: [integer, "null"]
          description: Sum of `rssBytes` across `sessions`. Null exactly when `sessions` is null.

    HostLoad:
      type: object
      description: Run-queue averages over one, five and fifteen minutes. Interpret against `cpuCount`.
      required: [one, five, fifteen]
      properties:
        one:
          type: number
        five:
          type: number
        fifteen:
          type: number

    HostMemory:
      type: object
      required: [totalBytes, availableBytes, usedBytes, swapTotalBytes, swapFreeBytes]
      properties:
        totalBytes:
          type: integer
        availableBytes:
          type: integer
          description: >
            What can be allocated without swapping, page cache included. This is the headroom
            figure, and it is the one that stays reassuring while a box thrashes — read
            `pressure` alongside it.
        usedBytes:
          type: integer
          description: >
            `totalBytes` minus `availableBytes`. This is deliberately larger than the "used"
            column of `free`, which treats reclaimable cache as unused; that answers what memory
            is doing, this answers how much headroom is left.
        swapTotalBytes:
          type: integer
          description: Zero on a host with no swap, where memory exhaustion has no slow phase.
        swapFreeBytes:
          type: integer

    HostPressure:
      type: object
      description: >
        Pressure stall information: the share of the last ten seconds spent stalled on a
        resource, from 0 to 100. `some` counts time in which at least one task was stalled;
        `full` counts time in which every task was. Rising memory pressure is the earliest
        reliable warning of exhaustion, and unlike free memory it does not look calm on the
        way down.
      required: [memorySome10, memoryFull10, cpuSome10, ioSome10]
      properties:
        memorySome10:
          type: number
        memoryFull10:
          type: number
        cpuSome10:
          type: [number, "null"]
        ioSome10:
          type: [number, "null"]

    HostDisk:
      type: object
      required: [path, totalBytes, availableBytes]
      properties:
        path:
          type: string
          description: The filesystem measured. Always the root; session storage may live elsewhere.
        totalBytes:
          type: integer
        availableBytes:
          type: integer
          description: Space available to an unprivileged writer, excluding root's reserve.

    HostSession:
      type: object
      description: >
        One session's memory cost. Join to `GET /api/v1/sessions` on `name`.
      required: [name, pid, rssBytes, processCount]
      properties:
        name:
          type: string
        pid:
          type: integer
          description: >
            The session's shell, the same value `GET /api/v1/sessions` reports. Zero where it
            could not be resolved, in which case `rssBytes` and `processCount` are also zero
            and describe nothing.
        rssBytes:
          type: integer
          description: >
            Resident set size summed over the session's process tree. Shared pages count once
            per process that maps them, so this reads high for a tree of forked processes and
            is an upper bound on real footprint. Comparable to `ps`, not exact.
        processCount:
          type: integer
          description: How many processes contributed to `rssBytes`.

    Meta:
      type: object
      required: [version, features, hostname, user, terminalPath, apiPath, maxSessionNameLength]
      properties:
        version:
          type: string
          description: wtd semantic version.
        features:
          type: array
          items:
            type: string
          description: >
            Capability strings from the registry in the top-level description.
            Clients MUST ignore unknown entries and MUST feature-detect anything
            beyond the ttyd-compatible core before using it — this list is the
            only cross-repo skew defense that exists.
        hostname:
          type: string
          description: Short hostname of the machine serving this API.
        user:
          type: string
          description: The service user — whose shell every terminal hands out.
        maxSessionNameLength:
          type: integer
          description: >
            The longest session name `POST /api/v1/sessions` will accept on **this** deployment.
            At most 64, and lower where the server's socket directory is deep enough to leave
            less room. Validate against this rather than against the schema pattern's 64, and
            rather than discovering it from a 400.
        terminalPath:
          type: string
          description: >
            Path on this server to open the terminal WebSocket at — combine it with the
            server's host and port. Always `/ws` today; read it rather than hardcoding,
            so a future deployment behind a path prefix stays discoverable.
        apiPath:
          type: string
          description: >
            Prefix every route in this document below `/api/v1` is served under — append the
            route's remainder to it, so `/api/v1/sessions` is `apiPath + "/sessions"`. Always
            `/api/v1` today, and the counterpart to `terminalPath`: the two move together if a
            deployment is ever put behind a path prefix, and reading both is what keeps a
            client working when they do. Note the scope — it covers the versioned API only, and
            says nothing about `/token`, `/healthz`, `/openapi.json`, `/docs/` or `/`, which
            are not below it and are not described by it.

  responses:
    BadRequest:
      description: Validation failure; error.code disambiguates (invalid_name,
        invalid_path, unknown_project, project_path_missing, path_and_project,
        bad_request).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            badName:
              value:
                error:
                  code: invalid_name
                  message: "name must be 1-64 characters of [A-Za-z0-9._-], must not start with '.', and must not contain '..'"
    OriginForbidden:
      description: Cross-origin request on a mutating route.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            csrf:
              value:
                error:
                  code: origin_forbidden
                  message: "cross-origin requests are not accepted"
    UnsupportedMediaType:
      description: POST body was not declared application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            wrongType:
              value:
                error:
                  code: unsupported_media_type
                  message: "Content-Type must be application/json"
    PayloadTooLarge:
      description: Body over 16 KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            tooBig:
              value:
                error:
                  code: payload_too_large
                  message: "request body exceeds 16KiB"
    Internal:
      description: Unexpected server fault.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            oops:
              value:
                error:
                  code: internal
                  message: "unexpected error; see journal"
