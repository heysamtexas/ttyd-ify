# wtd HTTP API — OpenAPI 3.1. Served to clients verbatim as GET /openapi.json, rendered
# by `make spec` into cmd/wtd/openapi.json; `make lint` fails on drift.
#
# EDITORIAL RULE for this file — descriptions state what a client can observe and must
# do. Mechanism, derivation, provenance and verification belong in the companion
# documents below, or — when a fact's home is the line it annotates — in a YAML comment
# like this one, which `make spec` drops and no client is charged for.
#
# Per sentence: is it ACTIONABLE (could a client change code because of it?), is it
# REACHABLE (usable without a checkout of this repo?), is it SUBSTITUTABLE (would the
# observable consequence plus a pointer carry the same decision?). First "no" evicts it.
# Two carve-outs: naming an internal in order to FORBID depending on it is actionable,
# and so is a limit a client budgets against — keep the number, drop the derivation.
#
# A pointer here is provenance for a maintainer, never part of the contract: none of
# these documents are served, so if cutting a mechanism leaves a client needing to
# follow one, an observable was cut by mistake. Restore the observable, keep the pointer.
#
# Companion documents are SERVED by this same binary, so every reference below is a URL a
# reader can fetch — not a filename in a repository they may not have:
#   /docs/ws-protocol.md        — the /ws WebSocket protocol (OpenAPI cannot express it)
#   /docs/session-lifecycle.md  — session states, staleness, reaping, cleanup ordering
#   /docs/compatibility.md      — ttyd 1.7.4 vs wtd behavior matrix

openapi: 3.1.0

externalDocs:
  description: >
    The WebSocket protocol, the session model, and the ttyd compatibility matrix — served by
    this binary at /docs/, so this reference resolves for any reader that can reach the API.
  url: /docs/ws-protocol.md

info:
  title: wtd HTTP API
  version: 0.1.0
  summary: >
    Browser terminal daemon: ttyd-wire-compatible WebSocket terminal plus a JSON API
    over dtach sessions.
  description: |
    ## Security model — read before adding anything

    This service fronts a **writable, unauthenticated shell** running as the service
    user. There is **no authentication at any layer of this API, by design** — access
    control is the network interface the daemon binds to (a tailnet IP, `127.0.0.1`,
    or a specific interface; wtd refuses `0.0.0.0`/`::` even when explicitly
    configured). Every endpoint below is reachable by anyone who can reach the port.
    The question for any change to this file: *does it widen who can reach the shell?*

    ## CSRF and cross-origin policy (normative for every route)

    Because there is no auth, the classic CSRF mitigations-by-credential do not exist;
    any web page a user visits can attempt requests against a tailnet IP. Therefore:

    - **Mutating routes** (`POST`, `DELETE`) reject any request carrying an `Origin`
      header whose authority (host[:port]) differs from the request's `Host`
      authority → `403` with code `origin_forbidden`. Non-browser clients (the iOS
      app's URLSession) send no Origin header and are unaffected; wtd's own picker
      pages are same-origin and pass. Reverse proxies must preserve the original
      `Host` header or this check will reject legitimate browsers.
    - **`POST` routes** additionally require `Content-Type: application/json`
      → `415` with code `unsupported_media_type` otherwise. HTML forms cannot send
      `application/json`, which kills form-based CSRF outright.
    - wtd **never** sends `Access-Control-Allow-Origin: *` — or any CORS headers at
      all on `/api/*`. CORS headers exist to *grant* cross-origin access; this API
      must never grant it.
    - Request bodies are capped at 16 KiB → `413` with code `payload_too_large`.
    - The same Origin policy applies to the `/ws` upgrade itself — see
      `/docs/ws-protocol.md` section 12; a cross-site WebSocket is a cross-site shell.

    Residual exposure, stated honestly: the Origin-vs-Host comparison stops ordinary
    cross-site requests (Origin names the attacker's site, Host names this server —
    mismatch, rejected). It does **not** stop DNS rebinding, where the victim's
    browser requests `http://attacker-hostname:7681/...` after the attacker's DNS
    flips to this IP — then Origin and Host both name the attacker's hostname, they
    match each other, and the check passes, `/ws` included. The only complete fix is
    validating `Host` against an allowlist; a `WT_ALLOWED_HOSTS` config key is
    reserved for that and deliberately **not** in v1, because unconfigured it would
    break tailnet MagicDNS names and raw-IP access, and a misconfigured allowlist
    locks the owner out of their own box. What contains rebinding meanwhile is the
    precondition it needs: the victim's *browser* must itself be on the private
    network this daemon binds to. That is the repo's standing security stance — the
    service is exactly as private as the interface it binds to — restated, not
    weakened.

    ## Path behavior outside this spec

    - `GET /` serves HTML: with no `?arg=` query parameter, the **browser session
      picker** (lists dtach sessions, links to `/?arg=<name>`); with `?arg=` present
      (even empty), the **terminal page**, whose script opens
      `ws://<host>/ws + location.search` exactly as ttyd's bundled client does. Pages
      use relative URLs so they work behind a path-stripping reverse proxy.
    - `GET /ws` is the terminal WebSocket — the entire contract is
      `ws-protocol.md`. It appears below only as a stub so the path is not "free".
    - Unknown paths → `404` with the standard error object. Known paths with wrong
      methods → `405`, code `method_not_allowed`.
    - All `/api/*` and `/token` responses carry `Cache-Control: no-store`.

    ## Error object

    Every non-2xx response from `/token`, `/healthz`, and `/api/*` is the `Error`
    schema: `{"error": {"code": "...", "message": "...", "detail": "..."}}`. `code`
    is a stable machine-readable string from the registry below (clients switch on
    `code`, never on `message`); `message` is one human-readable sentence; `detail`
    is optional elaboration. The registry is open-ended — clients MUST treat unknown
    codes as opaque failures of the given HTTP status.

    | code | HTTP | meaning |
    |---|---|---|
    | `bad_request` | 400 | Body is not a JSON object, or violates the schema in a way not covered below. |
    | `invalid_name` | 400 | Session name fails the create-side rules, including a deployment-specific length ceiling that `detail` states. |
    | `invalid_path` | 400 | `path` is not absolute, contains control bytes, does not exist, or is not a directory. |
    | `unknown_project` | 400 | `project` names no entry in the projects file. |
    | `project_path_missing` | 400 | Project exists but its path does not; the API refuses to guess a fallback. |
    | `path_and_project` | 400 | Both `path` and `project` were supplied; they are mutually exclusive. |
    | `already_exists` | 409 | A session with this name already exists, including one whose death could not be established — it is reported rather than silently replaced. |
    | `not_found` | 404 | No such session / no such route. |
    | `origin_forbidden` | 403 | Cross-origin request on a mutating route (or the /ws upgrade). |
    | `unsupported_media_type` | 415 | POST without `Content-Type: application/json`. |
    | `payload_too_large` | 413 | Body over 16 KiB. |
    | `method_not_allowed` | 405 | Known path, wrong method. |
    | `internal` | 500 | Unexpected server fault; `detail` says what, socket state untouched unless stated. |

    ## Features registry (`GET /api/v1/meta`)

    The `features` array is the **anti-skew mechanism** between this repo and the iOS
    client: the two repos share no CI, no type checking, and installed phone builds
    do not update when the server does. A client MUST feature-detect any capability
    beyond the ttyd-compatible core (`/`, `/ws`, `/token`) by checking this list, and
    MUST ignore feature strings it does not recognize.

    | feature | meaning |
    |---|---|
    | `token` | `GET /token` served (ttyd compat). |
    | `url-arg` | `?arg=` is appended to the start command argv (always on in wtd). |
    | `writable` | Terminal input is accepted (always on in wtd; ttyd `-W`). |
    | `sessions-api` | `GET/POST /api/v1/sessions`, `DELETE /api/v1/sessions/{name}`. |
    | `projects-api` | `GET /api/v1/projects`. |
    | `picker-ui` | `GET /` serves the HTML picker when no `?arg=` is present. |
    | `scrollback-replay` | A named (`?arg=`) connection is sent the session's recent output on attach, before live output. |
    | `docs-endpoint` | `GET /docs/{file}` serves the documents this spec references, so every reference in it resolves. |

    Reserved for the future (a server advertising one implements its spec revision):
    `auth-basic`, `base-path`, `tls`, `flow-control`.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: "http://{host}:{port}"
    description: >
      wtd's single listener, and the only server that serves this document. host is
      the resolved bind address — a tailnet IP, 127.0.0.1, or an interface address,
      never a wildcard.

      **Use port 7683 (`WT_WEB_PORT`).** During the migration away from ttyd a box
      may also run ttyd on 7681 (`WT_PORT`); ttyd serves `/`, `/token` and `/ws`
      only, and returns 404 for `/openapi.json`, every `/api/v1/*` route, and the
      picker. A client configured for 7681 therefore fails on everything in this
      document, and 7681 remains the default in older client profiles, so it is the
      likeliest misconfiguration. `GET /api/v1/meta` succeeding is the cheapest proof
      you are talking to wtd.
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "7683"

paths:
  /:
    get:
      operationId: getRoot
      summary: Browser picker (no ?arg=) or terminal page (?arg= present)
      description: |
        HTML, not API. Without `arg`: the browser session picker. With `arg` (even
        empty): the terminal page, which forwards its full query string to `/ws`,
        matching ttyd's own client — so a deep link opens the named session directly.
      parameters:
        - name: arg
          in: query
          required: false
          description: >
            Session name to deep-link. A malformed or unusable name renders the
            picker instead — a graceful fallback, never an error.
          schema:
            type: string
      responses:
        "200":
          description: HTML page.
          content:
            text/html:
              schema:
                type: string

  /ws:
    get:
      operationId: terminalWebSocket
      summary: Terminal WebSocket (ttyd wire protocol)
      externalDocs:
        description: The full normative wire contract, including everything this description summarises.
        url: /docs/ws-protocol.md
      description: |
        Not an HTTP resource in any REST sense — this path upgrades to the ttyd
        `tty`-subprotocol WebSocket. OpenAPI cannot express a WebSocket protocol, so what
        follows is the working contract in prose. It is enough to build a client; the full
        normative version, including every failure mode, is `/docs/ws-protocol.md`.

        ## Connecting

        Open `ws://<host>:<port>/ws`, offering subprotocol `tty` (offering none also works;
        offering others without `tty` is a `400`). The server echoes `tty`, which browsers
        require. `GET /token` first if you want ttyd parity — its value goes in the handshake —
        but the token here is always the empty string.

        ## The handshake

        The **first** message after the upgrade is the handshake, and it is the one message with
        **no opcode prefix**. Send `TerminalHandshake` as **either a text or a binary** frame;
        both are accepted, which matters because ttyd's own web client sends binary and other
        clients send text.

        Send real `columns`/`rows`. Missing or out-of-range dimensions default to **80x24
        silently**, and the size is applied before the start command runs — so a narrow client
        that omits them gets a session hard-wrapped for 80 columns with no error anywhere.

        Unknown keys are ignored. Not-JSON closes **1002**; no handshake within **10 s** closes
        **1008**; over **8 KiB** closes **1009**.

        ## Framing, after the handshake

        Every subsequent message is `[1 ASCII opcode byte][payload]`, applied to the reassembled
        message rather than to transport fragments.

        | Client → server | Byte | Payload |
        |---|---|---|
        | `INPUT` | `'0'` | Raw bytes, written to the terminal verbatim. No escaping, no encoding. |
        | `RESIZE_TERMINAL` | `'1'` | `TerminalResize` as JSON. |
        | `PAUSE` / `RESUME` | `'2'` / `'3'` | Accepted for ttyd parity and **no-ops here**; see the `flow-control` feature. |

        | Server → client | Byte | Payload |
        |---|---|---|
        | `OUTPUT` | `'0'` | Raw terminal bytes. |
        | `SET_WINDOW_TITLE` | `'1'` | UTF-8 string; display verbatim, nothing parses it. |
        | `SET_PREFERENCES` | `'2'` | JSON, always `{}` here. |

        Client messages may be text or binary. **Server messages are always binary.**

        ## Three rules that silently corrupt rendering

        1. **The first two server frames are the title and the preferences**, in that order,
           before any output. Feed them to a terminal emulator and it prints them on screen.
        2. **`OUTPUT` is not UTF-8-safe per frame.** A multi-byte character can split across two
           frames. Decode the concatenated stream, never one frame at a time, or non-ASCII output
           corrupts intermittently at frame boundaries.
        3. **Ignore unknown opcodes; do not close on them.** New opcodes may appear, and a client
           that treats byte 0 as an error never gets past its first frame. The server ignores
           unknown client opcodes for the same reason.

        ## Two kinds of connection, chosen by `?arg=` alone

        Nothing else on the wire differs.

        | | argless `/ws` | named `/ws?arg=<name>` |
        |---|---|---|
        | Process | fresh per connection, private terminal | one shared session, kept alive between connections |
        | On attach | starts at the session picker | recent output replayed, then live |
        | A second client | gets its own picker | joins the same terminal, **input interleaves** |
        | You disconnect | the process is terminated | **the session keeps running** |

        `?arg=<name>` **creates the session if it does not exist** and recovers one whose previous
        process is gone — so a saved deep link works before its session has ever existed, and
        after a reboot. You do not need to `POST` first.

        An **empty** `?arg=` counts as argless: no replay, no sharing, and the process dies with
        the connection. Build the URL without the parameter rather than with an empty one.

        A name that cannot be used renders the picker instead of failing — never an error, never
        a close.

        **Ctrl-`\` is shared fate on a named session.** It detaches the session, which closes
        **every** client attached to it, not only the one that sent it. Indistinguishable from a
        private detach when you are the only client.

        ## Resize, and the redraw you should not send

        Every `RESIZE_TERMINAL` frame is applied immediately, one per frame, never coalesced —
        so debouncing an interactive resize is your job. Dimensions outside 1..9999 are ignored
        rather than fatal. With several clients on one session the size is last-writer-wins:
        joining a session resizes it for everyone already there.

        **You do not need to send a resize to get output**, and you should not send a
        size-jiggle to force a redraw. This server performs that once per session itself. A
        client-side jiggle still works but repaints the screen for **every** client on a shared
        session. This is the one rule that inverts against a plain ttyd server, which does no
        redraw of its own and where a client-side jiggle is the only thing preventing a blank
        screen on attach — so gate it on the `scrollback-replay` feature rather than assuming.

        ## Replay, when `scrollback-replay` is advertised

        Recent output is replayed after the title and preferences frames, before live output.
        It arrives as **ordinary `OUTPUT` frames with no marker of any kind** — deliberately, so
        that a client which knows nothing about replay still works. Consequences:

        - **You cannot detect where replay ends.** Do not try.
        - **It overlaps whatever you already have** if you reconnect into a terminal emulator you
          kept alive. Clearing before reconnecting is your decision; the server injects nothing.
        - **It is wrapped at the width of the session that produced it**, not yours. A narrow
          client joining a wide session sees history wrapped for the wide one. Full-screen
          programs repaint; a shell's scrollback does not.
        - **Do not depend on it to render a usable screen.** An operator can disable it while the
          feature stays advertised.

        Replay covers what happened *before* you attached; your own scrollback covers what
        arrived *while* you were connected. Different mechanisms, both needed.

        ## Liveness

        **You do not have to ping** — browsers cannot, so the server never treats silence from a
        client as death. It pings every 30 s and closes only after **90 s** with no inbound
        traffic of any kind; transport-level auto-pong is enough to satisfy that. There is no
        idle timeout below 60 s. The server answers pings with pongs and ignores unsolicited
        pongs.

        ## Limits

        Any message after the handshake over **1 MiB** closes **1009** and terminates the
        session's processes. That is the ceiling on a single paste. It is unrelated to the 16 KiB
        cap on HTTP request bodies documented above.

        ## Close codes, and what to do about each

        | Code | Means | Do |
        |---|---|---|
        | `1000` | The session's command exited. On a named session this is the shared command, so every client gets it. | Final. Reconnect only if the user asks. |
        | `1001` | Server shutting down, or a warm session released to make room. | Reconnect with backoff. Sessions survive a restart. |
        | `1013` | You fell more than 4 MiB behind on output and were dropped so the session could keep going. | Reconnect immediately; replay restores context. |
        | `1002` | The first message was not a valid handshake. | Client bug. Do not retry. |
        | `1008` | No handshake within 10 s. | Client bug. Do not retry. |
        | `1009` | A message exceeded 8 KiB (handshake) or 1 MiB (after). | Client bug. The same payload fails identically. |
        | `1011` | The terminal could not be started. Where possible a one-line error arrives as an `OUTPUT` frame first, so it is visible in the terminal rather than only in a code. | Retry with backoff. |

        `TERM=xterm-256color` is set, so xterm-family emulation is the target.
      parameters:
        - name: arg
          in: query
          required: false
          description: >
            Session name. Present and non-empty selects a named connection, creating the session
            if it does not exist; absent or empty selects a private one. Repeats are passed
            through in order, though only the first is used today. URL-decoded before use.
          schema:
            type: string
      responses:
        "101":
          description: Switching Protocols; subprotocol `tty` echoed when offered.
        "400":
          description: Not a valid upgrade, or subprotocols offered without `tty`.
        "403":
          description: Cross-origin upgrade rejected (`/docs/ws-protocol.md` section 12).

  /token:
    get:
      operationId: getToken
      summary: ttyd-compatible auth token endpoint (always empty)
      description: |
        Exists solely because clients of ttyd expect it: they GET it on every connect,
        ignore failures, and send the result as the handshake `AuthToken`. wtd has no
        auth, so the token is always the empty string — the same as ttyd run without
        `-c`. Serving it keeps connect logs clean and third-party ttyd-compatible
        clients working.
      responses:
        "200":
          description: The (empty) token.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
                    const: ""
              examples:
                empty:
                  value: { "token": "" }

  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: >
        Plain-text liveness for systemd, scripts, and humans with curl. Returns `ok`
        when the HTTP listener is serving, and deliberately checks nothing deeper —
        not sessions, not the start command. A health check that can fail for reasons
        a restart will not fix trains people to ignore it.
      responses:
        "200":
          description: Listener is alive.
          content:
            text/plain:
              schema:
                type: string
                const: ok

  /api/v1/meta:
    get:
      operationId: getMeta
      summary: Server identity and capability list
      description: |
        The anti-skew endpoint (see the features registry in the top-level
        description). Clients cache this per connection at most — it is cheap, and
        the whole point is detecting a server that changed underneath an installed
        client.
      responses:
        "200":
          description: Server metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
              examples:
                devbox:
                  value:
                    version: "0.1.0"
                    features: ["token", "url-arg", "writable", "sessions-api", "projects-api", "picker-ui"]
                    hostname: "devbox"
                    user: "sam"
                    terminalPath: "/ws"

  /api/v1/sessions:
    get:
      operationId: listSessions
      summary: List dtach sessions
      description: |
        Every session this server can see, sorted ascending by byte value. The
        terminal has its own picker over the same state, and the two must never
        disagree about what exists — which drives both rules below.

        1. **Looser names than this API would create are still listed.** A session
           made from the terminal picker can be named `my proj`; it appears here even
           though `POST` would reject that name. Do not assume listed names satisfy
           the create-side pattern. Names beginning with `.` are the exception: they
           are invisible to the terminal picker, so they are not listed here either.
        2. **Dead sessions are not listed, and this request removes them.** A socket
           left behind by a session that is gone would otherwise show as a session
           that cannot be attached, so this endpoint verifies each one and unlinks the
           ones it can prove are dead. Yes, that means a `GET` has a side effect; it is
           the only read every client already makes, which is why it is the one that
           converges the two pickers. Why, and the guard against racing a session
           being recreated under the same name: `/docs/session-lifecycle.md` §5.
      responses:
        "200":
          description: All live sessions (possibly empty array).
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
              examples:
                two:
                  value:
                    - name: "ops"
                      attached: false
                      cwd: "/home/sam/src/infra"
                      pid: 51234
                      createdAt: "2026-07-22T21:03:00Z"
                    - name: "riggs"
                      attached: true
                      cwd: "/home/sam/src/riggs"
                      pid: 60211
                      createdAt: "2026-07-24T14:09:00Z"
        "500":
          $ref: "#/components/responses/Internal"

    post:
      operationId: createSession
      summary: Create a detached session
      description: |
        Creates a dtach session **without attaching** — the API-side equivalent of
        the picker's new-session flow, for naming a working directory or project up front.
        It is **not** a precondition for deep-linking: `/ws?arg=<name>` creates the session
        if it does not exist, so a client can open one directly and never call this.

        A session created here is **indistinguishable** from one created in the
        terminal picker — same invocation, same environment. That parity is mandatory,
        so anything you can do with a menu-made session you can do with this one, and
        nothing about it will surprise a user who switches between the two surfaces.
        The invocation and the reasons each part of it matters: `/docs/session-lifecycle.md` §6.

        Working directory: `project` (a shortcut name from `GET /api/v1/projects`) or
        `path` (absolute, must exist), else the service user's `$HOME`. The two are
        mutually exclusive. Where the terminal picker silently falls back to `$HOME`
        for a directory that is missing, this API returns an error instead — a program
        should be told, not guessed for.

        Name rules are **stricter than the picker's**, deliberately, so that every
        session this API creates is reachable from both surfaces: no leading `.` (it
        would be invisible in the terminal picker) and no `..` anywhere (it would be
        unreachable by deep link). See the `name` property for the length ceiling,
        which is deployment-dependent.

        If the name belongs to a session that is already gone, its leftover socket is
        removed and creation proceeds — so retrying a create for a session that has
        died does the obvious thing rather than returning a conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
            examples:
              byPath:
                value: { "name": "riggs", "path": "/home/sam/src/riggs" }
              byProject:
                value: { "name": "ops", "project": "ops" }
              bare:
                value: { "name": "scratch" }
      responses:
        "201":
          description: Session created, detached.
          headers:
            Location:
              description: Canonical resource path for the new session.
              schema:
                type: string
                examples: ["/api/v1/sessions/riggs"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              examples:
                created:
                  value:
                    name: "riggs"
                    attached: false
                    cwd: "/home/sam/src/riggs"
                    pid: 61402
                    createdAt: "2026-07-24T21:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "409":
          description: A session with this name already exists. Two concurrent
            creates of the same name resolve to one winner and one 409. A session
            whose death cannot be established counts as existing, and is reported
            rather than silently replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                exists:
                  value:
                    error:
                      code: already_exists
                      message: "session 'riggs' already exists"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"

  /api/v1/sessions/{name}:
    delete:
      operationId: deleteSession
      summary: Terminate a session and clean up its socket
      description: |
        Terminates the session and removes its socket; `204` once the socket is gone.

        **No path is ever constructed from `{name}`** — it is URL-decoded and matched
        byte-exact against the names that actually exist. That is why this parameter
        has no validation pattern: the terminal picker creates names `POST` would
        reject, and those sessions must be deletable too. A name matching nothing is
        `404`, including anything containing `/`.

        Deleting an **attached** session is allowed. The live shell is terminated under
        whoever is watching it, and they land back at the picker rather than on a
        dropped connection; this API does not guess whether that is what you meant.
        Deleting a session that is **already gone** also succeeds → `204`, including one
        that has become unreachable by every other route, so `DELETE` is the way to
        clean up after a session nothing else can address.

        The session's background jobs are terminated along with it. Termination is
        bounded at roughly **7 s** worst case — budget a client timeout above that —
        which is why this endpoint answers synchronously instead of handing back a job
        to poll. Ordering, escalation, and the phantom-session failure modes the
        ordering exists to prevent: `/docs/session-lifecycle.md` §7.
      parameters:
        - name: name
          in: path
          required: true
          description: >
            Exact session name as returned by a list response, URL-encoded as
            needed.
          schema:
            type: string
      responses:
        "204":
          description: Session terminated and its socket removed.
        "403":
          $ref: "#/components/responses/OriginForbidden"
        "404":
          description: No socket with this name exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                missing:
                  value:
                    error:
                      code: not_found
                      message: "no session named 'riggs'"
        "500":
          description: Termination did not complete inside the bounded ~7 s. The
            session is left as it was and is still listed, so a retry is safe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/projects:
    get:
      operationId: listProjects
      summary: List project shortcuts
      description: |
        The shortcuts this deployment has configured, already parsed — a client never
        reads the file itself. Each entry reports `exists`, whether its path is
        currently a directory, so a client can warn before creating a session
        somewhere unexpected. A deployment with no shortcuts configured, or an
        unreadable file, is an empty list rather than an error.
      responses:
        "200":
          description: All shortcuts (possibly empty array).
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
              examples:
                two:
                  value:
                    - { "name": "dev", "path": "/home/sam/src/my-app", "exists": true }
                    - { "name": "ops", "path": "/home/sam/src/infra", "exists": false }
        "500":
          $ref: "#/components/responses/Internal"

  /docs/{file}:
    get:
      operationId: getDoc
      summary: A specification document this server publishes
      description: >
        The documents this spec references, served so those references resolve. OpenAPI cannot
        express a WebSocket protocol, so `/docs/ws-protocol.md` is where the terminal's wire
        contract is stated in full; `/docs/session-lifecycle.md` carries the session model and
        `/docs/compatibility.md` the ttyd behaviour matrix. Markdown, intended to be read.
        Detect with the `docs-endpoint` feature.
      parameters:
        - name: file
          in: path
          required: true
          description: One of the published document names.
          schema:
            type: string
            enum: [ws-protocol.md, session-lifecycle.md, compatibility.md]
      responses:
        "200":
          description: The document.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache
          content:
            text/markdown:
              schema:
                type: string
        "404":
          description: No document by that name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /openapi.json:
    get:
      operationId: getOpenApi
      summary: This specification, as JSON
      description: >
        The machine-readable contract, served by the binary that implements it so a
        client (or a person with curl) can inspect exactly what this build speaks.
        Rendered from api/openapi.yaml at build time; the served document and the
        repo file must not drift.
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code from the registry in the
                top-level description. Clients switch on this, never on message.
            message:
              type: string
              description: One human-readable sentence.
            detail:
              type: string
              description: Optional elaboration (validation specifics, errno text).

    Session:
      type: object
      description: >
        One session. How each field is derived, and how each can fail:
        `/docs/session-lifecycle.md` §2.
      required: [name, attached, cwd, pid, createdAt]
      properties:
        name:
          type: string
          description: >
            Deliberately unconstrained here: the terminal picker creates names
            `POST` would reject, such as ones containing spaces, and this API lists
            every session that picker can see. Do not validate a listed name against
            the create-side pattern.
        attached:
          type: boolean
          description: >
            True while someone is looking at this session — through this server, over
            SSH, or from the terminal picker, so `true` does not imply a client of
            *this* server. That sentence is the contract. How it is worked out is not,
            and has already changed once, so clients MUST NOT derive it themselves and
            in particular MUST NOT read the socket's file mode. The derivation, and why
            it changed: `/docs/session-lifecycle.md` §2.
        cwd:
          type: ["string", "null"]
          description: >
            Current working directory of the session's shell, read live — it moves
            when the user `cd`s, so this is not the directory the session was created
            in. Null when it cannot be resolved; the session is still valid and still
            listed.
        pid:
          type: ["integer", "null"]
          description: >
            PID of the session's shell — the same process whose `cwd` is reported
            above. Null when it cannot be resolved; the session is still valid and
            still listed.
        createdAt:
          type: string
          format: date-time
          description: >
            RFC 3339 UTC. Effectively when the session was created, but best-effort
            rather than forensic — treat it as ordering information, not evidence.

    TerminalHandshake:
      type: object
      description: >
        The first message on a `/ws` connection, and the only one with no opcode prefix. Sent as
        either a text or a binary frame. See the `/ws` description for the framing that applies
        to everything after it.
      required: [columns, rows]
      properties:
        AuthToken:
          type: string
          description: >
            The value from `GET /token`, which is always the empty string here. Accepted and
            ignored; may be omitted entirely. Spelled with this capitalisation for ttyd parity.
        columns:
          type: integer
          minimum: 1
          maximum: 9999
          description: >
            Terminal width. Applied before the session's command starts, so this is the width it
            first renders at. Omitted or out of range silently means 80 — which on a narrow
            client produces a wrapped, unusable screen with no error, so send the real value.
        rows:
          type: integer
          minimum: 1
          maximum: 9999
          description: Terminal height. Omitted or out of range silently means 24.

    TerminalResize:
      type: object
      description: >
        Payload of a `RESIZE_TERMINAL` frame (opcode `'1'`). Applied immediately, one per frame,
        never coalesced. Out-of-range values cause the frame to be ignored, not the connection to
        close.
      required: [columns, rows]
      properties:
        columns:
          type: integer
          minimum: 1
          maximum: 9999
        rows:
          type: integer
          minimum: 1
          maximum: 9999

    SessionCreateRequest:
      type: object
      description: >
        `path` and `project` are mutually exclusive; omitting both means the
        service user's $HOME. Unknown extra properties are ignored (a newer client
        against an older server degrades predictably; capability discovery is
        /api/v1/meta's job, not schema strictness here).
      required: [name]
      properties:
        name:
          type: string
          pattern: '^(?!\.)(?!.*\.\.)[A-Za-z0-9._-]{1,64}$'
          # The pattern cannot express the deployment-dependent ceiling: it is a
          # function of WT_DIR's depth. Derivation and the measured boundary live in
          # /docs/session-lifecycle.md §2; only the client-visible rule is served.
          description: >
            Stricter than the terminal picker on purpose: a name MUST NOT start with
            `.` and MUST NOT contain `..` anywhere, because a session named either way
            would exist but be unreachable from one of the two surfaces that list
            sessions. The pattern's 64-character ceiling is an **upper bound only** — a deployment may accept fewer and
            refuses the excess with `invalid_name` (400), whose `detail` names the real
            figure. Clients SHOULD surface that `detail` rather than assume 64.
        path:
          type: string
          description: >
            Absolute directory to start the shell in. Must exist, must be a
            directory, and must not contain bytes below 0x20 or 0x7F — those are
            refused with `invalid_path` (400) rather than escaped.
        project:
          type: string
          description: A shortcut name from GET /api/v1/projects.
      not:
        required: [path, project]

    Project:
      type: object
      required: [name, path, exists]
      properties:
        name:
          type: string
        path:
          type: string
        exists:
          type: boolean
          description: >
            Whether `path` is currently a directory. False means a `POST` naming this
            project is refused with `project_path_missing` (400).

    Meta:
      type: object
      required: [version, features, hostname, user, terminalPath]
      properties:
        version:
          type: string
          description: wtd semantic version.
        features:
          type: array
          items:
            type: string
          description: >
            Capability strings from the registry in the top-level description.
            Clients MUST ignore unknown entries and MUST feature-detect anything
            beyond the ttyd-compatible core before using it — this list is the
            only cross-repo skew defense that exists.
        hostname:
          type: string
          description: Short hostname, as the terminal picker shows in its menu header.
        user:
          type: string
          description: The service user — whose shell every terminal hands out.
        terminalPath:
          type: string
          description: >
            Path on this server to open the terminal WebSocket at — combine it with the
            server's host and port. Always `/ws` today; read it rather than hardcoding,
            so a future deployment behind a path prefix stays discoverable.

  responses:
    BadRequest:
      description: Validation failure; error.code disambiguates (invalid_name,
        invalid_path, unknown_project, project_path_missing, path_and_project,
        bad_request).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            badName:
              value:
                error:
                  code: invalid_name
                  message: "name must match ^[A-Za-z0-9._-]{1,64}$ without leading '.' or any '..'"
    OriginForbidden:
      description: Cross-origin request on a mutating route.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            csrf:
              value:
                error:
                  code: origin_forbidden
                  message: "cross-origin requests are not accepted"
    UnsupportedMediaType:
      description: POST body was not declared application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            wrongType:
              value:
                error:
                  code: unsupported_media_type
                  message: "Content-Type must be application/json"
    PayloadTooLarge:
      description: Body over 16 KiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            tooBig:
              value:
                error:
                  code: payload_too_large
                  message: "request body exceeds 16KiB"
    Internal:
      description: Unexpected server fault.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            oops:
              value:
                error:
                  code: internal
                  message: "unexpected error; see journal"
