<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>terminals</title>
<!--
  Browser session picker. Served at / when there is no ?arg=.

  Constraints, all deliberate:
  - No external assets. This page is often reached over a tailnet with no route to the
    public internet, and a CDN <script> would make the picker fail exactly where it is
    most needed. Everything is inline.
  - Same-origin fetches only, so no CORS is involved. The API refuses cross-origin
    mutations, and this page is served from the origin it talks to.
  - Narrow-first. It gets opened on a phone at least as often as on a laptop.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --fg: #1a1a18; --muted: #6b6b66;
    --line: #e2e2dd; --card: #ffffff;
    --live: #1a7f4b; --idle: #8a8a84; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a; --fg: #e8e8e4; --muted: #9a9a94;
      --line: #2b2e31; --card: #1d2023;
      --live: #4ade80; --idle: #7a7a74; --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.25rem 1rem 3rem; background: var(--bg); color: var(--fg);
    font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  main { max-width: 34rem; margin: 0 auto; }
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 .25rem; }
  .head a { color: var(--muted); font-size: .8rem; text-decoration: none; }
  .head a:hover { text-decoration: underline; }
  .host { color: var(--muted); font-size: .8rem; margin-bottom: 1.25rem; }
  ul { list-style: none; margin: 0 0 1.5rem; padding: 0; }
  li {
    display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: .6rem .75rem; margin-bottom: .5rem;
  }
  a.name { color: inherit; font-weight: 600; text-decoration: none; flex: 1 1 auto; min-width: 8rem; }
  a.name:hover { text-decoration: underline; }
  .dot { flex: 0 0 auto; width: .55rem; height: .55rem; border-radius: 50%; background: var(--idle); }
  .dot.live { background: var(--live); }
  /* Agent status (#108). Colours and shapes are the favicon's, from terminal.html's
     STATUS_COLORS and STATUS_ICONS, so one state reads the same in a tab and in this list.
     Shapes as well as colours on purpose: the three states must be distinguishable without
     relying on colour alone. Sized a shade larger than .dot because a clipped triangle reads
     smaller than a circle of the same box. */
  .status { flex: 0 0 auto; width: .65rem; height: .65rem; }
  .status.running   { background: #22d3ee; border-radius: 50%; }
  .status.waiting   { background: #fbbf24; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .status.attention { background: #ef4444; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  /* `clear` is the session saying it has nothing to report, so it gets a visible mark. An
     unobserved session renders NOTHING at all, and that gap is the whole distinction: null is
     "we never looked", which after a restart is every row until someone opens one. */
  .status.clear { border: 1.5px solid var(--idle); border-radius: 50%; }
  .cwd { color: var(--muted); font-size: .75rem; flex: 1 1 100%; overflow-wrap: anywhere; }
  button {
    font: inherit; font-size: .75rem; background: none; color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px; padding: .15rem .5rem; cursor: pointer;
  }
  button:hover { color: var(--danger); border-color: var(--danger); }
  form { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  input, select {
    font: inherit; font-size: .85rem; background: var(--card); color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px; padding: .4rem .5rem; min-width: 0;
  }
  input[name=name] { flex: 1 1 8rem; }
  button.primary { color: var(--fg); padding: .4rem .8rem; font-size: .85rem; }
  button.primary:hover { color: var(--fg); border-color: var(--fg); }
  .empty, .err { color: var(--muted); font-size: .85rem; margin-bottom: 1rem; }
  .err { color: var(--danger); }
  h2 { font-size: .8rem; font-weight: 600; color: var(--muted); margin: 0 0 .6rem; }
</style>

<main>
  <div class="head"><h1>terminals</h1><a href="help">help</a></div>
  <div class="host" id="host">…</div>

  <div class="err" id="err" hidden></div>
  <ul id="list"></ul>

  <h2>new session</h2>
  <form id="new">
    <input name="name" placeholder="name" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <select name="project"><option value="">$HOME</option></select>
    <button class="primary" type="submit">create</button>
  </form>
</main>

<script>
  // --- idle mark: the terminal's own icon, drawn identically on the picker and on a quiet
  // terminal tab so the two pages read as one app. This block is byte-identical in
  // cmd/wtd/web/index.html and cmd/wtd/web/terminal.html, and
  // TestIdleMarkMatchesAcrossPages fails if they drift — these pages have no JS harness in
  // this repo, so nothing else would notice.
  //
  // Mid-grey ground with a near-white prompt on it, because a browser tab strip is light in
  // one theme and near-black in the other and this has to survive both. Drawn as paths
  // rather than as text in a system font, so the shape is the same everywhere.
  function drawIdleMark(g) {
    g.fillStyle = "#6b7280";
    g.fillRect(0, 0, 32, 32);
    g.strokeStyle = "#f3f4f6";
    g.lineWidth = 3.5;
    g.lineCap = "round";
    g.lineJoin = "round";
    g.beginPath(); g.moveTo(9, 9); g.lineTo(16, 16); g.lineTo(9, 23); g.stroke();
    g.beginPath(); g.moveTo(19, 24); g.lineTo(25, 24); g.stroke();
  }
  // --- end idle mark ---

  // The picker is not a session, so it has no status to show and never changes this icon —
  // it exists so the tab is identifiably part of this app rather than a blank page sitting
  // next to its own terminals. Canvas, not a static asset, so it stays in step with the
  // terminal page and needs no new route to serve it.
  (() => {
    const c = document.createElement("canvas");
    c.width = c.height = 32;
    const g = c.getContext("2d");
    if (!g) return; // no canvas: no icon, and nothing else on the page cares
    drawIdleMark(g);
    const link = document.createElement("link");
    link.rel = "icon";
    link.type = "image/png";
    link.href = c.toDataURL("image/png");
    document.head.append(link);
  })();

  const $ = (id) => document.getElementById(id);
  const api = (p, opts) => fetch(p, opts);

  function fail(msg) { const e = $("err"); e.textContent = msg; e.hidden = false; }
  function clearFail() { $("err").hidden = true; }

  async function refresh() {
    try {
      const res = await api("api/v1/sessions");
      if (!res.ok) throw new Error("sessions: HTTP " + res.status);
      const sessions = await res.json();
      clearFail();

      const list = $("list");
      list.textContent = "";
      if (!sessions.length) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "no active sessions";
        list.append(li);
        return;
      }

      for (const s of sessions) {
        const li = document.createElement("li");

        const dot = document.createElement("span");
        dot.className = "dot" + (s.attached ? " live" : "");
        dot.title = s.attached ? "attached" : "idle";

        // Separate from the attached dot, and deliberately not merged into it: "someone is
        // looking at this" and "the agent needs you" are independent facts, and the useful row
        // is often the one nobody is watching.
        let status = null;
        if (hasStatus && Object.prototype.hasOwnProperty.call(STATUS_TITLES, s.agentStatus)) {
          status = document.createElement("span");
          status.className = "status " + s.agentStatus;
          status.title = STATUS_TITLES[s.agentStatus];
        }

        // Deep link into the terminal. Same ?arg= mechanism the iOS app uses, so this
        // link and a saved phone profile exercise the identical server path.
        const a = document.createElement("a");
        a.className = "name";
        a.href = "/?arg=" + encodeURIComponent(s.name);
        a.textContent = s.name;

        const kill = document.createElement("button");
        kill.textContent = "kill";
        kill.onclick = () => destroy(s.name);

        li.append(dot, a);
        if (status) li.append(status);
        li.append(kill);

        if (s.cwd) {
          const cwd = document.createElement("span");
          cwd.className = "cwd";
          cwd.textContent = s.cwd;
          li.append(cwd);
        }
        list.append(li);
      }
    } catch (e) {
      fail(String(e.message || e));
    }
  }

  async function loadProjects() {
    try {
      const res = await api("api/v1/projects");
      if (!res.ok) return;
      const sel = document.querySelector("select[name=project]");
      for (const p of await res.json()) {
        const opt = document.createElement("option");
        opt.value = p.name;
        opt.textContent = p.name + (p.exists ? "" : " (missing)");
        opt.disabled = !p.exists;
        sel.append(opt);
      }
    } catch { /* shortcuts are optional; $HOME still works */ }
  }

  // Whether this server reports agentStatus at all. Gated on the flag rather than on the field
  // being present, because a session nobody has opened is null on a server that fully supports
  // this — so the value alone cannot tell "unsupported" from "unobserved", and a page that
  // guessed would render every row as unknown against an older server. Starts false so the
  // first refresh, which can beat loadMeta, shows nothing rather than something wrong.
  let hasStatus = false;

  async function loadMeta() {
    try {
      const res = await api("api/v1/meta");
      if (!res.ok) return;
      const m = await res.json();
      $("host").textContent = m.hostname + " · " + m.user + " · wtd " + m.version;
      if (Array.isArray(m.features) && m.features.includes("session-status")) {
        hasStatus = true;
        refresh(); // the first list may already have rendered without badges
      }
    } catch { /* cosmetic */ }
  }

  // STATUS_TITLES doubles as the allowlist. An unrecognized value renders nothing rather than
  // being treated as `clear`, so a server that learns a new state does not blank this page's
  // indicator — the rule api/ws-protocol.md section 6a puts on every client.
  const STATUS_TITLES = Object.freeze({
    running: "agent working",
    waiting: "agent finished its turn — your move",
    attention: "agent is blocked, waiting for an answer",
    clear: "agent reported nothing to do",
  });

  async function destroy(name) {
    if (!confirm("Kill session " + name + "?\n\nAnything running inside it is terminated.")) return;
    try {
      const res = await api("api/v1/sessions/" + encodeURIComponent(name), { method: "DELETE" });
      if (!res.ok && res.status !== 204) {
        const body = await res.json().catch(() => null);
        throw new Error(body?.error?.message || "delete: HTTP " + res.status);
      }
      refresh();
    } catch (e) { fail(String(e.message || e)); }
  }

  $("new").onsubmit = async (ev) => {
    ev.preventDefault();
    const data = new FormData(ev.target);
    const body = { name: (data.get("name") || "").trim() };
    const project = data.get("project");
    if (project) body.project = project;

    try {
      // Content-Type: application/json is required by the API on purpose — a form-encoded
      // POST is what a cross-site CSRF attempt would look like, so it is refused.
      const res = await api("api/v1/sessions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => null);
        throw new Error(err?.error?.detail || err?.error?.message || "create: HTTP " + res.status);
      }
      ev.target.reset();
      refresh();
    } catch (e) { fail(String(e.message || e)); }
  };

  loadMeta();
  loadProjects();
  refresh();
  // Attached/idle changes when someone connects or drops, so keep it roughly current
  // without hammering: this page may sit open on a second monitor all day.
  setInterval(refresh, 5000);
</script>
