<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>terminal</title>
<!--
  Browser terminal, served at / when ?arg= is present.

  This is ttyd's web client reimplemented against the protocol documented in
  api/ws-protocol.md — the same protocol the iOS app speaks, so this page and a saved
  phone profile exercise the identical server path. That is the point: a bug reachable
  from here is reachable from the phone.

  All assets are vendored and served from this origin (see vendor/PROVENANCE.md). No CDN:
  this page is normally reached over a tailnet with no route to the public internet.
-->
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="help.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #term { position: absolute; inset: 0; padding: 4px; }
  #banner {
    position: absolute; left: 0; right: 0; top: 0; z-index: 10;
    font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace;
    text-align: center; padding: .35rem; background: #7f1d1d; color: #fff;
  }
  #banner[hidden] { display: none; }
  #banner button {
    font: inherit; margin-left: .6rem; background: none; color: #fff;
    border: 1px solid #fff; border-radius: 3px; padding: 0 .5rem; cursor: pointer;
  }
  /* Below the banner (z 10): while disconnected the banner wins the corner, which is
     fine — the overlay itself needs no z-index at all, showModal() is top-layer. */
  #helpbtn {
    position: fixed; z-index: 5;
    top: calc(6px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
    width: 1.7rem; height: 1.7rem; border-radius: 50%; opacity: .5; cursor: pointer;
    font: 13px ui-monospace, Menlo, Consolas, monospace;
    background: rgba(255,255,255,.08); color: #9a9a94; border: 1px solid #2b2e31;
  }
  #helpbtn:hover, #helpbtn:active { opacity: 1; }
  #help {
    /* The always-dark ground for the shared .faq rules in /help.css. */
    --faq-muted: #9a9a94; --faq-card: #16181a; --faq-line: #2b2e31;
    --faq-kbd-line: #3b3e41; --faq-kbd-bg: #1d2023;
    width: calc(100% - 2rem); max-width: 34rem; padding: 0; overflow: hidden;
    background: #1d2023; color: #e8e8e4; border: 1px solid #2b2e31; border-radius: 8px;
  }
  #help::backdrop { background: rgba(0, 0, 0, .55); }
  #helppanel {
    max-height: calc(100vh - 4rem); overflow-y: auto; padding: 1rem 1.25rem 1.25rem;
    font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #helpclose {
    float: right; font: inherit; cursor: pointer; line-height: 1;
    background: none; color: #9a9a94; border: 1px solid #2b2e31;
    border-radius: 4px; padding: .1rem .45rem;
  }
</style>

<div id="banner" hidden></div>
<div id="term"></div>
<button id="helpbtn" aria-label="help" tabindex="-1">?</button>
<dialog id="help" aria-label="help">
  <div id="helppanel">
    <button id="helpclose" aria-label="close">×</button>
    <div id="helpbody" class="faq"><p>loading…</p></div>
  </div>
</dialog>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-webgl.js"></script>
<script>
(function () {
  // Opcodes, from api/ws-protocol.md. Client and server reuse the same byte values with
  // different meanings, which is why they are listed separately.
  const C_INPUT = "0", C_RESIZE = "1";
  const S_OUTPUT = 48, S_TITLE = 49, S_PREFS = 50; // '0' '1' '2'

  const params = new URLSearchParams(location.search);
  const sessionName = params.get("arg") || "";

  const term = new Terminal({
    cursorBlink: true,
    fontFamily: 'ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace',
    fontSize: 14,
    scrollback: 10000,
    // The client owns scrollback while connected; the server's replay buffer only covers
    // what happened before this client attached. The two are different things and both are
    // needed — see api/ws-protocol.md.
    allowProposedApi: true,
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("term"));

  // The GPU renderer, loaded after open() because it needs the element. Without it xterm
  // uses its DOM renderer, which builds a node per cell and rebuilds the viewport on every
  // scroll tick — with scrollback: 10000 that is the stutter (#61). There is no canvas rung
  // between the two: @xterm/addon-canvas was never updated past xterm 5.
  //
  // Both failure modes end at the DOM renderer, which is why neither is fatal. loadAddon
  // throws when there is no WebGL at all (old browser, blocklisted driver), and a context
  // *lost later* — a backgrounded tab on a phone, a GPU driver reset — leaves an addon that
  // is loaded and drawing nothing, so dispose and let xterm revert. Slow beats black.
  try {
    const webgl = new WebglAddon.WebglAddon();
    webgl.onContextLoss(() => webgl.dispose());
    term.loadAddon(webgl);
  } catch { /* no WebGL; the DOM renderer still works */ }

  fit.fit();

  // Whether this page is a deep link, which decides what the button below can honestly
  // promise. `dtach -A` attaches *or creates*, so on a named session that has exited,
  // "reconnect" starts a new empty shell under the same name; an argless connection was never
  // a session to begin with. See api/ws-protocol.md section 13.
  const isNamed = new URLSearchParams(location.search).has("arg");

  const banner = document.getElementById("banner");
  // The second argument is the button's *label*, not a boolean. What the button does depends on
  // why the socket closed, so a fixed "reconnect" was a claim the page could not keep (#56).
  function showBanner(text, retryLabel) {
    banner.textContent = text;
    if (retryLabel) {
      const b = document.createElement("button");
      b.textContent = retryLabel;
      b.onclick = () => { banner.hidden = true; connect(); };
      banner.append(b);
    }
    banner.hidden = false;
  }

  const encoder = new TextEncoder();
  const decoder = new TextDecoder();
  let socket = null;

  // The two ways a payload becomes frame bytes. They are not interchangeable, and picking the
  // wrong one does not corrupt a report so much as send a *different* one (#64).
  //
  // Text is UTF-8: keystrokes, JSON, and mouse reports under SGR or urxvt, all of which are
  // printable ASCII.
  //
  // Binary is latin-1 — one byte per character code. xterm's onBinary delivers a "binary string"
  // rather than a Uint8Array, which is checkable in the vendored bundle: triggerBinaryEvent logs
  // `e.split("").map(c => c.charCodeAt(0))`. Its one producer is the X10 mouse encoder, which
  // builds `ESC [ M` followed by three raw bytes at 32+n, so any column past 95 puts a code above
  // 127 in that string. Through TextEncoder those expand to two bytes each and the app reads a
  // different position entirely.
  function frameBytes(opcode, payload, binary) {
    let body;
    if (binary) {
      body = new Uint8Array(payload.length);
      // & 0xff states the latin-1 intent; the assignment would truncate anyway, and the encoder
      // returns "" rather than emit a code above 255 (which is why X10 breaks past column 223).
      for (let i = 0; i < payload.length; i++) body[i] = payload.charCodeAt(i) & 0xff;
    } else {
      body = encoder.encode(payload);
    }
    const frame = new Uint8Array(body.length + 1);
    frame[0] = opcode.charCodeAt(0);
    frame.set(body, 1);
    return frame;
  }

  function send(opcode, payload, binary) {
    if (!socket || socket.readyState !== WebSocket.OPEN) return;
    socket.send(frameBytes(opcode, payload, binary));
  }

  function sendResize() {
    fit.fit();
    send(C_RESIZE, JSON.stringify({ columns: term.cols, rows: term.rows }));
  }

  async function connect() {
    // GET /token first, mirroring ttyd's client and the iOS app. With no auth configured
    // it returns an empty token; a failure here is not fatal.
    let token = "";
    try {
      const res = await fetch("token");
      if (res.ok) token = (await res.json()).token || "";
    } catch { /* no auth configured; empty token is correct */ }

    // Resolved against this page, not assembled from location.host, which is the same rule the
    // assets above follow (api/ws-protocol.md section 1: pages MUST use relative URLs so they
    // still work behind a stripping proxy). Building from location.host discarded the path
    // entirely, so behind a prefix the socket was the one thing that connected while every asset
    // and API call 404'd — or, with the prefix stripped on the way in, the reverse.
    //
    // This page is only ever served at "/" (handleRoot 404s anything else), so the base
    // directory is the prefix root. location.search is carried over verbatim: the server selects
    // the session from it, and a query string does not affect relative resolution.
    const url = new URL("ws" + location.search, location.href);
    url.protocol = location.protocol === "https:" ? "wss:" : "ws:";

    socket = new WebSocket(url.href, ["tty"]);
    socket.binaryType = "arraybuffer";

    socket.onopen = () => {
      banner.hidden = true;
      // Handshake as a TEXT frame. ttyd's own client sends this as binary and the iOS
      // client sends text; the server accepts either (api/ws-protocol.md §5).
      socket.send(JSON.stringify({ AuthToken: token, columns: term.cols, rows: term.rows }));
      sendResize();
      // No redraw kick here any more. wtd holds each session's attachment and replays its
      // recent output on attach, so the screen arrives on connect. The kick that used to
      // live here (rows-1, then the real size, to force a SIGWINCH) was one half of a
      // two-sided workaround; the server now does that once per session instead of once per
      // client. See hub.kick and api/ws-protocol.md.
      term.focus();
    };

    socket.onmessage = (ev) => {
      const data = new Uint8Array(ev.data);
      if (!data.length) return;
      const payload = data.subarray(1);
      switch (data[0]) {
        case S_OUTPUT: term.write(payload); break;
        case S_TITLE: document.title = decoder.decode(payload); break;
        case S_PREFS: break; // ttyd sends "{ }" with no -t options; nothing to apply
        default: break;      // unknown opcodes are ignored, so a newer server degrades
      }
    };

    socket.onclose = (ev) => {
      // Branch on the close code. api/ws-protocol.md section 13 defines 1000 as "the terminal's
      // process exited (shell exit, `exit` at an argless prompt, PTY EOF) … treat as final", and
      // that is the only code meaning the session is gone. Saying "the session is still running"
      // unconditionally was wrong in the state a user is most likely to be in — just after typing
      // `exit` — and it made the button lie: `dtach -A` attaches *or creates*, so reconnecting
      // after 1000 silently starts a new empty shell that looks like a rejoin. The iOS client had
      // the same bug from the other direction and "silently recreated the session the user had
      // just exited"; that is written up in section 13's traps.
      //
      // Every other code leaves the dtach session running, which is what the old text claimed:
      // 1001 (server restart), 1006 (transport drop), 1013 (backlog drop), and the handshake
      // codes. 1011 is the one imperfect fit — a failed spawn has no session either — but wtd
      // writes that error into the terminal as an OUTPUT frame, so the screen already says more
      // than a banner could.
      const reason = ev.reason ? ": " + ev.reason : "";
      if (ev.code === 1000) {
        showBanner(
          isNamed
            ? "session ended" + reason + " — reconnecting starts a new, empty one"
            : "shell exited" + reason,
          isNamed ? "new session" : "new shell"
        );
      } else {
        showBanner("disconnected" + reason + " — the session is still running", "reconnect");
      }
    };
    socket.onerror = () => showBanner("connection error", "reconnect");
  }

  // Scrolling a full-screen app is a network round trip, so batch it.
  //
  // On the alternate screen there is no local scrollback to move: xterm turns each wheel
  // event into a mouse report (or an arrow key) for the remote app, and the app redraws its
  // whole viewport in reply. xterm 6 emits exactly one of those per wheel event no matter
  // how far the event says you scrolled — consumeWheelEvent returns a line count and both
  // call sites use it only as a non-zero test — and it damps trackpad deltas by 0.3 on top.
  // So a swipe crawls, while a flick still buys one full-screen repaint per line (#63).
  //
  // Doing the conversion here fixes both halves. Two details are load-bearing:
  //
  //   - Synthetic wheel events, not hand-built escape sequences. xterm re-encodes each one
  //     for whichever protocol and encoding the app negotiated (SGR, X10, urxvt), so this
  //     cannot drift out of sync with the app's mouse mode the way a fixed report would.
  //   - deltaMode DOM_DELTA_LINE, because consumeWheelEvent returns for it directly instead
  //     of feeding its own fractional pixel accumulator. One dispatch, one report, no
  //     leftovers to interfere with the count kept here.
  //
  // Collecting the reports into a single INPUT frame is the part that fixes the stutter:
  // the app reads the whole batch in one pty read and repaints once, not once per line.
  //
  // What this bought, and what it did not (#70). It bought distance per gesture and one repaint
  // per batch. It did **not** buy smoothness, and nothing here can: every visible scroll step on
  // the alternate screen is still one round trip plus a full-viewport repaint. That is a floor,
  // not a defect — a local terminal has the same shape and only feels better because its round
  // trip is microseconds. Plain shell scrollback *is* smooth, because that content is already in
  // the browser and nothing is sent. Before optimising this again, know that these were measured
  // and do not work: a bigger client-side buffer (there is nothing local to buffer), more
  // aggressive coalescing (already once per animation frame, the display's own ceiling),
  // scrollSensitivity (feeds this same accumulator; cannot change reports-per-event), and local
  // scrollback for the alternate screen (guessing which parts of an arbitrary repaint are
  // scrollback — a multiplexer's job, and it gets it wrong too). The only thing that would move
  // the needle is an app that scrolls content it owns without a round trip, which is upstream of
  // this repo entirely.
  const WHEEL_LINES_PER_NOTCH = 3; // what a wheel notch moves in every other terminal
  let wheelLines = 0;   // whole + fractional lines owed to the app
  let wheelFlush = 0;   // pending rAF handle; 0 when idle
  let wheelAt = null;   // where the pointer was, for the mouse report's coordinates
  let wheelBatch = null; // while batching: {binary, data}, so the report handlers append
  let replayingWheel = false; // our own dispatches must reach xterm untouched

  // Measured rather than derived from fontSize, which ignores lineHeight and zoom.
  function cellHeight() {
    const screen = term.element && term.element.querySelector(".xterm-screen");
    const h = screen && term.rows ? screen.clientHeight / term.rows : 0;
    return h > 0 ? h : 17;
  }

  function flushWheel() {
    wheelFlush = 0;
    let lines = Math.trunc(wheelLines);
    wheelLines -= lines; // keep the fraction; it belongs to the next frame
    if (!lines || !wheelAt) return;

    // A hard flick should not become thousands of repaint requests. Four screens in one
    // frame is already more than anyone can read, so drop the excess rather than queue it
    // — queueing would keep the terminal scrolling after the gesture stopped.
    const cap = Math.max(term.rows * 4, 1);
    if (Math.abs(lines) > cap) lines = Math.sign(lines) * cap;

    wheelBatch = { binary: false, data: "" };
    replayingWheel = true;
    try {
      for (let i = 0; i < Math.abs(lines); i++) {
        term.element.dispatchEvent(new WheelEvent("wheel", {
          deltaY: Math.sign(lines),
          deltaMode: WheelEvent.DOM_DELTA_LINE,
          clientX: wheelAt.x,
          clientY: wheelAt.y,
          bubbles: true,
          cancelable: true,
        }));
      }
    } finally {
      replayingWheel = false;
      const batch = wheelBatch;
      wheelBatch = null;
      if (batch.data) send(C_INPUT, batch.data, batch.binary);
    }
  }

  term.attachCustomWheelEventHandler((ev) => {
    if (replayingWheel) return true;
    // The normal buffer scrolls natively, via overflow-y on .xterm-viewport. That path is
    // local, already smooth, and already moves the right distance — leave it alone.
    if (term.buffer.active.type !== "alternate" && term.modes.mouseTrackingMode === "none") {
      return true;
    }

    // xterm only calls preventDefault on some of the paths that reach here, and on the
    // alternate screen there is no viewport to scroll, so say so explicitly.
    ev.preventDefault();
    wheelAt = { x: ev.clientX, y: ev.clientY };
    if (ev.deltaMode === WheelEvent.DOM_DELTA_LINE) {
      wheelLines += ev.deltaY * WHEEL_LINES_PER_NOTCH;
    } else if (ev.deltaMode === WheelEvent.DOM_DELTA_PAGE) {
      wheelLines += ev.deltaY * term.rows;
    } else {
      wheelLines += ev.deltaY / cellHeight(); // 1:1 with the finger, no 0.3 damping
    }
    if (!wheelFlush) wheelFlush = requestAnimationFrame(flushWheel);
    return false;
  });

  // Everything the terminal wants to send, from both of xterm's two output events.
  //
  // A mouse report goes to exactly one of them, chosen by the encoding the app negotiated:
  // xterm's CoreMouseService does `"DEFAULT" === this._activeEncoding ?
  // triggerBinaryEvent(t) : triggerDataEvent(t, true)`, and DEFAULT is X10. So a gesture's
  // reports are all of one kind, which is what lets a batch carry a single `binary` flag — and
  // the batch window is fully synchronous (dispatchEvent through to the finally), so no
  // keystroke can land in the middle of one and be mis-encoded.
  function sendReport(d, binary) {
    // Mid-batch: this is a scroll's reports, collected so they leave as one frame.
    if (wheelBatch !== null) {
      wheelBatch.binary = binary;
      wheelBatch.data += d;
      return;
    }
    send(C_INPUT, d, binary);
  }

  term.onData((d) => sendReport(d, false));
  // Unregistered until #64, and X10 sends every click, drag and wheel report here rather than to
  // onData — so under it the app enabled mouse mode, the page dutifully stopped doing anything
  // else with the event, and nothing was sent. Two reasons it went unnoticed: modern TUIs ask for
  // SGR (`?1006h`), Claude Code among them, and X10 coordinates break past column 223 anyway, so
  // it is the fallback nobody exercises.
  term.onBinary((d) => sendReport(d, true));
  term.onResize(() => send(C_RESIZE, JSON.stringify({ columns: term.cols, rows: term.rows })));

  // Debounced so dragging a window edge does not flood the pty.
  let resizeTimer = null;
  addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(sendResize, 100);
  });

  // Help overlay: a native <dialog>, because showModal() provides the two properties
  // that matter here for free — the rest of the page is inert while it is open (no
  // typing into the shell behind the panel), and it has no keyboard behaviour at all
  // while closed, including Escape. The "?" button is pointer-only (tabindex=-1) for
  // the same reason: every keystroke on this page belongs to the shell.
  //
  // The content is /help (one document, also linked from the picker), fetched on first
  // open and injected, so the copy cannot drift apart; the styling both contexts share
  // is /help.css.
  const helpEl = document.getElementById("help");
  const helpBody = document.getElementById("helpbody");
  let helpLoaded = false;

  async function openHelp() {
    helpEl.showModal();
    if (helpLoaded) return;
    helpLoaded = true;
    try {
      const res = await fetch("help");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const doc = new DOMParser().parseFromString(await res.text(), "text/html");
      const main = doc.querySelector("main");
      if (!main || !main.children.length) throw new Error("empty");
      // A same-tab navigation would silently drop this page's socket mid-session, so
      // anything the help links to opens beside the terminal instead.
      for (const a of main.querySelectorAll("a")) { a.target = "_blank"; a.rel = "noopener"; }
      helpBody.replaceChildren(...main.children);
    } catch {
      helpLoaded = false; // retry on next open
      helpBody.textContent = "could not load help — open /help directly";
    }
  }

  document.getElementById("helpbtn").onclick = openHelp;
  document.getElementById("helpclose").onclick = () => helpEl.close();
  // A click landing on the dialog element itself is on the backdrop or the border —
  // #helppanel covers everything inside. Escape needs no code; <dialog> handles it.
  helpEl.onclick = (ev) => { if (ev.target === helpEl) helpEl.close(); };
  helpEl.addEventListener("close", () => term.focus());

  document.title = sessionName ? sessionName + " — terminal" : "terminal";
  connect();
})();
</script>
