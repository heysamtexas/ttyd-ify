    if (it.state === "uploading" && it.xhr) it.xhr.abort(); // onabort marks it
    else if (it.state === "pending") { it.state = "cancelled"; paintItem(it); }
  }

  // --- sending
  function sendUpload(it) {
    return new Promise((resolve) => {
      const xhr = new XMLHttpRequest();
      it.xhr = xhr;
      it.state = "uploading";
      paintItem(it, 0);
      xhr.open("POST", "api/v1/uploads?name=" + encodeURIComponent(it.name));
      xhr.setRequestHeader("Content-Type", "application/octet-stream");
      xhr.upload.onprogress = (e) => paintItem(it, e.loaded);
      xhr.onload = () => {
        let body = null;
        try { body = JSON.parse(xhr.responseText); } catch {}
        if (xhr.status === 201 && body) {
          it.state = "done";
          it.saved = body;
        } else {
          it.state = "failed";
          const err = body && body.error;
          if (xhr.status === 401) it.why = "not signed in — reload this page";
          else if (err) it.why = err.message + (err.detail ? " (" + err.detail + ")" : "");
          else it.why = "server answered HTTP " + xhr.status;
        }
        resolve();
      };
      // A dropped connection, a server restart mid-upload, or a file that vanished from the
      // disk after it was chosen all land here; the browser does not say which.
      xhr.onerror = () => {
        it.state = "failed";
        it.why = "connection lost, or the file could not be read";
        resolve();
      };
      xhr.onabort = () => { it.state = "cancelled"; resolve(); };
      xhr.send(it.file);
    }).then(() => { it.xhr = null; paintItem(it); });
  }
  async function pump() {
    if (pumping) return;
    pumping = true;
    upBtn.classList.add("busy");
    try {
      let it;
      while ((it = batch.find((x) => x.state === "pending"))) await sendUpload(it);
    } finally {
      pumping = false;
      upBtn.classList.remove("busy");
    }
    finishBatch();
  }

  // --- the result
  function finishBatch() {
    const done = batch.filter((x) => x.state === "done");
    const failed = batch.filter((x) => x.state === "failed");
    const cancelled = batch.filter((x) => x.state === "cancelled");
    if (!batch.length) return;
    for (const x of done) fresh.add(x.saved.name);
    upQueue.replaceChildren();

    const parts = [];
    if (done.length) parts.push(done.length + " uploaded");
    if (failed.length) parts.push(failed.length + " failed");
    if (cancelled.length) parts.push(cancelled.length + " cancelled");
    const headline = (failed.length ? "✗ " : done.length ? "✓ " : "") + parts.join(", ");

    upResult.replaceChildren();
    upResult.className = failed.length ? "bad" : "";
    upResult.append(el("b", "", headline));
    for (const x of batch) {
      const row = el("div", "upres " + (x.state === "done" ? "ok" : x.state === "failed" ? "bad" : ""));
      const mark = el("span", "", x.state === "done" ? "✓" : x.state === "failed" ? "✗" : "–");
      const txt = el("span", "", x.name);
      if (x.state === "done" && x.saved.name !== x.name) {
        txt.append(el("span", "why", " → saved as " + x.saved.name + " (name was taken)"));
      } else if (x.state === "failed") {
        txt.append(el("span", "why", " — " + x.why));
      } else if (x.state === "cancelled") {
        txt.append(el("span", "why", " — cancelled"));
      }
      row.append(mark, txt);
      upResult.append(row);
    }
    const ok = el("div", "upacts");
    const dismiss = el("button", "", "dismiss");
    dismiss.tabIndex = -1;
    dismiss.onclick = () => { upResult.hidden = true; };
    ok.append(dismiss);
    upResult.append(ok);
    upResult.hidden = false;
    loadUploads();

    if (!upPanel.classList.contains("open")) {
      if (failed.length) showToast(headline + " — open ↑ for details", true);
      else if (done.length === 1) showToast("saved to " + done[0].saved.path);
      else if (done.length) showToast(headline);
    }
  }

  // --- the list
  let listing = 0;
  async function loadUploads() {
    const mine = ++listing;
    try {
      const res = await fetch("api/v1/uploads", { cache: "no-store" });
      if (!res.ok) throw new Error(res.status === 401 ? "not signed in — reload this page" : "HTTP " + res.status);
      const list = await res.json();
      if (mine !== listing) return; // a newer read is in flight
      renderUploads(list);
    } catch (e) {
      if (mine !== listing) return;
      upCount.textContent = "";
      upList.replaceChildren(el("div", "uperr", "could not read the uploads folder: " + e.message));
    }
  }
  function renderUploads(list) {
    upCount.textContent = list.length ? "· " + list.length : "";
    if (!list.length) {
      upList.replaceChildren(el("div", "pnote", "nothing here yet"));
      return;
    }
    upList.replaceChildren(...list.map(fileRow));
  }
  function fileRow(f) {
    const row = el("div", "upfile" + (fresh.has(f.name) ? " fresh" : ""));
    const nm = el("div", "upname", f.name);
    nm.title = f.path;
    const meta = el("div", "upmeta", fmtSize(f.bytes) + " · " + fmtAge(f.modifiedAt));
    meta.title = new Date(f.modifiedAt).toLocaleString();
    const acts = el("div", "upacts");
    const href = "uploads/" + encodeURIComponent(f.name);
    const btn = (label, fn, cls) => {
      const b = el("button", cls || "", label);
      b.tabIndex = -1;
      b.onclick = fn;
      return b;
    };
    const link = (label, url, dl) => {
      const a = el("a", "", label);
      a.href = url;
      a.tabIndex = -1;
      // A same-tab navigation would drop this page's socket, so a view opens beside it.
      if (dl) a.setAttribute("download", f.name);
      else { a.target = "_blank"; a.rel = "noopener"; }
      return a;
    };
    const copyBtn = btn("copy path", async () => {
      copyBtn.textContent = (await copyText(f.path)) ? "copied" : "copy failed";
      setTimeout(() => { copyBtn.textContent = "copy path"; }, 1500);
    });
    const normal = () => acts.replaceChildren(copyBtn, link("open", href), link("download", href + "?download=1", true),
      btn("delete", confirmDelete, "danger"));
    function confirmDelete() {
      acts.replaceChildren(el("span", "ask", "delete this file?"),
        btn("yes, delete", doDelete, "danger"), btn("keep", normal));
    }
    async function doDelete() {
      acts.replaceChildren(el("span", "ask", "deleting…"));
      try {
        const res = await fetch("api/v1/uploads/" + encodeURIComponent(f.name), { method: "DELETE" });
        // Already gone (another tab, or the shell) is the outcome that was asked for.
        if (!res.ok && res.status !== 404) {
          const body = await res.json().catch(() => null);
          throw new Error(body && body.error ? body.error.message : "HTTP " + res.status);
        }
        fresh.delete(f.name);
        loadUploads();
      } catch (e) {
        normal();
        acts.after(el("div", "uperr", "could not delete: " + e.message));
      }
    }
    normal();
    row.append(nm, meta, acts);
    return row;
  }
  // navigator.clipboard exists only in a secure context, and a plain-HTTP tailnet address is not
  // one, so the old execCommand path is the one this page usually takes.
  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch {}
    const ta = el("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.append(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    ta.remove();
    return ok;
  }

  // --- choosing and dropping
  upDrop.onclick = () => upFile.click();
  upFile.onchange = () => {
    const files = [...upFile.files];
    upFile.value = ""; // so choosing the same file again still fires change
    if (files.length) enqueue(files);
  };
  // Drops land only in the zone. Everywhere else on the page a drop is swallowed, because the
  // browser's default for a file dropped on a page is to navigate to it — which would close
  // this terminal's socket mid-session.
  let dragDepth = 0;
  const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes("Files");
  window.addEventListener("dragover", (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = upDrop.contains(e.target) ? "copy" : "none";
  });
  window.addEventListener("drop", (e) => { if (hasFiles(e)) e.preventDefault(); });
  upDrop.addEventListener("dragenter", (e) => { if (hasFiles(e)) { dragDepth++; upDrop.classList.add("over"); } });
  upDrop.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; upDrop.classList.remove("over"); } });
  upDrop.addEventListener("drop", (e) => {
    dragDepth = 0;
    upDrop.classList.remove("over");
    if (!hasFiles(e)) return;
    const files = [], rejects = [];
    const items = [...(e.dataTransfer.items || [])].filter((i) => i.kind === "file");
    if (items.length && items[0].webkitGetAsEntry) {
      for (const i of items) {
        const entry = i.webkitGetAsEntry();
        const f = i.getAsFile();
        if (entry && entry.isDirectory) rejects.push({ name: entry.name + "/", why: "folders can't be uploaded — zip it, or drop the files inside" });
        else if (f) files.push(f);
      }
    } else {
      files.push(...e.dataTransfer.files);
    }
    if (files.length || rejects.length) enqueue(files, rejects);
  });
  // Leaving mid-upload abandons it; say so rather than letting a reload eat a large file.
  window.addEventListener("beforeunload", (e) => {
    if (pumping) { e.preventDefault(); e.returnValue = ""; }
  });
  // Keep focus off <body> while the panel is used, for the reason the loop below explains.
  upPanel.addEventListener("mousedown", (e) => {
    if (e.target.closest("button, a, #updrop")) e.preventDefault();
  });

  fetch("api/v1/meta").then((r) => r.json()).then((m) => {
    if (!m.uploadDir) { upBtn.hidden = true; return; }
    upDirEl.textContent = m.uploadDir;
    upDirEl.title = m.uploadDir;
    upBtn.title = "uploads — " + m.uploadDir;
    if (m.maxUploadBytes) {
      upMax = m.maxUploadBytes;
      document.getElementById("uplimit").textContent = "up to " + fmtSize(upMax) + " each";
    }
  }).catch(() => {});

  for (const el of [panelBtn, panelClose, subSwitch, astigSwitch, fsSwitch, upBtn, upClose]) {
    el.addEventListener("mousedown", (ev) => ev.preventDefault());
  }
  // Coming back to a hidden tab should show a current reading, not the one from whenever it
  // was hidden.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && panel.classList.contains("open")) { pollHost(); pollPrompts(); }
    if (!document.hidden && upPanel.classList.contains("open")) loadUploads();
  });

  connect();
})();
</script>
