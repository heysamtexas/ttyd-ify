<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>terminal</title>
<script src="sub.js"></script>
<script src="astig.js"></script>
<!--
  Browser terminal, served at / when ?arg= is present.

  This is ttyd's web client reimplemented against the protocol documented in
  api/ws-protocol.md — the same protocol the iOS app speaks, so this page and a saved
  phone profile exercise the identical server path. That is the point: a bug reachable
  from here is reachable from the phone.

  All assets are vendored and served from this origin (see vendor/PROVENANCE.md). No CDN:
  this page is normally reached over a tailnet with no route to the public internet.
-->
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="help.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  #term { position: absolute; inset: 0; padding: 4px; }
  #banner {
    position: absolute; left: 0; right: 0; top: 0; z-index: 10;
    font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace;
    text-align: center; padding: .35rem; background: #7f1d1d; color: #fff;
  }
  #banner[hidden] { display: none; }
  /* The link-target readout — a browser status bar for the grid. It exists because an
     OSC 8 label is picked by whatever wrote the output and can read as a different URL
     than it opens; the real target has to be visible somewhere output cannot write. */
  #linkbar {
    position: fixed; z-index: 5;
    left: calc(4px + env(safe-area-inset-left)); bottom: calc(4px + env(safe-area-inset-bottom));
    max-width: calc(100% - 2rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; pointer-events: none;
    background: #1d2023; color: #e8e8e4; border: 1px solid #2b2e31; border-radius: 4px;
    padding: 0 .5rem;
  }
  #linkbar[hidden] { display: none; }
  #banner button {
    font: inherit; margin-left: .6rem; background: none; color: #fff;
    border: 1px solid #fff; border-radius: 3px; padding: 0 .5rem; cursor: pointer;
  }
  /* Below the banner (z 10): while disconnected the banner wins the corner, which is
     fine — the overlay itself needs no z-index at all, showModal() is top-layer. */
  #helpbtn {
    position: fixed; z-index: 5;
    top: calc(6px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
    width: 1.7rem; height: 1.7rem; border-radius: 50%; opacity: .5; cursor: pointer;
    font: 13px ui-monospace, Menlo, Consolas, monospace;
    background: rgba(255,255,255,.08); color: #9a9a94; border: 1px solid #2b2e31;
  }
  #helpbtn:hover, #helpbtn:active { opacity: 1; }
  #help {
    /* The always-dark ground for the shared .faq rules in /help.css. */
    --faq-muted: #9a9a94; --faq-card: #16181a; --faq-line: #2b2e31;
    --faq-kbd-line: #3b3e41; --faq-kbd-bg: #1d2023;
    width: calc(100% - 2rem); max-width: 34rem; padding: 0; overflow: hidden;
    background: #1d2023; color: #e8e8e4; border: 1px solid #2b2e31; border-radius: 8px;
  }
  #help::backdrop { background: rgba(0, 0, 0, .55); }
  #helppanel {
    max-height: calc(100vh - 4rem); overflow-y: auto; padding: 1rem 1.25rem 1.25rem;
    font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #helpclose {
    float: right; font: inherit; cursor: pointer; line-height: 1;
    background: none; color: #9a9a94; border: 1px solid #2b2e31;
    border-radius: 4px; padding: .1rem .45rem;
  }
  /* Host panel. An overlay, deliberately not a column: shrinking #term would resize the pty
     on every peek, and a full-screen program answers a resize by repainting everything. So
     nothing here touches #term's box and nothing calls sendResize().

     z-index 8 puts it over #linkbar and #helpbtn (5) and under #banner (10) — a disconnect
     notice must never be the thing this hides. Not a <dialog>: showModal() makes the rest of
     the page inert, which is right for a help overlay you read and wrong for a gauge you
     glance at while the shell keeps running. */
  :root { --panel-w: min(22rem, 88vw); }
  #panel, #uppanel {
    position: fixed; z-index: 8; top: 0; bottom: 0; right: 0;
    width: var(--panel-w);
    transform: translateX(100%); visibility: hidden;
    transition: transform .18s ease-out, visibility .18s;
    box-sizing: border-box; overflow-y: auto; overscroll-behavior: contain;
    background: #1d2023; color: #e8e8e4; border-left: 1px solid #2b2e31;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: calc(.5rem + env(safe-area-inset-top)) calc(.7rem + env(safe-area-inset-right))
             calc(.7rem + env(safe-area-inset-bottom)) .7rem;
  }
  #panel.open, #uppanel.open { transform: none; visibility: visible; }
  #panelhead, #uphead {
    display: flex; align-items: center; gap: .5rem;
    padding-bottom: .4rem; border-bottom: 1px solid #2b2e31; margin-bottom: .5rem;
  }
  #panelverdict, #uptitle { flex: 0 0 auto; font-weight: bold; letter-spacing: .04em; }
  #panelage, #updir {
    flex: 1 1 auto; color: #9a9a94; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #panelclose, #upclose {
    flex: 0 0 auto; font: inherit; cursor: pointer; line-height: 1;
    background: none; color: #9a9a94; border: 1px solid #2b2e31;
    border-radius: 4px; padding: .1rem .45rem;
  }
  #panelbtn {
    position: fixed; z-index: 5;
    top: calc(6px + env(safe-area-inset-top));
    right: calc(10px + 1.7rem + .4rem + env(safe-area-inset-right));
    width: 1.7rem; height: 1.7rem; border-radius: 50%; opacity: .5; cursor: pointer;
    font: 13px ui-monospace, Menlo, Consolas, monospace;
    background: rgba(255,255,255,.08); color: #9a9a94; border: 1px solid #2b2e31;
  }
  #panelbtn:hover, #panelbtn:active { opacity: 1; }
  /* The toggle hides under the open panel it would be covered by; the panel has its own × .
     "?" cannot do the same -- help would simply become unreachable while the panel is open --
     so it steps left instead, by exactly the panel's width. */
  #panel.open ~ #panelbtn { visibility: hidden; }
  #helpbtn, #panelbtn, #upbtn { transition: right .18s ease-out; }
  #panel.open ~ #helpbtn {
    right: calc(10px + var(--panel-w) + env(safe-area-inset-right));
  }
  /* Upload, one slot left of the panel toggle. Whichever flyout is open, its own toggle hides
     under it (each has its own ×) and the buttons left of it step left by the panel's width, so
     every other control stays reachable. */
  #upbtn {
    position: fixed; z-index: 5;
    top: calc(6px + env(safe-area-inset-top));
    right: calc(10px + 2 * (1.7rem + .4rem) + env(safe-area-inset-right));
    width: 1.7rem; height: 1.7rem; border-radius: 50%; opacity: .5; cursor: pointer;
    font: 13px ui-monospace, Menlo, Consolas, monospace;
    background: rgba(255,255,255,.08); color: #9a9a94; border: 1px solid #2b2e31;
  }
  #upbtn:hover, #upbtn:active { opacity: 1; }
  /* Uploading with the panel shut: the button is the only sign anything is happening. */
  #upbtn.busy { opacity: 1; color: #4ade80; border-color: #4ade80; }
  #panel.open ~ #upbtn {
    right: calc(10px + var(--panel-w) + 1.7rem + .4rem + env(safe-area-inset-right));
  }
  #uppanel.open ~ #upbtn { visibility: hidden; }
  #uppanel.open ~ #panelbtn {
    right: calc(10px + var(--panel-w) + 1.7rem + .4rem + env(safe-area-inset-right));
  }
  #uppanel.open ~ #helpbtn {
    right: calc(10px + var(--panel-w) + env(safe-area-inset-right));
  }
  /* The upload panel. Same flyout as the host panel (above), its own contents here. */
  #updrop {
    display: flex; flex-direction: column; align-items: center; gap: .15rem;
    padding: 1.1rem .5rem; margin-bottom: .6rem; cursor: pointer; text-align: center;
    border: 1px dashed #4b4e51; border-radius: 6px; color: #9a9a94;
  }
  #updrop > b { color: #e8e8e4; font-weight: normal; }
  #updrop:hover { border-color: #9a9a94; }
  #updrop.over { border-style: solid; border-color: #4ade80; background: rgba(74,222,128,.08); }
  .upitem { margin-top: .45rem; }
  .uptop { display: flex; align-items: baseline; gap: .5rem; }
  .upname { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .upstat { flex: 0 0 auto; color: #9a9a94; font-variant-numeric: tabular-nums; }
  .upcancel { font: inherit; cursor: pointer; background: none; color: #9a9a94; border: none; padding: 0 .2rem; }
  .upcancel:hover { color: #f87171; }
  .upitem .pbar > i { background: #4ade80; transition: width .15s linear; }
  #upresult {
    margin: .3rem 0 .6rem; padding: .45rem .55rem; border-radius: 4px;
    border: 1px solid #2b2e31; border-left: 3px solid #4ade80;
  }
  #upresult.bad { border-left-color: #f87171; }
  #upresult > b { display: block; margin-bottom: .2rem; }
  .upres { display: flex; gap: .4rem; margin-top: .2rem; }
  .upres > span:first-child { flex: 0 0 1ch; }
  .upres > span:last-child { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .upres.ok > span:first-child { color: #4ade80; }
  .upres.bad > span:first-child { color: #f87171; }
  .upres .why { color: #9a9a94; }
  .upfile { margin-top: .5rem; padding-top: .45rem; border-top: 1px solid #23262a; }
  .upfile.fresh .upname { color: #4ade80; }
  .upfile .upmeta { color: #9a9a94; }
  .upacts { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .25rem; }
  .upacts > button, .upacts > a {
    font: inherit; font-size: 11px; cursor: pointer; text-decoration: none; line-height: 1.5;
    background: none; color: #c8c8c4; border: 1px solid #2b2e31; border-radius: 4px; padding: 0 .4rem;
  }
  .upacts > button:hover, .upacts > a:hover { border-color: #9a9a94; color: #fff; }
  .upacts > .danger { color: #f87171; }
  .upacts > .ask { color: #e8e8e4; border: none; padding: 0; cursor: default; }
  .uperr { color: #f87171; margin-top: .2rem; }
  /* Where an upload went, or why it did not. Bottom right so it never covers #linkbar's
     bottom-left readout; over the panel (8) so it is seen when the panel is open too. */
  #toast {
    position: fixed; z-index: 9;
    right: calc(10px + env(safe-area-inset-right)); bottom: calc(10px + env(safe-area-inset-bottom));
    max-width: calc(100% - 2rem); overflow-wrap: anywhere;
    font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; pointer-events: none;
    background: #1d2023; color: #e8e8e4; border: 1px solid #2b2e31; border-radius: 4px;
    padding: .25rem .6rem;
  }
  #toast.bad { border-color: #b91c1c; }
  #toast[hidden] { display: none; }
  .prow { display: flex; align-items: baseline; gap: .5rem; margin-top: .35rem; }
  .plabel { flex: 0 0 3.4rem; color: #9a9a94; }
  .pval { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pnum { flex: 0 0 auto; text-align: right; font-variant-numeric: tabular-nums; }
  /* A bar is a bar, not a gradient: the fill colour carries the verdict and nothing else
     does, so it has to be readable at 6px tall. */
  .pbar { height: 6px; background: #2b2e31; border-radius: 3px; overflow: hidden; margin-top: .2rem; }
  .pbar > i { display: block; height: 100%; }
  .psec {
    margin-top: .8rem; padding-top: .5rem; border-top: 1px solid #2b2e31;
    color: #9a9a94; letter-spacing: .04em;
  }
  .pnote { color: #9a9a94; margin-top: .35rem; }
  /* A prompt is prose, so it wraps rather than truncating to one line the way a session name
     does — the point is to recognise what you said, and three words is often not enough. */
  .pprompt { margin-top: .45rem; padding-left: .5rem; border-left: 2px solid #2b2e31; }
  .pprompt > time { display: block; color: #9a9a94; font-size: 11px; }
  .pprompt > span { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pprompt.last { border-left-color: #4ade80; }
  /* The panel's switches (submarine mode, full screen). The on/off word carries the state, not
     a colour: in submarine mode every colour on the page is some shade of red. */
  .pswitch {
    display: flex; width: 100%; justify-content: space-between; align-items: baseline;
    font: inherit; cursor: pointer; text-align: left; margin-bottom: .5rem;
    background: none; color: #e8e8e4; border: 1px solid #2b2e31; border-radius: 4px;
    padding: .25rem .5rem;
  }
  .pswitch > span { color: #9a9a94; }
  .pswitch[hidden] { display: none; }
  /* Submarine mode's controls. Its filter keeps only red, and pure red is a dark colour: the
     page's quiet greys land near black, so the corner buttons, the panel's edges and the
     reconnect button stopped being findable in a dark room. Edges and labels come up here and
     the ground goes to black; body text is left alone, because brightness is what the mode
     exists to take away. Daylight keeps the quiet corner buttons -- they sit over output. */
  html.sub #helpbtn, html.sub #panelbtn, html.sub #upbtn {
    opacity: .9; color: #fff; background: rgba(0,0,0,.7); border-color: #c8c8c4;
  }
  html.sub #panel, html.sub #uppanel { background: #000; border-left-color: #c8c8c4; }
  html.sub #uphead, html.sub .upfile, html.sub #upresult { border-color: #6b6b66; }
  html.sub #updrop, html.sub .upacts > button, html.sub .upacts > a, html.sub #upclose {
    border-color: #9a9a94; color: #c8c8c4;
  }
  html.sub #updir, html.sub .upstat, html.sub .upfile .upmeta, html.sub .upres .why { color: #c8c8c4; }
  html.sub #toast { background: #000; color: #fff; border-color: #c8c8c4; }
  html.sub #panelhead, html.sub .psec { border-color: #6b6b66; }
  html.sub #panelclose, html.sub #helpclose, html.sub .pswitch { border-color: #9a9a94; }
  html.sub #panelclose, html.sub #helpclose, html.sub #panelage, html.sub .plabel,
  html.sub .psec, html.sub .pnote, html.sub .pprompt > time, html.sub .pswitch > span {
    color: #c8c8c4;
  }
  html.sub .pbar { background: #3b3e41; }
  html.sub #help { border-color: #9a9a94; }
  /* The one control that matters when the connection is gone: filled, not outlined. */
  html.sub #banner button { background: #fff; color: #000; font-weight: bold; }
  /* Astigmatism mode (astig.js, #140). The grid is xterm's and is themed in script below; this
     is the ground around it (the 4px of #term padding would otherwise frame it in black) and
     the page's own chrome, in the same face and softened greys. */
  html.astig, html.astig body { background: var(--astig-bg); }
  html.astig #panel, html.astig #uppanel, html.astig #helppanel, html.astig #linkbar,
  html.astig #banner, html.astig #toast {
    font-family: var(--astig-font); font-weight: 500;
  }
  html.astig #panel, html.astig #uppanel {
    font-size: 14px; background: var(--astig-bg); color: var(--astig-fg);
  }
  html.astig #updir, html.astig .upstat, html.astig .upfile .upmeta,
  html.astig .upres .why { color: var(--astig-muted); }
  html.astig #helppanel { font-size: 15px; }
  html.astig #help {
    background: var(--astig-bg); color: var(--astig-fg); border-color: #3a3a3a;
    --faq-muted: var(--astig-muted); --faq-card: #262626; --faq-line: #3a3a3a;
    --faq-kbd-bg: #262626; --faq-kbd-line: #3a3a3a;
  }
  html.astig #panelage, html.astig .plabel, html.astig .psec, html.astig .pnote,
  html.astig .pprompt > time, html.astig .pswitch > span { color: var(--astig-muted); }
  html.astig .pswitch { color: var(--astig-fg); }
</style>

<div id="banner" hidden></div>
<div id="linkbar" hidden></div>
<div id="term"></div>
<aside id="panel" aria-label="host status">
  <div id="panelhead">
    <span id="panelverdict">host</span>
    <span id="panelage"></span>
    <button id="panelclose" aria-label="close" tabindex="-1">×</button>
  </div>
  <button id="subswitch" class="pswitch" role="switch" aria-checked="false" tabindex="-1">submarine mode <span>off</span></button>
  <button id="astigswitch" class="pswitch" role="switch" aria-checked="false" tabindex="-1">astigmatism mode <span>off</span></button>
  <button id="fsswitch" class="pswitch" role="switch" aria-checked="false" tabindex="-1">full screen <span>off</span></button>
  <div id="panelbody"><div class="pnote">reading…</div></div>
  <div id="panelprompts"></div>
</aside>
<aside id="uppanel" aria-label="uploads">
  <div id="uphead">
    <span id="uptitle">uploads</span>
    <span id="updir"></span>
    <button id="upclose" aria-label="close" tabindex="-1">×</button>
  </div>
  <div id="updrop" role="button" tabindex="-1">
    <b>drop files here</b><span>or click to choose</span><span id="uplimit"></span>
  </div>
  <div id="upqueue"></div>
  <div id="upresult" role="status" hidden></div>
  <div class="psec">files <span id="upcount"></span></div>
  <div id="uplist"><div class="pnote">reading…</div></div>
</aside>
<button id="panelbtn" aria-label="host status" title="host status" tabindex="-1">≡</button>
<button id="helpbtn" aria-label="help" tabindex="-1">?</button>
<button id="upbtn" aria-label="uploads" title="uploads" tabindex="-1">&#8593;</button>
<input type="file" id="upfile" multiple hidden>
<div id="toast" role="status" hidden></div>
<dialog id="help" aria-label="help">
  <div id="helppanel">
    <button id="helpclose" aria-label="close">×</button>
    <div id="helpbody" class="faq"><p>loading…</p></div>
  </div>
</dialog>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-web-links.js"></script>
<script src="vendor/addon-webgl.js"></script>
<script>
(function () {
  // Opcodes, from api/ws-protocol.md. Client and server reuse the same byte values with
  // different meanings, which is why they are listed separately.
  const C_INPUT = "0", C_RESIZE = "1";
  const S_OUTPUT = 48, S_TITLE = 49, S_PREFS = 50; // '0' '1' '2'

  const params = new URLSearchParams(location.search);
  const sessionName = params.get("arg") || "";

  // URLs in output are links, via the web-links addon (bare URLs in text) and linkHandler
  // (OSC 8 hyperlinks, e.g. `ls --hyperlink`). Opening one is deliberately explicit (#90):
  //
  //  - Cmd/Ctrl + left click. A plain click is how text is selected, and inside a TUI
  //    holding mouse tracking it is a message to the program — neither may open a tab.
  //  - Hovering shows the *target* in #linkbar. This replaces the confirm() dialog xterm
  //    pops for OSC 8 links when no linkHandler is set, and it is the anti-spoof half of
  //    the gesture: an OSC 8 label can read as one URL and open another, so the readout,
  //    not the underlined text, is what to trust.
  //  - A new tab with noreferrer (which implies noopener): a same-tab navigation would
  //    silently drop this page's socket mid-session, and a Referer would hand this
  //    server's address to a site chosen by terminal output.
  //  - http(s) only, repeating what xterm enforces for OSC 8 links while
  //    linkHandler.allowNonHttpProtocols is unset, so both link paths refuse the same
  //    things.
  const linkbar = document.getElementById("linkbar");
  function showLinkTarget(_event, uri) { linkbar.textContent = uri; linkbar.hidden = false; }
  function hideLinkTarget() { linkbar.hidden = true; }
  function openLink(event, uri) {
    if (event.button !== 0 || (!event.metaKey && !event.ctrlKey)) return;
    let proto; try { proto = new URL(uri).protocol; } catch { return; }
    if (proto !== "http:" && proto !== "https:") return;
    window.open(uri, "_blank", "noreferrer");
  }

  // The look: the defaults, or astigmatism mode's (astig.js, #140). Every key either side sets
  // is set by both, so switching back restores exactly what was there.
  const DEFAULT_FONT = 'ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace';
  function lookOptions(size) {
    if (!size) {
      return {
        fontFamily: DEFAULT_FONT, fontSize: 14, fontWeight: "normal", fontWeightBold: "bold",
        lineHeight: 1, theme: {}, minimumContrastRatio: 1,
        drawBoldTextInBrightColors: true, cursorBlink: true,
      };
    }
    return {
      fontFamily: wtAstig.FAMILY + ", " + DEFAULT_FONT, fontSize: size,
      // Medium, not Regular: at a distance thin strokes are what blurs first.
      fontWeight: 500, fontWeightBold: 700, lineHeight: 1.2,
      theme: { ...wtAstig.PALETTE, background: wtAstig.BG, foreground: wtAstig.FG, cursorAccent: wtAstig.BG },
      // Lifts any foreground too close to its background -- including the 256-colour and
      // truecolor ones a program paints past this theme -- to 4.5:1, WCAG AA for text.
      minimumContrastRatio: 4.5,
      // Otherwise bold means "brighter", and a brighter white is exactly what halates.
      drawBoldTextInBrightColors: false,
      // A steady cursor: blinking is motion in peripheral vision all day.
      cursorBlink: false,
    };
  }
  const astigSize = () => (window.wtAstig ? wtAstig.size() : 0);

  // Built with the mode's colours already, so there is no black frame first; the face itself
  // waits for applyLook, because xterm measures a cell once per font change and a face that
  // has not loaded yet would be measured as the fallback.
  const term = new Terminal({
    ...lookOptions(astigSize()),
    fontFamily: DEFAULT_FONT,
    scrollback: 10000,
    // The client owns scrollback while connected; the server's replay buffer only covers
    // what happened before this client attached. The two are different things and both are
    // needed — see api/ws-protocol.md.
    allowProposedApi: true,
    linkHandler: { activate: openLink, hover: showLinkTarget, leave: hideLinkTarget },
    // Option+drag selects even while a program is watching the mouse (#137). xterm splits
    // that gesture by platform — `shiftKey` off macOS, `altKey && macOptionClickForcesSelection`
    // on it — and the macOS half is off by default, so with Claude Code, vim or htop holding
    // `?1000h` there was *no* gesture that produced a selection on a Mac, and Cmd+C copied
    // nothing because xterm's copy handler bails on !hasSelection(). Shift+drag already works
    // everywhere else. iTerm2 binds Option for exactly this, so the cost — a program that
    // wants Option+click stops seeing it under mouse tracking — is the one macOS users
    // already expect.
    macOptionClickForcesSelection: true,
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.loadAddon(new WebLinksAddon.WebLinksAddon(openLink, {
    hover: showLinkTarget, leave: hideLinkTarget,
  }));
  term.open(document.getElementById("term"));

  // The GPU renderer, loaded after open() because it needs the element. Without it xterm
  // uses its DOM renderer, which builds a node per cell and rebuilds the viewport on every
  // scroll tick — with scrollback: 10000 that is the stutter (#61). There is no canvas rung
  // between the two: @xterm/addon-canvas was never updated past xterm 5.
  //
  // Both failure modes end at the DOM renderer, which is why neither is fatal. loadAddon
  // throws when there is no WebGL at all (old browser, blocklisted driver), and a context
  // *lost later* — a backgrounded tab on a phone, a GPU driver reset — leaves an addon that
  // is loaded and drawing nothing, so dispose and let xterm revert. Slow beats black.
  try {
    const webgl = new WebglAddon.WebglAddon();
    webgl.onContextLoss(() => webgl.dispose());
    term.loadAddon(webgl);
  } catch { /* no WebGL; the DOM renderer still works */ }

  fit.fit();

  // Apply the look, after the face it names has loaded. fit() then recomputes the grid for
  // the new cell size and term.onResize tells the pty, like any window resize.
  let lookSeq = 0;
  async function applyLook() {
    const seq = ++lookSeq;
    const size = astigSize();
    if (size && document.fonts) {
      try {
        await Promise.all([500, 700].map((w) =>
          document.fonts.load(w + " " + size + "px " + wtAstig.FAMILY)));
      } catch { /* fall through: the fallback face is still a legible look */ }
    }
    if (seq !== lookSeq) return; // switched again while the face loaded
    Object.assign(term.options, lookOptions(size));
    fit.fit();
  }
  if (astigSize()) applyLook();
  document.addEventListener("wt-astig", applyLook);

  // Whether this page is a deep link, which decides what the button below can honestly
  // promise. `dtach -A` attaches *or creates*, so on a named session that has exited,
  // "reconnect" starts a new empty shell under the same name; an argless connection was never
  // a session to begin with. See api/ws-protocol.md section 13.
  const isNamed = new URLSearchParams(location.search).has("arg");

  // ── Tab status: the favicon as a signal channel (#96) ──────────────────────────────
  //
  // A row of terminal tabs all look identical, so which agent is working and which is blocked
  // waiting on you is not visible from the tab strip at all. This turns a status the session
  // reports into a favicon and a title glyph.
  //
  // The signal is in band: `ESC ] 1337 ; WTState=<state> BEL`, written by whatever runs in the
  // session to its own tty, riding the OUTPUT frames wtd already carries. The states, why this
  // is not an HTTP endpoint, and what a client must not over-read from a namespace it shares
  // with iTerm2 are all in api/ws-protocol.md section 6a.
  //
  // What is true here and not in the spec:
  //
  //   - The emitter on this box is ~/.claude/tmux-attention.sh, driven by Claude Code's hooks.
  //     The glyphs and colours match its tmux status bar on purpose, so one state reads the same
  //     way in both places.
  //   - Nothing expires. A state stands until something reports a different one, so an agent
  //     killed mid-turn leaves its last light on. Deciding a session has gone quiet needs a
  //     timeout that would misfire on every long build, so the honest behaviour is to keep
  //     showing what was last reported.
  const OSC_STATUS = 1337;
  const STATUS_COLORS = { running: "#22d3ee", waiting: "#fbbf24", attention: "#ef4444" };

  // One icon per state, all four drawn at load.
  //
  // Deliberately not lazy, and not a cache. There are four, drawing one costs a fraction of a
  // millisecond, and the lazy version was worse than pointless: setStatus assigns the href but
  // early-returns when the state has not changed, so the *idle* icon — the state every tab
  // starts in — was never drawn at all and the tab fell back to the browser's blank document
  // glyph. Nothing routes /favicon.ico here, so there was nothing to fall back to.
  //
  // Drawn as paths rather than as text in a system font, so ▲ is the same shape everywhere.
  // Canvas → PNG and not SVG, because SVG favicon support is still uneven in Safari and a
  // feature whose whole value is that it renders cannot gamble on that.
  //
  // A favicon is composited at about 16 CSS px, which is why each one is a single shape filled
  // edge to edge with no detail, and why shape carries as much of the meaning as colour does:
  // at that size a red dot and an amber dot are the same blurry dot, and roughly a twelfth of
  // readers cannot separate those two hues at any size.
  // --- idle mark: the terminal's own icon, drawn identically on the picker and on a quiet
  // terminal tab so the two pages read as one app. This block is byte-identical in
  // cmd/wtd/web/index.html and cmd/wtd/web/terminal.html, and
  // TestIdleMarkMatchesAcrossPages fails if they drift — these pages have no JS harness in
  // this repo, so nothing else would notice.
  //
  // Mid-grey ground with a near-white prompt on it, because a browser tab strip is light in
  // one theme and near-black in the other and this has to survive both. Drawn as paths
  // rather than as text in a system font, so the shape is the same everywhere.
  function drawIdleMark(g) {
    g.fillStyle = "#6b7280";
    g.fillRect(0, 0, 32, 32);
    g.strokeStyle = "#f3f4f6";
    g.lineWidth = 3.5;
    g.lineCap = "round";
    g.lineJoin = "round";
    g.beginPath(); g.moveTo(9, 9); g.lineTo(16, 16); g.lineTo(9, 23); g.stroke();
    g.beginPath(); g.moveTo(19, 24); g.lineTo(25, 24); g.stroke();
  }
  // --- end idle mark ---

  const STATUS_ICONS = Object.freeze((() => {
    const draw = (state) => {
      const c = document.createElement("canvas");
      c.width = c.height = 32;
      const g = c.getContext("2d");
      if (state) {
        g.fillStyle = STATUS_COLORS[state];
        g.beginPath();
        if (state === "running") {
          g.arc(16, 16, 13, 0, Math.PI * 2);
        } else if (state === "waiting") {
          g.moveTo(16, 2); g.lineTo(30, 16); g.lineTo(16, 30); g.lineTo(2, 16);
        } else {
          g.moveTo(16, 3); g.lineTo(30, 28); g.lineTo(2, 28);
        }
        g.closePath();
        g.fill();
      } else {
        // Idle is not "no icon" — it is the terminal's own mark, so a quiet tab still says
        // what it is, and the picker wears the same one.
        drawIdleMark(g);
      }
      return c.toDataURL("image/png");
    };
    return { "": draw(""), running: draw("running"), waiting: draw("waiting"), attention: draw("attention") };
  })());

  const favicon = document.createElement("link");
  favicon.rel = "icon";
  favicon.type = "image/png";
  document.head.append(favicon);

  // The favicon owns the status and the title owns the identity. An earlier draft prefixed the
  // status glyph to the title as well, on the theory that it was free; in a real tab it competed
  // with the agent's own marker and with the icon for the same few characters of width, and the
  // thing you actually navigate by — which session, doing what — is what got truncated away.
  let status = "";            // "" | running | waiting | attention
  let statusFromBell = false; // this page inferred it from a bell; see term.onBell below
  let sawStatusOSC = false;   // this session speaks WTState, so its bells are someone else's
  let socketLive = false;     // see setStatus
  let baseTitle = sessionName ? sessionName + " — terminal" : "terminal";

  function setStatus(next) {
    // A status can only be *raised* while a socket is up, and that is not the redundant check it
    // looks like. term.write() is asynchronous — xterm parses in timed chunks — so a burst
    // ending in WTState=attention can still be in the parse queue when the socket closes. Then
    // onclose clears the icon, the queue drains, the handler paints it again, and the tab claims
    // "needs you now" on a dead connection with nothing left that could take it back down. A
    // restart of the service is exactly that sequence. Clearing is always allowed.
    if (next && !socketLive) return;
    if (next === status) return;
    status = next;
    favicon.href = STATUS_ICONS[next];
  }

  function setBaseTitle(title) {
    // Unchanged titles are dropped, and that is not micro-optimisation. An agent animates its
    // title: Claude Code alternates a spinner and was measured setting one 308 times in 12
    // seconds. Once the spinner is stripped below, every one of those collapses to the same
    // string, and this turns ~25 tab repaints a second into none.
    if (title === baseTitle) return;
    baseTitle = title;
    document.title = title;
  }

  term.parser.registerOscHandler(OSC_STATUS, (data) => {
    const eq = data.indexOf("=");
    if (eq < 0 || data.slice(0, eq) !== "WTState") return false; // iTerm2's key, not ours
    const value = data.slice(eq + 1).trim();
    // Speaking the protocol at all is what silences the bell fallback, even in a version of it
    // this page does not know yet.
    sawStatusOSC = true;
    if (value === "clear") {
      statusFromBell = false;
      setStatus("");
    } else if (Object.prototype.hasOwnProperty.call(STATUS_COLORS, value)) {
      statusFromBell = false;
      setStatus(value);
    }
    // Any other value is consumed and ignored — not treated as idle, so an emitter that learns
    // a new state cannot blank the icon on an older page, and not allowed to clear
    // statusFromBell either, which would strand a bell-derived attention: still showing, no
    // longer self-clearing when you look at the tab.
    return true;
  });

  // The bell, as a fallback for agents that have no hooks to run. Two gates, because an ungated
  // bell would be worse than nothing:
  //
  //   - **Only while the tab is hidden.** readline rings the bell on every ambiguous tab
  //     completion, so an ungated bell paints the icon red while you sit there typing. A status
  //     you are already looking at has no job to do, which makes the gate free.
  //   - **Only until something speaks the real protocol.** Once a session has sent one WTState,
  //     its bells are noise from some other program in the same shell, and the explicit signal
  //     is the one to trust.
  //
  // Bell-derived attention is the one status this page clears by itself, on the next look at the
  // tab. Everything else belongs to the agent — Claude is still blocked on that permission
  // prompt whether or not you glanced at the tab, and its next hook is what clears it — but a
  // bell has no lifecycle behind it and nothing would ever take it back down.
  term.onBell(() => {
    if (sawStatusOSC || statusFromBell || !document.hidden) return;
    statusFromBell = true;
    setStatus("attention");
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && statusFromBell) {
      statusFromBell = false;
      setStatus("");
    }
  });

  // Text the session chose, so it is scrubbed on the way in. Not for injection — document.title
  // is a text sink and markup in it is inert — but for what a tab strip is: a short line the
  // reader trusts to say which session they are looking at. Bidi overrides can visually reverse
  // a run of it and C0/C1 controls can blank or truncate it in some window switchers. Same
  // instinct as the OSC 8 link readout: output picks the label, so the label gets checked. The
  // length cap is not a defence, just an acknowledgement that no tab shows 200 characters.
  // Leading status glyphs, which agents animate. Claude Code alternates the half-circles and
  // rests on an asterisk; other agents use braille spinners. All of them say what the favicon
  // already says, and all of them change many times a second.
  //
  // Matched by code-point range rather than by a list of another program's symbols, so an
  // unfamiliar spinner is handled too: general punctuation through dingbats (which covers
  // geometric shapes and braille) and the emoji planes. Everything ASCII is deliberately outside
  // it, so a title that legitimately opens with ~ or / or . keeps its first character.
  function isStatusGlyph(c) {
    return (c >= 0x2000 && c <= 0x2bff) || (c >= 0x1f300 && c <= 0x1faff);
  }

  function cleanTitle(title) {
    let out = "";
    for (const ch of title) {
      const c = ch.codePointAt(0);
      if (c < 0x20 || (c >= 0x7f && c <= 0x9f)) continue;   // C0 and C1 controls
      if (c === 0x200e || c === 0x200f) continue;           // LRM, RLM
      if (c >= 0x202a && c <= 0x202e) continue;             // bidi embedding and override
      if (c >= 0x2066 && c <= 0x2069) continue;             // bidi isolates
      out += ch;
    }
    // At most a few, so a title made entirely of symbols is left alone rather than emptied.
    let i = 0, dropped = 0;
    while (i < out.length && dropped < 4) {
      const c = out.codePointAt(i);
      if (!isStatusGlyph(c)) break;
      i += String.fromCodePoint(c).length;
      dropped++;
      while (i < out.length && out[i] === " ") i++;
    }
    return out.slice(i).trim().slice(0, 200);
  }

  // The shell's own window title (OSC 0/2), which this page ignored until now: the server sends
  // one title at connect and nothing listened for what the session set afterwards, so a title an
  // agent wrote was parsed by xterm and dropped on the floor. The session name stays in front of
  // it because that is what you navigate by, and a tab truncates from the right.
  term.onTitleChange((raw) => {
    const title = cleanTitle(raw);
    if (!title) return;
    setBaseTitle(sessionName ? sessionName + " — " + title : title);
  });

  // Unconditionally, not through setStatus: idle is the state the page starts in, so a
  // setStatus("") here is a no-op that leaves the tab with no icon at all. That was the bug.
  favicon.href = STATUS_ICONS[status];
  document.title = baseTitle;

  const banner = document.getElementById("banner");
  // The second argument is the button's *label*, not a boolean. What the button does depends on
  // why the socket closed, so a fixed "reconnect" was a claim the page could not keep (#56).
  function showBanner(text, retryLabel) {
    banner.textContent = text;
    if (retryLabel) {
      const b = document.createElement("button");
      b.textContent = retryLabel;
      b.onclick = () => { banner.hidden = true; connect(); };
      banner.append(b);
    }
    banner.hidden = false;
  }

  const encoder = new TextEncoder();
  const decoder = new TextDecoder();
  let socket = null;

  // The two ways a payload becomes frame bytes. They are not interchangeable, and picking the
  // wrong one does not corrupt a report so much as send a *different* one (#64).
  //
  // Text is UTF-8: keystrokes, JSON, and mouse reports under SGR or urxvt, all of which are
  // printable ASCII.
  //
  // Binary is latin-1 — one byte per character code. xterm's onBinary delivers a "binary string"
  // rather than a Uint8Array, which is checkable in the vendored bundle: triggerBinaryEvent logs
  // `e.split("").map(c => c.charCodeAt(0))`. Its one producer is the X10 mouse encoder, which
  // builds `ESC [ M` followed by three raw bytes at 32+n, so any column past 95 puts a code above
  // 127 in that string. Through TextEncoder those expand to two bytes each and the app reads a
  // different position entirely.
  function frameBytes(opcode, payload, binary) {
    let body;
    if (binary) {
      body = new Uint8Array(payload.length);
      // & 0xff states the latin-1 intent; the assignment would truncate anyway, and the encoder
      // returns "" rather than emit a code above 255 (which is why X10 breaks past column 223).
      for (let i = 0; i < payload.length; i++) body[i] = payload.charCodeAt(i) & 0xff;
    } else {
      body = encoder.encode(payload);
    }
    const frame = new Uint8Array(body.length + 1);
    frame[0] = opcode.charCodeAt(0);
    frame.set(body, 1);
    return frame;
  }

  function send(opcode, payload, binary) {
    if (!socket || socket.readyState !== WebSocket.OPEN) return;
    socket.send(frameBytes(opcode, payload, binary));
  }

  function sendResize() {
    fit.fit();
    send(C_RESIZE, JSON.stringify({ columns: term.cols, rows: term.rows }));
  }

  async function connect() {
    // GET /token first, mirroring ttyd's client and the iOS app. With no auth configured
    // it returns an empty token; a failure here is not fatal.
    let token = "";
    try {
      const res = await fetch("token");
      if (res.ok) token = (await res.json()).token || "";
    } catch { /* no auth configured; empty token is correct */ }

    // Resolved against this page, not assembled from location.host, which is the same rule the
    // assets above follow (api/ws-protocol.md section 1: pages MUST use relative URLs so they
    // still work behind a stripping proxy). Building from location.host discarded the path
    // entirely, so behind a prefix the socket was the one thing that connected while every asset
    // and API call 404'd — or, with the prefix stripped on the way in, the reverse.
    //
    // This page is only ever served at "/" (handleRoot 404s anything else), so the base
    // directory is the prefix root. location.search is carried over verbatim: the server selects
    // the session from it, and a query string does not affect relative resolution.
    const url = new URL("ws" + location.search, location.href);
    url.protocol = location.protocol === "https:" ? "wss:" : "ws:";

    socket = new WebSocket(url.href, ["tty"]);
    socket.binaryType = "arraybuffer";

    socket.onopen = () => {
      banner.hidden = true;
      socketLive = true;
      // Handshake as a TEXT frame. ttyd's own client sends this as binary and the iOS
      // client sends text; the server accepts either (api/ws-protocol.md §5).
      socket.send(JSON.stringify({ AuthToken: token, columns: term.cols, rows: term.rows }));
      sendResize();
      // No redraw kick here any more. wtd holds each session's attachment and replays its
      // recent output on attach, so the screen arrives on connect. The kick that used to
      // live here (rows-1, then the real size, to force a SIGWINCH) was one half of a
      // two-sided workaround; the server now does that once per session instead of once per
      // client. See hub.kick and api/ws-protocol.md.
      term.focus();
    };

    socket.onmessage = (ev) => {
      const data = new Uint8Array(ev.data);
      if (!data.length) return;
      const payload = data.subarray(1);
      switch (data[0]) {
        case S_OUTPUT: term.write(payload); break;
        case S_TITLE: setBaseTitle(decoder.decode(payload)); break;
        case S_PREFS: break; // ttyd sends "{ }" with no -t options; nothing to apply
        default: break;      // unknown opcodes are ignored, so a newer server degrades
      }
    };

    socket.onclose = (ev) => {
      // Branch on the close code. api/ws-protocol.md section 13 defines 1000 as "the terminal's
      // process exited (shell exit, `exit` at an argless prompt, PTY EOF) … treat as final", and
      // that is the only code meaning the session is gone. Saying "the session is still running"
      // unconditionally was wrong in the state a user is most likely to be in — just after typing
      // `exit` — and it made the button lie: `dtach -A` attaches *or creates*, so reconnecting
      // after 1000 silently starts a new empty shell that looks like a rejoin. The iOS client had
      // the same bug from the other direction and "silently recreated the session the user had
      // just exited"; that is written up in section 13's traps.
      //
      // Every other code leaves the dtach session running, which is what the old text claimed:
      // 1001 (server restart), 1006 (transport drop), 1013 (backlog drop), and the handshake
      // codes. 1011 is the one imperfect fit — a failed spawn has no session either — but wtd
      // writes that error into the terminal as an OUTPUT frame, so the screen already says more
      // than a banner could.
      // Drop the status marker. The favicon's whole promise is "this tab needs you *now*", and a
      // tab with no socket cannot keep it: whatever the agent does next, this page will not hear
      // about it. The banner is the honest signal for a dropped tab, and a reconnect re-reads the
      // status from the replayed tail when it is still in the ring.
      //
      // socketLive first, so a status still sitting in xterm's parse queue cannot repaint the
      // icon after this line — see setStatus. statusFromBell too, or a bell-derived attention
      // survives the close as a flag with no icon behind it, and the next visibilitychange
      // "clears" a status that is already clear. Harmless today because reconnecting takes a
      // click; not harmless the moment anything reconnects on its own, which the iOS client
      // already does.
      socketLive = false;
      statusFromBell = false;
      setStatus("");
      const reason = ev.reason ? ": " + ev.reason : "";
      if (ev.code === 1000) {
        showBanner(
          isNamed
            ? "session ended" + reason + " — reconnecting starts a new, empty one"
            : "shell exited" + reason,
          isNamed ? "new session" : "new shell"
        );
      } else {
        showBanner("disconnected" + reason + " — the session is still running", "reconnect");
      }
    };
    socket.onerror = () => showBanner("connection error", "reconnect");
  }

  // Scrolling a full-screen app is a network round trip, so batch it.
  //
  // On the alternate screen there is no local scrollback to move: xterm turns each wheel
  // event into a mouse report (or an arrow key) for the remote app, and the app redraws its
  // whole viewport in reply. xterm 6 emits exactly one of those per wheel event no matter
  // how far the event says you scrolled — consumeWheelEvent returns a line count and both
  // call sites use it only as a non-zero test — and it damps trackpad deltas by 0.3 on top.
  // So a swipe crawls, while a flick still buys one full-screen repaint per line (#63).
  //
  // Doing the conversion here fixes both halves. Two details are load-bearing:
  //
  //   - Synthetic wheel events, not hand-built escape sequences. xterm re-encodes each one
  //     for whichever protocol and encoding the app negotiated (SGR, X10, urxvt), so this
  //     cannot drift out of sync with the app's mouse mode the way a fixed report would.
  //   - deltaMode DOM_DELTA_LINE, because consumeWheelEvent returns for it directly instead
  //     of feeding its own fractional pixel accumulator. One dispatch, one report, no
  //     leftovers to interfere with the count kept here.
  //
  // Collecting the reports into a single INPUT frame is the part that fixes the stutter:
  // the app reads the whole batch in one pty read and repaints once, not once per line.
  //
  // What this bought, and what it did not (#70). It bought distance per gesture and one repaint
  // per batch. It did **not** buy smoothness, and nothing here can: every visible scroll step on
  // the alternate screen is still one round trip plus a full-viewport repaint. That is a floor,
  // not a defect — a local terminal has the same shape and only feels better because its round
  // trip is microseconds. Plain shell scrollback *is* smooth, because that content is already in
  // the browser and nothing is sent. Before optimising this again, know that these were measured
  // and do not work: a bigger client-side buffer (there is nothing local to buffer), more
  // aggressive coalescing (already once per animation frame, the display's own ceiling),
  // scrollSensitivity (feeds this same accumulator; cannot change reports-per-event), and local
  // scrollback for the alternate screen (guessing which parts of an arbitrary repaint are
  // scrollback — a multiplexer's job, and it gets it wrong too). The only thing that would move
  // the needle is an app that scrolls content it owns without a round trip, which is upstream of
  // this repo entirely.
  const WHEEL_LINES_PER_NOTCH = 3; // what a wheel notch moves in every other terminal
  let wheelLines = 0;   // whole + fractional lines owed to the app
  let wheelFlush = 0;   // pending rAF handle; 0 when idle
  let wheelAt = null;   // where the pointer was, for the mouse report's coordinates
  let wheelBatch = null; // while batching: {binary, data}, so the report handlers append
  let replayingWheel = false; // our own dispatches must reach xterm untouched

  // Measured rather than derived from fontSize, which ignores lineHeight and zoom.
  function cellHeight() {
    const screen = term.element && term.element.querySelector(".xterm-screen");
    const h = screen && term.rows ? screen.clientHeight / term.rows : 0;
    return h > 0 ? h : 17;
  }

  function flushWheel() {
    wheelFlush = 0;
    let lines = Math.trunc(wheelLines);
    wheelLines -= lines; // keep the fraction; it belongs to the next frame
    if (!lines || !wheelAt) return;

    // A hard flick should not become thousands of repaint requests. Four screens in one
    // frame is already more than anyone can read, so drop the excess rather than queue it
    // — queueing would keep the terminal scrolling after the gesture stopped.
    const cap = Math.max(term.rows * 4, 1);
    if (Math.abs(lines) > cap) lines = Math.sign(lines) * cap;

    wheelBatch = { binary: false, data: "" };
    replayingWheel = true;
    try {
      for (let i = 0; i < Math.abs(lines); i++) {
        term.element.dispatchEvent(new WheelEvent("wheel", {
          deltaY: Math.sign(lines),
          deltaMode: WheelEvent.DOM_DELTA_LINE,
          clientX: wheelAt.x,
          clientY: wheelAt.y,
          bubbles: true,
          cancelable: true,
        }));
      }
    } finally {
      replayingWheel = false;
      const batch = wheelBatch;
      wheelBatch = null;
      if (batch.data) send(C_INPUT, batch.data, batch.binary);
    }
  }

  term.attachCustomWheelEventHandler((ev) => {
    if (replayingWheel) return true;
    // The normal buffer scrolls natively, via overflow-y on .xterm-viewport. That path is
    // local, already smooth, and already moves the right distance — leave it alone.
    if (term.buffer.active.type !== "alternate" && term.modes.mouseTrackingMode === "none") {
      return true;
    }

    // xterm only calls preventDefault on some of the paths that reach here, and on the
    // alternate screen there is no viewport to scroll, so say so explicitly.
    ev.preventDefault();
    wheelAt = { x: ev.clientX, y: ev.clientY };
    if (ev.deltaMode === WheelEvent.DOM_DELTA_LINE) {
      wheelLines += ev.deltaY * WHEEL_LINES_PER_NOTCH;
    } else if (ev.deltaMode === WheelEvent.DOM_DELTA_PAGE) {
      wheelLines += ev.deltaY * term.rows;
    } else {
      wheelLines += ev.deltaY / cellHeight(); // 1:1 with the finger, no 0.3 damping
    }
    if (!wheelFlush) wheelFlush = requestAnimationFrame(flushWheel);
    return false;
  });

  // Everything the terminal wants to send, from both of xterm's two output events.
  //
  // A mouse report goes to exactly one of them, chosen by the encoding the app negotiated:
  // xterm's CoreMouseService does `"DEFAULT" === this._activeEncoding ?
  // triggerBinaryEvent(t) : triggerDataEvent(t, true)`, and DEFAULT is X10. So a gesture's
  // reports are all of one kind, which is what lets a batch carry a single `binary` flag — and
  // the batch window is fully synchronous (dispatchEvent through to the finally), so no
  // keystroke can land in the middle of one and be mis-encoded.
  function sendReport(d, binary) {
    // Mid-batch: this is a scroll's reports, collected so they leave as one frame.
    if (wheelBatch !== null) {
      wheelBatch.binary = binary;
      wheelBatch.data += d;
      return;
    }
    send(C_INPUT, d, binary);
  }

  term.onData((d) => sendReport(d, false));
  // Unregistered until #64, and X10 sends every click, drag and wheel report here rather than to
  // onData — so under it the app enabled mouse mode, the page dutifully stopped doing anything
  // else with the event, and nothing was sent. Two reasons it went unnoticed: modern TUIs ask for
  // SGR (`?1006h`), Claude Code among them, and X10 coordinates break past column 223 anyway, so
  // it is the fallback nobody exercises.
  term.onBinary((d) => sendReport(d, true));
  term.onResize(() => send(C_RESIZE, JSON.stringify({ columns: term.cols, rows: term.rows })));

  // Debounced so dragging a window edge does not flood the pty.
  let resizeTimer = null;
  addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(sendResize, 100);
  });

  // Help overlay: a native <dialog>, because showModal() provides the two properties
  // that matter here for free — the rest of the page is inert while it is open (no
  // typing into the shell behind the panel), and it has no keyboard behaviour at all
  // while closed, including Escape. The "?" button is pointer-only (tabindex=-1) for
  // the same reason: every keystroke on this page belongs to the shell.
  //
  // The content is /help (one document, also linked from the picker), fetched on first
  // open and injected, so the copy cannot drift apart; the styling both contexts share
  // is /help.css.
  const helpEl = document.getElementById("help");
  const helpBody = document.getElementById("helpbody");
  let helpLoaded = false;

  async function openHelp() {
    helpEl.showModal();
    if (helpLoaded) return;
    helpLoaded = true;
    try {
      const res = await fetch("help");
      if (!res.ok) throw new Error("HTTP " + res.status);
      const doc = new DOMParser().parseFromString(await res.text(), "text/html");
      const main = doc.querySelector("main");
      if (!main || !main.children.length) throw new Error("empty");
      // A same-tab navigation would silently drop this page's socket mid-session, so
      // anything the help links to opens beside the terminal instead.
      for (const a of main.querySelectorAll("a")) { a.target = "_blank"; a.rel = "noopener"; }
      helpBody.replaceChildren(...main.children);
    } catch {
      helpLoaded = false; // retry on next open
      helpBody.textContent = "could not load help — open /help directly";
    }
  }

  document.getElementById("helpbtn").onclick = openHelp;
  document.getElementById("helpclose").onclick = () => helpEl.close();
  // A click landing on the dialog element itself is on the backdrop or the border —
  // #helppanel covers everything inside. Escape needs no code; <dialog> handles it.
  helpEl.onclick = (ev) => { if (ev.target === helpEl) helpEl.close(); };
  helpEl.addEventListener("close", () => term.focus());

  // Host status panel — GET /api/v1/host, rendered as a gauge you glance at without leaving the
  // session. Why the document reports what it does is in host.go and in the served schema; what
  // matters here is that the thresholds live in this page rather than on the server, because
  // they are a presentation choice and because changing them should not need a binary.
  //
  // The rule the rendering must not lose: a field the server could not read shows as "?" or
  // "not measured", never as a zero bar. `pressure: null` is a kernel with no PSI and 0.00 is
  // the reading on every healthy box.
  const PANEL_OK = "#4ade80", PANEL_TIGHT = "#fbbf24", PANEL_BAD = "#ef4444", PANEL_NONE = "#9a9a94";
  const HOST_POLL_MS = 5000;
  // Shorter than the poll interval, so a hung request is abandoned before the next one is due
  // and requests can never pile up on a server that is already struggling.
  const HOST_TIMEOUT_MS = 4000;
  // Past this, the reading on screen is no longer a statement about now. Two missed polls plus
  // one timeout: long enough not to flicker on a single slow response.
  const HOST_STALE_MS = HOST_POLL_MS * 2 + HOST_TIMEOUT_MS;

  const panel = document.getElementById("panel");
  const panelBody = document.getElementById("panelbody");
  const panelVerdict = document.getElementById("panelverdict");
  const panelAge = document.getElementById("panelage");
  let hostTimer = null;
  let hostInFlight = false;
  let hostLastOk = 0; // Date.now() of the last reading that arrived, 0 for none yet

  // Binary units, and labelled without the "i", to match what `free` and `top` print on this
  // box. A figure an operator cannot line up against the tool they already ran is a figure
  // they have to convert before they can act on it.
  function fmtBytes(n) {
    if (typeof n !== "number") return "?";
    const g = n / (1024 * 1024 * 1024);
    if (g >= 1) return g.toFixed(g >= 10 ? 0 : 1) + "G";
    return Math.round(n / (1024 * 1024)) + "M";
  }

  function fmtDuration(sec) {
    if (typeof sec !== "number") return "?";
    const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600);
    return d > 0 ? d + "d " + h + "h" : h + "h " + Math.floor((sec % 3600) / 60) + "m";
  }

  // Each signal votes, the worst vote wins, and a signal that could not be read does not vote.
  // Returning "unknown" when nothing voted is the honest answer for a box whose /proc this
  // server cannot read, and it is why the verdict is not just a memory percentage.
  const VERDICT_RANK = { ok: 0, tight: 1, critical: 2 };

  function hostVerdict(h) {
    let worst = null; // null = nothing could be measured at all
    const vote = (level) => {
      if (worst === null || VERDICT_RANK[level] > VERDICT_RANK[worst]) worst = level;
    };
    if (h.pressure) vote(h.pressure.memorySome10 > 10 ? "critical" : h.pressure.memorySome10 > 1 ? "tight" : "ok");
    if (h.memory && h.memory.totalBytes > 0) {
      const free = h.memory.availableBytes / h.memory.totalBytes;
      vote(free < 0.10 ? "critical" : free < 0.25 ? "tight" : "ok");
    }
    if (h.load && h.cpuCount > 0) {
      const r = h.load.one / h.cpuCount;
      vote(r > 4 ? "critical" : r > 1.5 ? "tight" : "ok");
    }
    // Disk votes too, on the same thresholds its bar is painted with. It is not a memory
    // signal, but a full root is a real way this box stops working -- images, build caches,
    // logs -- and a red bar beside a green verdict would just teach you to distrust the word.
    if (h.disk && h.disk.totalBytes > 0) {
      const used = 1 - h.disk.availableBytes / h.disk.totalBytes;
      vote(used > 0.92 ? "critical" : used > 0.80 ? "tight" : "ok");
    }
    return worst === null ? "unknown" : worst;
  }

  function verdictColor(v) {
    return v === "critical" ? PANEL_BAD : v === "tight" ? PANEL_TIGHT : v === "ok" ? PANEL_OK : PANEL_NONE;
  }

  // Every node is built with createElement and textContent. Nothing on this page uses
  // innerHTML, and session names in particular arrive from the filesystem and are shown here.
  function row(label, value, extra) {
    const r = document.createElement("div");
    r.className = "prow";
    const l = document.createElement("span");
    l.className = "plabel";
    l.textContent = label;
    const v = document.createElement("span");
    v.className = "pval";
    v.textContent = value;
    r.append(l, v);
    if (extra !== undefined) {
      const e = document.createElement("span");
      e.className = "pnum";
      e.textContent = extra;
      r.append(e);
    }
    return r;
  }

  // A session row: the name gets the full width, so a long one truncates instead of pushing
  // its own size off the edge.
  function srow(name, size) {
    const r = document.createElement("div");
    r.className = "prow";
    const n = document.createElement("span");
    n.className = "pval";
    n.textContent = name;
    const sz = document.createElement("span");
    sz.className = "pnum";
    sz.textContent = size;
    r.append(n, sz);
    return r;
  }

  function bar(fraction, color) {
    const outer = document.createElement("div");
    outer.className = "pbar";
    const fill = document.createElement("i");
    // Clamped, because a fraction over 1 is meaningful for a load average and a bar wider
    // than its track is not.
    fill.style.width = Math.max(0, Math.min(1, fraction)) * 100 + "%";
    fill.style.background = color;
    outer.append(fill);
    return outer;
  }

  function section(text) {
    const d = document.createElement("div");
    d.className = "psec";
    d.textContent = text;
    return d;
  }

  function note(text) {
    const d = document.createElement("div");
    d.className = "pnote";
    d.textContent = text;
    return d;
  }

  function renderHost(h) {
    const v = hostVerdict(h);
    panelVerdict.textContent = v;
    panelVerdict.style.color = verdictColor(v);

    const out = document.createDocumentFragment();

    if (h.load && h.cpuCount > 0) {
      const r = h.load.one / h.cpuCount;
      out.append(row("load", h.load.one.toFixed(2) + "  " + h.load.five.toFixed(2) + "  " + h.load.fifteen.toFixed(2),
        h.cpuCount + " cpu"));
      // Full bar at one runnable task per CPU, so a saturated box fills it and an
      // oversubscribed one pins it.
      out.append(bar(r, r > 4 ? PANEL_BAD : r > 1.5 ? PANEL_TIGHT : PANEL_OK));
    } else if (h.load) {
      // No CPU count means no ratio and no bar, but the averages themselves are still worth
      // showing -- discarding a reading because its divisor is missing helps nobody.
      out.append(row("load", h.load.one.toFixed(2) + "  " + h.load.five.toFixed(2) + "  " + h.load.fifteen.toFixed(2)));
    } else {
      out.append(row("load", "?"));
    }

    if (h.memory) {
      const used = h.memory.totalBytes > 0 ? h.memory.usedBytes / h.memory.totalBytes : 0;
      out.append(row("mem", fmtBytes(h.memory.usedBytes) + " / " + fmtBytes(h.memory.totalBytes),
        fmtBytes(h.memory.availableBytes) + " free"));
      out.append(bar(used, used > 0.90 ? PANEL_BAD : used > 0.75 ? PANEL_TIGHT : PANEL_OK));
      // Called out rather than shown as 0/0: no swap is why exhaustion here has no slow
      // phase to notice, which is the difference between a sluggish box and an unreachable one.
      out.append(row("swap", h.memory.swapTotalBytes > 0
        ? fmtBytes(h.memory.swapTotalBytes - h.memory.swapFreeBytes) + " / " + fmtBytes(h.memory.swapTotalBytes)
        : "none"));
    } else {
      out.append(row("mem", "?"));
    }

    if (h.pressure) {
      const p = h.pressure;
      out.append(row("stall", "mem " + p.memorySome10.toFixed(1) + "%"
        + (p.cpuSome10 === null ? "" : "   cpu " + p.cpuSome10.toFixed(1) + "%")
        + (p.ioSome10 === null ? "" : "   io " + p.ioSome10.toFixed(1) + "%")));
      out.append(bar(p.memorySome10 / 100, p.memorySome10 > 10 ? PANEL_BAD : p.memorySome10 > 1 ? PANEL_TIGHT : PANEL_OK));
    } else {
      out.append(row("stall", "not measured"));
    }

    if (h.disk) {
      const used = h.disk.totalBytes > 0 ? 1 - h.disk.availableBytes / h.disk.totalBytes : 0;
      out.append(row("disk", fmtBytes(h.disk.totalBytes - h.disk.availableBytes) + " / " + fmtBytes(h.disk.totalBytes),
        Math.round(used * 100) + "%"));
      out.append(bar(used, used > 0.92 ? PANEL_BAD : used > 0.80 ? PANEL_TIGHT : PANEL_OK));
    } else {
      out.append(row("disk", "?"));
    }

    out.append(row("up", fmtDuration(h.uptimeSeconds)));

    if (h.sessions === null) {
      out.append(section("sessions"));
      out.append(note("could not read the session directory"));
    } else {
      out.append(section("sessions  " + h.sessions.length + "  ·  " + fmtBytes(h.totalRssBytes)));
      if (!h.sessions.length) {
        out.append(note("none"));
      }
      // Heaviest first: the list exists to answer "what do I close", and #77's diagnosis was
      // exactly this ordering, assembled by hand.
      const rows = h.sessions.slice().sort((a, b) => b.rssBytes - a.rssBytes);
      const worst = rows.length ? rows[0].rssBytes : 0;
      for (const sess of rows) {
        const r = srow(sess.name, fmtBytes(sess.rssBytes));
        // The session this tab is attached to, marked so a nine-row list is navigable
        // without reading every name. Bold rather than a colour, because the colours in this
        // panel all mean severity and this one is not a claim about cost.
        if (sess.name === sessionName) { r.style.color = "#fff"; r.style.fontWeight = "bold"; }
        r.title = sess.name + " — pid " + (sess.pid || "?") + ", " + sess.processCount + " process"
          + (sess.processCount === 1 ? "" : "es");
        out.append(r);
        out.append(bar(worst > 0 ? sess.rssBytes / worst : 0, PANEL_NONE));
      }
    }

    panelBody.replaceChildren(out);
    markHostAge();
  }

  // How old the reading on screen is, and whether it still counts as current.
  //
  // This is the difference between a panel that helps during a starvation and one that lies
  // through it. A request to a host that is thrashing does not fail — it hangs, for minutes,
  // and a browser will wait — so without this the last good reading stays on screen with its
  // green "ok" while the box goes under. Measured from when the reading arrived here rather
  // than from its `at` field, because that needs no agreement between two clocks.
  function markHostAge() {
    if (!hostLastOk) {
      panelAge.textContent = "";
      return;
    }
    const ms = Date.now() - hostLastOk;
    const stale = ms > HOST_STALE_MS;
    panelAge.textContent = (stale ? "stale " : "") + Math.round(ms / 1000) + "s";
    panelAge.style.color = stale ? PANEL_TIGHT : PANEL_NONE;
    // A stale verdict is not a claim about now, whichever word it is. Greying it says so
    // without hiding what was last true.
    if (stale) panelVerdict.style.color = PANEL_NONE;
  }

  async function pollHost() {
    // A hung request must not be joined by another. Each one costs the server a walk of every
    // session's process tree, and the moment that walk gets slow is the moment a panel must
    // stop adding to it.
    if (hostInFlight) return;
    hostInFlight = true;
    let reading = null;
    const abort = new AbortController();
    const cutoff = setTimeout(() => abort.abort(), HOST_TIMEOUT_MS);
    try {
      const res = await fetch("api/v1/host", { signal: abort.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      reading = await res.json();
    } catch {
      // Keep whatever reading is already on screen: it is old, markHostAge says how old, and
      // that is more use than blanking the one piece of evidence available. Only say so
      // outright when there has never been a reading to keep.
      if (!hostLastOk) {
        panelVerdict.textContent = "host";
        panelVerdict.style.color = PANEL_NONE;
        panelBody.replaceChildren(note("could not read host status"));
      }
    } finally {
      clearTimeout(cutoff);
      hostInFlight = false;
    }
    // Rendering is outside the catch on purpose: a TypeError in the DOM code below would
    // otherwise be reported as "could not read host status", which sends whoever debugs it
    // looking at the network.
    if (reading) {
      hostLastOk = Date.now();
      renderHost(reading);
    }
    markHostAge();
  }

  // Prompt history — GET /api/v1/sessions/{name}/prompts, the messages sent to the agent in this
  // session. Recorded by a hook inside the session (bin/wt-prompt-hook); this page only reads
  // them.
  //
  // The empty case has to be worded carefully. An empty list means "nothing recorded", and on a
  // box where nobody installed the hook that is the permanent answer for every session — so it
  // must not read as "you have not said anything", which would be a claim about the human rather
  // than about the server.
  const MAX_PROMPT_CHARS = 400;

  const panelPrompts = document.getElementById("panelprompts");
  let promptsInFlight = false;

  function renderPrompts(list) {
    const out = document.createDocumentFragment();
    out.append(section("said  " + list.length));
    if (!list.length) {
      out.append(note("nothing recorded — see /help if you expected prompts here"));
      panelPrompts.replaceChildren(out);
      return;
    }
    // Oldest first, as the server sends them: the newest is at the bottom, nearest the terminal
    // you were just typing into, and marked so the eye lands on it.
    list.forEach((p, i) => {
      const row = document.createElement("div");
      row.className = i === list.length - 1 ? "pprompt last" : "pprompt";

      const when = document.createElement("time");
      // Local time, because the reader is sitting at the machine. The server sends UTC.
      const at = new Date(p.at);
      when.textContent = isNaN(at) ? p.at : at.toLocaleTimeString();
      when.dateTime = p.at;

      const text = document.createElement("span");
      const long = p.text.length > MAX_PROMPT_CHARS;
      text.textContent = long ? p.text.slice(0, MAX_PROMPT_CHARS) + "…" : p.text;
      // The full text on hover, and an honest marker when even the server's copy was shortened —
      // presenting a cut-off sentence as the whole of it is the one thing this must not do.
      row.title = p.truncated ? p.text + "\n\n(the recorded prompt was itself shortened)" : p.text;
      if (p.truncated) text.textContent += " ⋯";

      row.append(when, text);
      out.append(row);
    });
    panelPrompts.replaceChildren(out);
  }

  async function pollPrompts() {
    // An argless connection has no session, so there is nothing to ask about and no row to show.
    if (!sessionName || promptsInFlight) return;
    promptsInFlight = true;
    const abort = new AbortController();
    const cutoff = setTimeout(() => abort.abort(), HOST_TIMEOUT_MS);
    let list = null;
    try {
      const res = await fetch("api/v1/sessions/" + encodeURIComponent(sessionName) + "/prompts",
        { signal: abort.signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const body = await res.json();
      if (Array.isArray(body.prompts)) list = body.prompts;
    } catch {
      // Same choice as the host half: keep what is on screen. A prompt list does not go stale in
      // any way that misleads — what was said was said.
    } finally {
      clearTimeout(cutoff);
      promptsInFlight = false;
    }
    if (list) renderPrompts(list);
  }

  // Polling is tied to the panel being both open and on screen. This document costs a walk of
  // each session's process tree, and a tab left open behind another one for a day would
  // otherwise spend the whole day asking — which is the mistake #115 records against a route
  // built to be polled.
  function panelPolling(on) {
    if (hostTimer) { clearInterval(hostTimer); hostTimer = null; }
    if (!on) {
      panelPrompts.replaceChildren();
      return;
    }
    pollHost();
    pollPrompts();
    hostTimer = setInterval(() => {
      // Age first, then ask. If the request hangs, the tick that skips it still moves the
      // clock on screen — which is the whole point of showing an age.
      markHostAge();
      if (document.hidden) return;
      // Two independent requests on one timer, deliberately not chained: a hanging host read
      // must not also stop the prompt list, and neither is worth its own interval.
      pollHost();
      pollPrompts();
    }, HOST_POLL_MS);
  }

  function setPanel(open) {
    // One flyout at a time: they occupy the same edge. Closed without setUpPanel's refocus,
    // which would raise the iOS keyboard over the panel being opened.
    if (open) upPanel.classList.remove("open");
    panel.classList.toggle("open", open);
    panelPolling(open);
    // The panel is pointer-only, like the "?" button: every keystroke on this page belongs to
    // the shell, so closing hands focus straight back rather than leaving it on a button that
    // would swallow the next character. There is deliberately no Escape binding — the help
    // overlay can afford one only because showModal() makes the page inert, and Escape here
    // belongs to whatever is running in the terminal.
    if (!open) term.focus();
  }

  const panelBtn = document.getElementById("panelbtn");
  const panelClose = document.getElementById("panelclose");
  panelBtn.onclick = () => setPanel(true);
  panelClose.onclick = () => setPanel(false);

  // The panel's switches. Each shows "on"/"off" in words: in submarine mode every colour is a
  // shade of red, so a colour could not carry the state.
  function setSwitch(el, on) {
    el.setAttribute("aria-checked", String(on));
    el.lastChild.textContent = on ? "on" : "off";
  }

  // Submarine mode lives in sub.js, which every page loads; this is only its switch. The
  // "wt-sub" event also fires when another tab flips it, so the switch never shows stale.
  const subSwitch = document.getElementById("subswitch");
  const syncSubSwitch = () => setSwitch(subSwitch, window.wtSub ? wtSub.on() : false);
  subSwitch.onclick = () => { if (window.wtSub) wtSub.toggle(); };
  document.addEventListener("wt-sub", syncSubSwitch);
  syncSubSwitch();

  // Astigmatism mode lives in astig.js; this is its switch, which cycles off and three sizes
  // and names the one in force. applyLook above does the work on the same event.
  const astigSwitch = document.getElementById("astigswitch");
  const syncAstigSwitch = () => {
    const size = astigSize();
    astigSwitch.setAttribute("aria-checked", String(size > 0));
    astigSwitch.lastChild.textContent = size ? size + "px" : "off";
  };
  astigSwitch.onclick = () => { if (window.wtAstig) wtAstig.cycle(); };
  document.addEventListener("wt-astig", syncAstigSwitch);
  syncAstigSwitch();

  // Full screen. The window "resize" listener above refits the grid and tells the pty, so
  // entering and leaving need nothing of their own. Synced from fullscreenchange rather than
  // from the click, because the browser can leave full screen on its own (Escape, F11, a tab
  // switch on some platforms).
  //
  // Escape is the browser's way out of full screen, and it belongs to the shell (see the help
  // overlay above) -- vim and Claude Code both live on it. Chromium's Keyboard Lock hands it
  // back: while locked, a tap reaches the terminal and *holding* Escape exits. Elsewhere the
  // lock does not exist and a tap exits full screen, which the help page says.
  //
  // The prefixed pair is Safari on iPad. iPhone Safari has no element full screen at all, so
  // there the switch is hidden rather than offered and silently ignored.
  const fsSwitch = document.getElementById("fsswitch");
  const root = document.documentElement;
  const fsEnabled = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
  if (!fsEnabled) fsSwitch.hidden = true;
  function syncFsSwitch() {
    const on = !!fsElement();
    setSwitch(fsSwitch, on);
    if (on) navigator.keyboard?.lock?.(["Escape"]).catch(() => {});
    else navigator.keyboard?.unlock?.();
  }
  fsSwitch.onclick = () => {
    const p = fsElement()
      ? (document.exitFullscreen || document.webkitExitFullscreen).call(document)
      : (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    Promise.resolve(p).catch(() => {});
  };
  document.addEventListener("fullscreenchange", syncFsSwitch);
  document.addEventListener("webkitfullscreenchange", syncFsSwitch);
  syncFsSwitch();

  // Keep focus in the terminal when these are clicked.
  //
  // `tabindex="-1"` stops these buttons being *tabbed* to; it does not stop a click focusing
  // them, and Chromium and Firefox both do. Opening the panel therefore moved focus to the
  // toggle, `#panel.open ~ #panelbtn` then un-rendered it, and focus fell to <body> -- where
  // xterm.js, which listens only on its own hidden textarea, never sees a keystroke. Everything
  // typed while the panel was open was silently discarded. Safari happened to escape it because
  // WebKit does not focus buttons on click, so this broke on the desktop browser and worked on
  // the phone. Verified with a synthesized mouse press: focus went to BODY and the socket
  // received nothing.
  //
  // Suppressed at mousedown rather than fixed with term.focus() afterwards, because focusing the
  // terminal on *open* raises the iOS keyboard over the panel that was just opened. A taps
  // synthesizes this same sequence, so one listener covers both.
  // Upload panel — the ↑ flyout. A drop zone (or click) queues files; each is one
  // POST /api/v1/uploads with the file itself as application/octet-stream, never a form: the
  // server refuses the content types a cross-site <form> can send, and that refusal is its CSRF
  // defence. XMLHttpRequest rather than fetch, because only XHR reports upload progress.
  // Sequential, so a batch reports in order and the disk sees one writer.
  //
  // A batch is everything queued until the queue next drains, files added mid-upload included;
  // its summary replaces the progress rows when it ends. Names are untrusted (anyone past the
  // gate can upload), so every one reaches the page through textContent and never innerHTML.
  const upPanel = document.getElementById("uppanel");
  const upBtn = document.getElementById("upbtn");
  const upClose = document.getElementById("upclose");
  const upFile = document.getElementById("upfile");
  const upDrop = document.getElementById("updrop");
  const upQueue = document.getElementById("upqueue");
  const upResult = document.getElementById("upresult");
  const upList = document.getElementById("uplist");
  const upCount = document.getElementById("upcount");
  const upDirEl = document.getElementById("updir");
  const toast = document.getElementById("toast");
  let upMax = 0;            // Meta.maxUploadBytes; 0 until known, and then nothing is pre-checked
  let batch = [];           // {file, name, state, el, xhr, saved, why}
  let pumping = false;
  const fresh = new Set();  // names saved by the last batch, highlighted in the list

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  // Decimal-looking units for a file the user picked, unlike the host panel's fmtBytes, which
  // matches `free`; a file manager is what this figure gets lined up against.
  function fmtSize(n) {
    if (n < 1024) return n + " B";
    const u = ["KB", "MB", "GB"];
    let i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return (n < 10 ? n.toFixed(1).replace(/\.0$/, "") : Math.round(n)) + " " + u[i];
  }
  function fmtAge(iso) {
    const s = (Date.now() - Date.parse(iso)) / 1000;
    if (!(s >= 0)) return "";
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    if (s < 7 * 86400) return Math.floor(s / 86400) + "d ago";
    return new Date(iso).toISOString().slice(0, 10);
  }

  let toastTimer = 0;
  function showToast(text, bad) {
    toast.textContent = text;
    toast.classList.toggle("bad", !!bad);
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, bad ? 8000 : 4000);
  }

  function setUpPanel(open) {
    if (open) { panel.classList.remove("open"); panelPolling(false); }
    upPanel.classList.toggle("open", open);
    if (open) { toast.hidden = true; loadUploads(); }
    // Pointer-only like the host panel: closing hands focus straight back to the shell.
    if (!open) term.focus();
  }
  upBtn.onclick = () => setUpPanel(true);
  upClose.onclick = () => setUpPanel(false);

  // --- queueing
  function enqueue(files, rejects) {
    upResult.hidden = true;
    if (!pumping) { batch = []; fresh.clear(); }
    for (const r of rejects || []) addItem(r.name, null, "failed", r.why);
    for (const f of files) {
      if (upMax && f.size > upMax) addItem(f.name, f, "failed", "over the " + fmtSize(upMax) + " limit");
      else addItem(f.name, f, "pending");
    }
    pump();
  }
  function addItem(name, file, state, why) {
    const it = { name, file, state, why, xhr: null, saved: null };
    it.el = el("div", "upitem");
    const top = el("div", "uptop");
    const nm = el("span", "upname", name);
    nm.title = name;
    it.stat = el("span", "upstat");
    it.cancel = el("button", "upcancel", "×");
    it.cancel.setAttribute("aria-label", "cancel " + name);
    it.cancel.tabIndex = -1;
    it.cancel.onclick = () => cancelItem(it);
    top.append(nm, it.stat, it.cancel);
    it.bar = el("i");
    const bar = el("div", "pbar");
    bar.append(it.bar);
    it.el.append(top, bar);
    upQueue.append(it.el);
    batch.push(it);
    paintItem(it);
    return it;
  }
  function paintItem(it, loaded) {
    const total = it.file ? it.file.size : 0;
    let pct = 0, text = "";
    switch (it.state) {
      case "pending": text = "waiting · " + fmtSize(total); break;
      case "uploading":
        pct = total ? Math.min(100, (loaded || 0) / total * 100) : 0;
        text = Math.floor(pct) + "% · " + fmtSize(loaded || 0) + " / " + fmtSize(total);
        if (loaded >= total) text = "saving…";
        break;
      case "done": pct = 100; text = "done"; break;
      case "failed": text = "failed"; break;
      case "cancelled": text = "cancelled"; break;
    }
    it.bar.style.width = pct + "%";
    it.stat.textContent = text;
    it.cancel.hidden = !(it.state === "pending" || it.state === "uploading");
  }
  function cancelItem(it) {
