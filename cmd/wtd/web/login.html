<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wtd — sign in</title>
<style>
:root { --bg:#ffffff; --fg:#1f2328; --link:#0969da; --border:#d1d9e0; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0d1117; --fg:#e6edf3; --link:#4493f8; --border:#3d444d; }
}
body { font: 16px/1.5 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg);
       margin: 0; padding: 0 1rem; }
form { max-width: 20rem; margin: 20vh auto 0; }
input { box-sizing: border-box; width: 100%; font-size: 1rem; padding: .6em .7em; margin: .5rem 0;
        border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--fg); }
button { width: 100%; font-size: 1rem; padding: .6em; border: 0; border-radius: 6px;
         background: var(--link); color: #fff; cursor: pointer; }
p.error { color: #d1242f; }
</style>
</head>
<body>
<form method="post" action="{{.Action}}">
  <input type="hidden" name="next" value="{{.Next}}">
  <input type="password" name="password" placeholder="Password" autocomplete="current-password"
         autofocus required>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <button type="submit">Sign in</button>
</form>
</body>
</html>
